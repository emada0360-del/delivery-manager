<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة التوصيل - Baqubah Delivery</title>
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#0f172a;--c:#1e293b;--t:#f8fafc;--m:#94a3b8;--a:#f59e0b;--g:#10b981;--r:#ef4444;--b:#334155}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.6 system-ui,-apple-system,sans-serif}
header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
header b{font-size:17px;color:var(--a)}
header button{background:transparent;border:1px solid #475569;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.main-container{max-width:680px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:10px}
input{padding:11px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;width:100%;outline:none}
input:focus{border-color:var(--a)}
button.btn-main{font:inherit;padding:10px 16px;border-radius:8px;border:none;background:var(--a);color:#0f172a;font-weight:bold;cursor:pointer}
button.d{background:none;color:var(--r);border:1px solid var(--r);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
.succ{color:var(--g);font-weight:bold;font-size:13px;text-align:center}
.ok{margin:12px;padding:8px 12px;border-radius:10px;background:#064e3b;color:#a7f3d0;font-size:13px;text-align:center}
.banner{margin:12px;padding:12px;border-radius:10px;background:#7f1d1d;color:#fecaca;font-weight:bold;word-break:break-word}
.empty{text-align:center;color:var(--m);padding:32px}
</style>
</head>
<body>

<div id="app">
  <header>
    <b>لوحة المدير (Baqubah Delivery)</b>
    <button @click="loadAll">تحديث البيانات 🔄</button>
  </header>

  <div class="main-container">
    <div v-if="banner" class="banner">{{ banner }}</div>
    <div v-else class="ok">متصل بقاعدة البيانات السحابية بنجاح ✅</div>

    <div class="card f">
      <h3 class="font-bold text-amber-400">إضافة منطقة جديدة</h3>
      <input v-model="newArea.name" placeholder="اسم المنطقة (مثال: حي العبور)">
      <input v-model.number="newArea.price" type="number" placeholder="الكروة (مثال: 3000)">
      <button class="btn-main" :disabled="saving" @click="addArea">
        {{ saving ? 'جاري الحفظ في السيرفر...' : 'حفظ المنطقة' }}
      </button>
      <div v-if="saveMsg" class="succ">{{ saveMsg }}</div>
    </div>

    <div class="card">
      <h3 class="font-bold mb-3 text-amber-400">المناطق المضافة بالسيرفر</h3>
      <div v-if="loadingAreas" class="empty">جاري جلب البيانات من الفايربيس...</div>
      <div v-else-if="!areas.length" class="empty">لا توجد مناطق مضافة حتى الآن</div>
      <div v-for="a in areas" :key="a.id" class="p-3 mb-2 rounded bg-slate-800 border border-slate-700 row">
        <div>
          <b class="text-lg block">{{ a.name }}</b>
          <span class="text-amber-400 font-semibold">{{ a.price }} د.ع</span>
        </div>
        <button class="d" @click="deleteArea(a.id)">حذف</button>
      </div>
    </div>
  </div>
</div>

<script>
const PROJ = "baqubah-delivery";
const DBID = "(default)";
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/${DBID}/documents`;

const { createApp, ref, reactive, onMounted } = Vue;

createApp({
  setup() {
    const areas = ref([]);
    const loadingAreas = ref(true);
    const saving = ref(false);
    const saveMsg = ref('');
    const banner = ref('');
    const newArea = reactive({ name: '', price: null });

    const decVal = f => {
      if (!f) return '';
      if (f.stringValue !== undefined) return f.stringValue;
      if (f.integerValue !== undefined) return Number(f.integerValue);
      if (f.doubleValue !== undefined) return Number(f.doubleValue);
      return '';
    };

    const loadAll = async () => {
      loadingAreas.value = true;
      try {
        const res = await fetch(`${BASE}/areas?pageSize=100`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'فشل الاتصال بـ Firestore');
        
        areas.value = (data.documents || []).map(doc => {
          const fields = doc.fields || {};
          return {
            id: doc.name.split('/').pop(),
            name: decVal(fields.name),
            price: decVal(fields.price)
          };
        });
        banner.value = '';
      } catch (e) {
        banner.value = 'تعذّر الاتصال بقاعدة البيانات: ' + e.message;
      } finally {
        loadingAreas.value = false;
      }
    };

    const addArea = async () => {
      if (!newArea.name || !newArea.price) return alert('يرجى كتابة اسم المنطقة والسعر');
      saving.value = true;
      saveMsg.value = '';
      try {
        const payload = {
          fields: {
            name: { stringValue: newArea.name.trim() },
            price: { integerValue: Number(newArea.price) }
          }
        };
        const res = await fetch(`${BASE}/areas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'فشل الحفظ');
        
        newArea.name = '';
        newArea.price = null;
        saveMsg.value = 'تم حفظ المنطقة بالسيرفر بنجاح ✅';
        await loadAll();
        setTimeout(() => saveMsg.value = '', 3000);
      } catch (e) {
        alert('خطأ أثناء الحفظ: ' + e.message);
      } finally {
        saving.value = false;
      }
    };

    const deleteArea = async (id) => {
      if (!confirm('هل أنت متأكد من حذف هذه المنطقة؟')) return;
      try {
        const res = await fetch(`${BASE}/areas/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('فشل الحذف من السيرفر');
        await loadAll();
      } catch (e) {
        alert('خطأ أثناء الحذف: ' + e.message);
      }
    };

    onMounted(() => {
      loadAll();
    });

    return { areas, loadingAreas, saving, saveMsg, banner, newArea, loadAll, addArea, deleteArea };
  }
}).mount('#app');
</script>
</body>
</html>
