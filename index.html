<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدير السحابية (Baqubah Delivery)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-amber-500 mb-6 text-center">لوحة المدير السحابية (Baqubah Delivery)</h1>

        <!-- قسم إضافة منطقة -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-3">إضافة منطقة جديدة</h2>
            <input type="text" id="area-name" placeholder="اسم المنطقة" class="w-full p-2 mb-3 bg-slate-700 rounded border border-slate-600 text-white">
            <input type="number" id="area-price" placeholder="الكروة (السعر)" class="w-full p-2 mb-3 bg-slate-700 rounded border border-slate-600 text-white">
            <button id="add-area-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-2 rounded transition">إضافة منطقة</button>
        </div>

        <!-- قسم عرض المناطق -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-3">المناطق المضافة بالسيرفر</h2>
            <div id="status-message" class="text-gray-400 text-center py-2">جاري جلب المناطق المضافة من السيرفر...</div>
            <div id="areas-container" class="grid gap-3"></div>
        </div>
    </div>

    <script>
        const PROJECT_ID = "baqubah-delivery";
        const API_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/areas`;

        const statusMsg = document.getElementById("status-message");
        const areasContainer = document.getElementById("areas-container");
        const addBtn = document.getElementById("add-area-btn");

        // دالة جلب المناطق عبر REST API المباشر
        async function fetchAreas() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("فشل الاتصال بالسيرفر");
                const data = await response.json();
                
                areasContainer.innerHTML = "";
                if (!data.documents || data.documents.length === 0) {
                    statusMsg.textContent = "لا توجد مناطق مضافة بالسيرفر حتى الآن";
                    return;
                }

                statusMsg.textContent = "";
                data.documents.forEach((doc) => {
                    const fields = doc.fields;
                    const docId = doc.name.split("/").pop();
                    const name = fields.name ? fields.name.stringValue : "بدون اسم";
                    const price = fields.price ? (fields.price.integerValue || fields.price.doubleValue) : 0;

                    const card = document.createElement("div");
                    card.className = "bg-slate-700 p-3 rounded flex justify-between items-center border border-slate-600";
                    card.innerHTML = `
                        <div>
                            <h3 class="font-bold text-lg">${name}</h3>
                            <p class="text-amber-400">${price} د.ع</p>
                        </div>
                        <button onclick="deleteArea('${docId}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm text-white transition">حذف</button>
                    `;
                    areasContainer.appendChild(card);
                });
            } catch (e) {
                statusMsg.textContent = "خطأ في الجلب: " + e.message;
            }
        }

        // دالة الإضافة المباشرة عبر HTTP POST
        addBtn.addEventListener("click", async () => {
            const nameInput = document.getElementById("area-name");
            const priceInput = document.getElementById("area-price");
            
            const name = nameInput.value.trim();
            const price = Number(priceInput.value);

            if (!name || !price) {
                alert("يرجى إدخال اسم المنطقة والسعر بشكل صحيح");
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = "جاري الحفظ في السيرفر...";

            const payload = {
                fields: {
                    name: { stringValue: name },
                    price: { integerValue: price },
                    createdAt: { stringValue: new Date().toISOString() }
                }
            };

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    nameInput.value = "";
                    priceInput.value = "";
                    alert("تم الحفظ في السيرفر بنجاح 100%!");
                    fetchAreas(); // إعادة جلب القائمة مباشرة
                } else {
                    const errData = await res.json();
                    alert("خطأ من السيرفر: " + (errData.error?.message || "فشل الإرسال"));
                }
            } catch (e) {
                alert("خطأ شبكة: " + e.message);
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = "إضافة منطقة";
            }
        });

        // دالة الحذف عبر DELETE HTTP
        window.deleteArea = async function(docId) {
            if (confirm("هل أنت متأكد من حذف هذه المنطقة؟")) {
                try {
                    const res = await fetch(`${API_URL}/${docId}`, { method: "DELETE" });
                    if (res.ok) {
                        fetchAreas();
                    } else {
                        alert("فشل الحذف من السيرفر");
                    }
                } catch (e) {
                    alert("خطأ في الحذف: " + e.message);
                }
            }
        };

        // تشغيل الجلب عند فتح الصفحة
        fetchAreas();
    </script>
</body>
</html>
