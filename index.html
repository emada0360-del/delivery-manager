<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 2rem; border-radius: 10px; width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { width: 100%; padding: 10px; background: #fff; color: #0f172a; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .error { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="box" id="loginBox">
        <h2>دخول المدير</h2>
        <input type="text" id="email" value="admin@baqubah.app">
        <input type="password" id="pass" value="199766">
        <button onclick="login()">دخول</button>
        <div id="err" class="error"></div>
    </div>
    <div class="box" id="dashBox" style="display:none;">
        <h2>مرحباً بك 👋</h2>
        <p>تم تسجيل الدخول بنجاح.</p>
        <button onclick="firebase.auth().signOut()">تسجيل الخروج</button>
    </div>
    <script>
        firebase.initializeApp({
            apiKey: "AIzaSyDvPf59YMY7BonaRIBFCcilfEXpdMo0F_M",
            authDomain: "baqubah-delivery.firebaseapp.com",
            projectId: "baqubah-delivery",
            storageBucket: "baqubah-delivery.firebasestorage.app",
            messagingSenderId: "607280279395",
            appId: "1:607280279395:web:859d9c7fb693a1b0b66d56"
        });
        firebase.auth().onAuthStateChanged(u => {
            document.getElementById('loginBox').style.display = u ? 'none' : 'block';
            document.getElementById('dashBox').style.display = u ? 'block' : 'none';
        });
        function login() {
            let e = document.getElementById('email').value;
            let p = document.getElementById('pass').value;
            firebase.auth().signInWithEmailAndPassword(e, p).catch(err => {
                let d = document.getElementById('err');
                d.textContent = err.message;
                d.style.display = 'block';
            });
        }
    </script>
</body>
</html>
