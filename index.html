<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تطبيق التوصيل</title>
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h2 { margin-bottom: 1.5rem; color: #f8fafc; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: #f8fafc; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #e2e8f0; }
        .error { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; display: none; direction: ltr; text-align: right; background: #331111; padding: 8px; border-radius: 6px; }
        .dashboard { display: none; text-align: right; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginSection" class="card">
        <h2>دخول المدير</h2>
        <input type="text" id="username" placeholder="اليوزر أو البريد" value="admin@baqubah.app">
        <input type="password" id="password" placeholder="كلمة المرور" value="199766">
        <button id="loginBtn" onclick="login()">دخول</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- شاشة لوحة التحكم عند الدخول -->
    <div id="dashboardSection" class="card dashboard">
        <h2>مرحباً بك في لوحة التحكم 👋</h2>
        <p>تم تسجيل الدخول بنجاح كـ مدير للنظام.</p>
        <button onclick="logout()">تسجيل الخروج</button>
    </div>

    <script>
        // إعدادات Firebase الصحيحة والمحدثة
        const firebaseConfig = {
            apiKey: "AIzaSyDvPfS9YMY7BonaRIBFCcilfEXpdMo0F_M",
            authDomain: "baqubah-delivery.firebaseapp.com",
            projectId: "baqubah-delivery",
            storageBucket: "baqubah-delivery.firebasestorage.app",
            messagingSenderId: "607280279395",
            appId: "1:607280279395:web:859d9c7fb693a1b0b66d56"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // مراقبة حالة التسجيل
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
            } else {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('dashboardSection').style.display = 'none';
            }
        });

        // دالة تسجيل الدخول
        async function login() {
            const userInput = document.getElementById('username').value.trim();
            const passInput = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            
            errorEl.style.display = 'none';

            if (!userInput || !passInput) {
                errorEl.textContent = 'يرجى إدخال اليوزر وكلمة المرور';
                errorEl.style.display = 'block';
                return;
            }

            const email = userInput.includes('@') ? userInput : `${userInput}@baqubah.app`;

            try {
                btn.textContent = 'جاري التحقق...';
                btn.disabled = true;

                const userCredential = await auth.signInWithEmailAndPassword(email, passInput);
                const user = userCredential.user;

                // التحقق من إنشاء مستند الصلاحيات في Firestore تلقائياً
                const userDocRef = db.collection('users').doc(user.uid);
                const doc = await userDocRef.get();

                if (!doc.exists) {
                    await userDocRef.set({
                        role: 'admin',
                        name: 'المدير',
                        username: 'admin',
                        active: true
                    });
                }
            } catch (error) {
                console.error(error);
                btn.textContent = 'دخول';
                btn.disabled = false;
                errorEl.textContent = 'خطأ Firebase: ' + error.message;
                errorEl.style.display = 'block';
            }
        }

        // دالة تسجيل الخروج
        function logout() {
            auth.signOut();
        }
    </script>
</body>
</html>
