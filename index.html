<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المدير السحابية (Baqubah Delivery)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold text-amber-500 mb-6 text-center">لوحة المدير السحابية (Baqubah Delivery)</h1>

        <!-- قسم إضافة منطقة -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-3">إضافة منطقة جديدة</h2>
            <input type="text" id="area-name" placeholder="اسم المنطقة" class="w-full p-2 mb-3 bg-slate-700 rounded border border-slate-600 text-white">
            <input type="number" id="area-price" placeholder="الكروة (السعر)" class="w-full p-2 mb-3 bg-slate-700 rounded border border-slate-600 text-white">
            <button id="add-area-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-2 rounded transition">إضافة منطقة</button>
        </div>

        <!-- قسم عرض المناطق -->
        <div class="bg-slate-800 p-4 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-3">المناطق المضافة بالسيرفر</h2>
            <div id="status-message" class="text-gray-400 text-center py-2">جاري جلب المناطق المضافة من السيرفر...</div>
            <div id="areas-container" class="grid gap-3"></div>
        </div>
    </div>

    <!-- سكربت الفايربيس الرسمي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            addDoc, 
            deleteDoc, 
            doc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDvPfS9YMY7BonaRIBFCcilfEXpdMo0F_M",
            authDomain: "baqubah-delivery.firebaseapp.com",
            projectId: "baqubah-delivery",
            storageBucket: "baqubah-delivery.firebasestorage.app",
            messagingSenderId: "607280279395",
            appId: "1:607280279395:web:859d9c7fb693a1b0b66d56"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const statusMsg = document.getElementById("status-message");
        const areasContainer = document.getElementById("areas-container");
        const addBtn = document.getElementById("add-area-btn");

        // جلب واستماع حي للمناطق
        onSnapshot(collection(db, "areas"), (snapshot) => {
            areasContainer.innerHTML = "";
            if (snapshot.empty) {
                statusMsg.textContent = "لا توجد مناطق مضافة بالسيرفر حتى الآن";
                return;
            }
            statusMsg.textContent = "";
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const areaId = docSnap.id;

                const card = document.createElement("div");
                card.className = "bg-slate-700 p-3 rounded flex justify-between items-center border border-slate-600";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-lg">${data.name}</h3>
                        <p class="text-amber-400">${data.price} د.ع</p>
                    </div>
                    <button onclick="deleteArea('${areaId}')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm text-white transition">حذف</button>
                `;
                areasContainer.appendChild(card);
            });
        }, (error) => {
            console.error("خطأ:", error);
            statusMsg.textContent = "خطأ في الاتصال: " + error.message;
        });

        // إضافة منطقة جديدة
        addBtn.addEventListener("click", async () => {
            const nameInput = document.getElementById("area-name");
            const priceInput = document.getElementById("area-price");
            
            const name = nameInput.value.trim();
            const price = Number(priceInput.value);

            if (!name || !price) {
                alert("يرجى إدخال اسم المنطقة والسعر بشكل صحيح");
                return;
            }

            addBtn.disabled = true;
            addBtn.textContent = "جاري الحفظ في السيرفر...";

            try {
                await addDoc(collection(db, "areas"), {
                    name: name,
                    price: price,
                    createdAt: new Date().toISOString()
                });
                nameInput.value = "";
                priceInput.value = "";
            } catch (e) {
                console.error("خطأ بالحفظ:", e);
                alert("فشل الحفظ: " + e.message);
            } finally {
                addBtn.disabled = false;
                addBtn.textContent = "إضافة منطقة";
            }
        });

        // حذف منطقة
        window.deleteArea = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذه المنطقة؟")) {
                try {
                    await deleteDoc(doc(db, "areas", id));
                } catch (e) {
                    alert("خطأ أثناء الحذف: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
