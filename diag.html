<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص الاتصال</title>
<style>
body{margin:0;padding:14px;font-family:system-ui,Tahoma,Arial;background:#f2f5f9;color:#172235;font-size:15px}
h2{margin:6px 0 12px}
.r{background:#fff;border:1px solid #e0e6ef;border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.6;word-break:break-word}
.ok{border-right:5px solid #218838}.bad{border-right:5px solid #c93030;background:#fff5f5}.wait{border-right:5px solid #bd7200}
small{color:#64748b;display:block;direction:ltr;text-align:left}
</style>
</head>
<body>
<h2>فحص الاتصال <small style="display:inline">diag v1</small></h2>
<div id="out"></div>
<script>
var out=document.getElementById('out');
function line(text,cls,detail){var d=document.createElement('div');d.className='r '+(cls||'wait');d.textContent=text;if(detail){var s=document.createElement('small');s.textContent=detail;d.appendChild(s);}out.appendChild(d);return d;}
function upd(d,text,cls,detail){d.className='r '+cls;d.textContent=text;if(detail){var s=document.createElement('small');s.textContent=detail;d.appendChild(s);}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('انتهت المهلة '+(ms/1000)+' ثانية'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var dimp=function(u){return (new Function('u','return import(u)'))(u);};
var B='https://www.gstatic.com/firebasejs/11.6.0/';
var NEW={apiKey:"AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc",authDomain:"baqubah-delivery-e729e.firebaseapp.com",databaseURL:"https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app/",projectId:"baqubah-delivery-e729e",appId:"1:450084520701:web:719e2040338540ce36f494"};
var OLD={apiKey:"AIzaSyDk2oEJvtp-ZHu8I-3NsD_IN4nMSdqDgDA",authDomain:"baqubahdb.firebaseapp.com",databaseURL:"https://baqubahdb-default-rtdb.europe-west1.firebasedatabase.app",projectId:"baqubahdb",appId:"1:288719635298:web:1e5528018a061c56e8a23b"};

(async function(){
 line('1) الجافاسكربت يشتغل ✓','ok',navigator.userAgent);
 var m={};
 var names=['app','auth','database'];
 for(var i=0;i<names.length;i++){
  var n=names[i],d=line('2) تحميل مكتبة '+n+' (طريقة modules) ...','wait');var t0=Date.now();
  try{m[n]=await withTimeout(dimp(B+'firebase-'+n+'.js'),60000);upd(d,'2) مكتبة '+n+' تحمّلت ✓ ('+((Date.now()-t0)/1000).toFixed(1)+' ثانية)','ok');}
  catch(e){upd(d,'2) مكتبة '+n+' فشل تحميلها ✗','bad',String(e&&e.message||e));}
 }
 if(!(m.app&&m.auth&&m.database)){line('توقف الفحص: المكتبات ما تحمّلت بطريقة modules. هذا هو سبب عدم اشتغال الصفحات.','bad');}
 else{
  var res={};
  for(var pair of [['الجديد (المتجر/السائق)',NEW,'new'],['القديم (اللي يشتغل عندك)',OLD,'old']]){
   var label=pair[0],cfg=pair[1],key=pair[2];
   var d3=line('3) مشروع '+label+': إنشاء التطبيق ...','wait');
   try{
    var app=m.app.initializeApp(cfg,key);var auth=m.auth.getAuth(app);var db=m.database.getDatabase(app);
    upd(d3,'3) مشروع '+label+': إنشاء التطبيق ✓','ok');
   }catch(e){upd(d3,'3) مشروع '+label+': إنشاء التطبيق ✗','bad',String(e&&e.message||e));continue;}
   var d4=line('4) مشروع '+label+': اتصال تسجيل الدخول ...','wait');
   try{
    await withTimeout(m.auth.signInWithEmailAndPassword(auth,'test0000@baqubah.app','wrongpass123'),30000);
    upd(d4,'4) مشروع '+label+': دخل (غير متوقع)','ok');
   }catch(e){
    var c=e&&e.code||String(e);
    if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password','auth/invalid-email'].indexOf(c)>=0)upd(d4,'4) مشروع '+label+': Firebase Auth يستجيب ✓','ok',c);
    else upd(d4,'4) مشروع '+label+': مشكلة بالاتصال بـ Auth ✗','bad',c+' | '+(e&&e.message||''));
   }
   var d5=line('5) مشروع '+label+': اتصال قاعدة البيانات ...','wait');
   try{
    var u=cfg.databaseURL.replace(/\/$/,'')+'/.json?shallow=true';
    var r=await withTimeout(fetch(u),30000);var txt=(await r.text()).slice(0,80);
    upd(d5,'5) مشروع '+label+': قاعدة البيانات تستجيب ✓ (رمز '+r.status+')','ok',txt);
   }catch(e){upd(d5,'5) مشروع '+label+': قاعدة البيانات لا تستجيب ✗','bad',String(e&&e.message||e));}
  }
 }
 // compat scripts test
 var d6=line('6) تحميل مكتبة compat (طريقة المتجر) ...','wait');var t1=Date.now();
 try{
  await withTimeout(new Promise(function(res,rej){var s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js';s.onload=res;s.onerror=function(){rej(new Error('فشل'));};document.head.appendChild(s);}),60000);
  upd(d6,'6) مكتبة compat تحمّلت ✓ ('+((Date.now()-t1)/1000).toFixed(1)+' ثانية)','ok');
 }catch(e){upd(d6,'6) مكتبة compat فشلت ✗','bad',String(e&&e.message||e));}
 line('انتهى الفحص. صوّر الشاشة كاملة وأرسلها.','ok');
})();
</script>
