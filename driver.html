<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>دلفري حر | السائق</title>
<style>
:root{--bg:#f1f5f9;--ink:#0f172a;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--line:#e2e8f0;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:50px}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:14px 20px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:not-allowed;transform:none}
input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0 16px;font-size:16px;outline:none}
input:focus{border-color:var(--pri)}
label{font-size:14px;font-weight:700;color:#64748b;display:block;margin-top:8px}
header{background:#1e293b;color:#fff;padding:16px 20px;padding-top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h2{margin:0;font-size:18px}
main{max-width:600px;margin:auto;padding:20px 16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.stat-card span{font-size:12px;font-weight:700;color:#64748b;display:block;margin-bottom:6px}
.stat-card b{font-size:20px;color:var(--pri)}
.status-btn{width:100%;padding:20px;font-size:18px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:center;align-items:center;gap:10px}
.status-btn.on{background:var(--ok)}
.status-btn.off{background:#cbd5e1;color:#475569}
.status-btn.blocked{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
.status-dot{width:12px;height:12px;border-radius:50%;background:#fff}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.card.new{border:2px solid var(--pri)}
.card.waiting{border:2px solid var(--warn);background:#fffbeb}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;background:#e0f2fe;color:#0369a1}
.badge.wait{background:#fef3c7;color:#b45309}
.receipt{background:#f8fafc;border-radius:12px;padding:16px;margin:16px 0;border:1px dashed #cbd5e1;font-size:14px}
.receipt-row{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600;color:#64748b}
.receipt-row.pay{color:var(--bad)}.receipt-row.collect{color:var(--pri)}
.receipt-row.profit{color:var(--ok);border-top:1px solid var(--line);padding-top:10px;font-weight:800}
.receipt-debt{background:#fff1f2;border-radius:8px;padding:12px;margin-top:12px;border:1px solid #fecdd3}
.receipt-debt .receipt-row{color:#b42318;font-size:13px;margin-bottom:4px}
.info-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.info-box.blue{background:#eff6ff;border-color:#bfdbfe}
.info-box b{display:block;font-size:13px;color:#475569;margin-bottom:4px}
.info-box span{font-size:15px;font-weight:800;direction:ltr;display:inline-block}
.btn-group{display:flex;gap:6px}
.btn-sm{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;background:#e0f2fe;color:#0369a1}
.btn-wa{background:#dcfce7;color:#166534}
.map-link{display:inline-block;background:#e0f2fe;color:#0369a1;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;margin-bottom:10px}
#msg{position:fixed;top:70px;left:16px;right:16px;z-index:99;padding:12px;border-radius:12px;font-weight:700;text-align:center;display:none;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#net{background:#b91c1c;color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:700}
#login{max-width:400px;margin:10vh auto;padding:30px;background:#fff;border-radius:20px}
#login h2{text-align:center;color:var(--pri);margin-top:0}
#err{color:var(--bad);text-align:center;font-size:14px;font-weight:700;min-height:20px}
h3{margin:0 0 12px;font-size:18px}
.empty{text-align:center;color:#94a3b8;font-weight:700;padding:30px 0}
[hidden]{display:none!important}
.action-row{display:flex;gap:10px;margin-top:16px}
.action-row button{flex:1}
.full{width:100%;margin-top:16px}
</style>
</head>
<body>

<section id="login">
<h2>دلفري حر</h2>
<p style="text-align:center;color:#64748b;font-weight:600">بوابة السائقين</p>
<label>رقم الهاتف</label>
<input id="un" type="tel" inputmode="numeric" placeholder="07XXXXXXXXX" autocomplete="username">
<label>كلمة المرور</label>
<input id="pw" type="password" autocomplete="current-password">
<button id="btnLogin" style="width:100%">تسجيل الدخول</button>
<p id="err"></p>
</section>

<div id="app" hidden>
<div id="net" hidden>لا يوجد اتصال بالإنترنت</div>
<header><h2 id="drvName">السائق</h2><button id="btnOut" style="background:#dc2626;padding:8px 12px;font-size:13px">خروج</button></header>
<main>
<div id="msg"></div>
<div class="stats-grid">
 <div class="stat-card"><span>محفظتي (دين للمنصة)</span><b id="statDebt">0</b></div>
 <div class="stat-card"><span>أرباحي اليوم</span><b id="statProfit">0</b></div>
 <div class="stat-card"><span>طلبات اليوم</span><b id="statCount">0</b></div>
 <div class="stat-card"><span>إجمالي أرباحي</span><b id="statTotal">0</b></div>
</div>
<div id="warnBox" class="card" style="background:#fdecea;color:#b42318;font-weight:700;text-align:center" hidden>تنبيه: وصلت للحد الأقصى من الدين. راجع الإدارة لتصفير المحفظة.</div>
<button id="btnStatus" class="status-btn off"><span class="status-dot"></span><span id="statusTxt">غير متصل (مغلق)</span></button>
<div id="annBox" class="card" style="background:#fffbeb;color:#b45309;font-weight:700;text-align:center" hidden></div>
<div id="availContainer" hidden><h3>الطلبات المتاحة</h3><div id="availList"></div></div>
<div id="activeContainer" hidden><h3>طلباتي الحالية</h3><div id="activeList"></div></div>
<div id="idle" class="empty" hidden>لا توجد طلبات حالياً، بانتظار طلب جديد...</div>
</main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getDatabase,ref,set,update,onValue,get,query,orderByChild,equalTo,onDisconnect,serverTimestamp,runTransaction} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const cfg={
 apiKey:"AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc",
 authDomain:"baqubah-delivery-e729e.firebaseapp.com",
 databaseURL:"https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app/",
 projectId:"baqubah-delivery-e729e",
 storageBucket:"baqubah-delivery-e729e.firebasestorage.app",
 messagingSenderId:"450084520701",
 appId:"1:450084520701:web:719e2040338540ce36f494"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const num=v=>Number(v)||0;
const fmt=n=>num(n).toLocaleString("en-US");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let uid=null,driver=null,settings={},isOnline=false,pos={lat:null,lng:null};
let availOrders={},activeOrders={},allMyOrders={},finance={},privData={};
let currentDebt=0,debtLimit=15000,gpsId=null,lastAvailCount=0,lastPush=0,wakeLock=null,unsubs=[],lastHtml={};
const lastStatus={};

const speak=t=>{try{const S=window.speechSynthesis;if(!S)return;S.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";S.speak(u)}catch{}};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
let msgT;
function say(t,bad){const m=$("msg");m.textContent=t;m.style.display="block";m.style.background=bad?"#fee2e2":"#dcfce7";m.style.color=bad?"#b91c1c":"#15803d";clearTimeout(msgT);msgT=setTimeout(()=>m.style.display="none",4000)}
const hasActive=()=>Object.keys(activeOrders).length>0;
const setHtml=(id,h)=>{if(lastHtml[id]!==h){lastHtml[id]=h;$(id).innerHTML=h}};

async function wake(){try{if("wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}}catch{}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&isOnline)wake()});
addEventListener("online",()=>$("net").hidden=true);
addEventListener("offline",()=>$("net").hidden=false);

async function doLogin(){
 $("err").textContent="";const b=$("btnLogin");b.disabled=true;b.textContent="جاري الدخول...";
 try{await signInWithEmailAndPassword(auth,$("un").value.trim()+"@baqubah.app",$("pw").value)}
 catch{$("err").textContent="رقم الهاتف أو كلمة المرور غير صحيحة."}
 finally{b.disabled=false;b.textContent="تسجيل الدخول"}
}
$("btnLogin").onclick=doLogin;
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});

$("btnOut").onclick=async()=>{
 if(hasActive())return say("لا يمكنك الخروج ولديك طلبات نشطة!",1);
 try{if(uid)await set(ref(db,"presence/"+uid),{online:false,lastSeen:serverTimestamp()})}catch{}
 stopAll();signOut(auth);
};

function stopAll(){
 unsubs.forEach(f=>{try{f()}catch{}});unsubs=[];
 if(gpsId!==null){navigator.geolocation.clearWatch(gpsId);gpsId=null}
 try{wakeLock&&wakeLock.release()}catch{}
 uid=null;isOnline=false;availOrders={};activeOrders={};allMyOrders={};finance={};privData={};lastHtml={};
}

onAuthStateChanged(auth,async u=>{
 if(!u){stopAll();$("login").hidden=false;$("app").hidden=true;return}
 try{
  const snap=await get(ref(db,"users/"+u.uid));
  const user=snap.val();
  if(!user||user.role!=="driver"||user.isActive===false){
   await signOut(auth);$("err").textContent="هذا الحساب غير مصرح له أو معطل.";return;
  }
  uid=u.uid;driver=user;
  $("drvName").textContent=user.name||"السائق";
  $("login").hidden=true;$("app").hidden=false;
  start();
 }catch(e){await signOut(auth);$("err").textContent="تعذر تحميل بيانات الحساب، تحقق من الإنترنت."}
});

function startGPS(){
 if(gpsId!==null)return;
 if(!navigator.geolocation)return say("المتصفح لا يدعم تحديد الموقع",1);
 gpsId=navigator.geolocation.watchPosition(p=>{
  pos.lat=p.coords.latitude;pos.lng=p.coords.longitude;
  const now=Date.now();
  if(uid&&isOnline&&now-lastPush>15000){
   lastPush=now;
   update(ref(db,"presence/"+uid),{lat:pos.lat,lng:pos.lng,locAt:now}).catch(()=>{});
  }
 },e=>{if(e.code===1)say("فعّل صلاحية الموقع (GPS) للمتصفح",1)},{enableHighAccuracy:true,maximumAge:5000});
}

const on=(q,cb)=>unsubs.push(onValue(q,cb,e=>console.warn("DB:",e.message)));

function start(){
 startGPS();
 on(ref(db,"settings"),s=>{
  settings=s.val()||{};debtLimit=num(settings.debtLimit)||15000;
  $("annBox").textContent=settings.announcement||"";$("annBox").hidden=!settings.announcement;
  drawStats();
 });
 const pr=ref(db,"presence/"+uid);
 on(pr,s=>{const st=s.val()||{};if(!hasActive())isOnline=st.online===true;updateStatusUI();drawOrders()});
 on(ref(db,".info/connected"),s=>{
  if(s.val()===true){
   onDisconnect(pr).set({online:false,lastSeen:serverTimestamp()});
   if(isOnline)set(pr,{online:true,lastSeen:serverTimestamp()});
  }
 });
 on(query(ref(db,"finance"),orderByChild("userId"),equalTo(uid)),s=>{finance=s.val()||{};drawStats()});
 on(query(ref(db,"orders"),orderByChild("status"),equalTo("pending")),s=>{
  availOrders=s.val()||{};drawOrders();
  const n=availForMe().length;
  if(n>lastAvailCount&&isOnline){buzz([300,100,300]);speak("طلب جديد")}
  lastAvailCount=n;
 });
 on(query(ref(db,"orders"),orderByChild("driverId"),equalTo(uid)),s=>{
  const prev=Object.assign({},lastStatus);
  allMyOrders=s.val()||{};activeOrders={};
  for(const k in allMyOrders){
   const st=allMyOrders[k].status;
   if(!["delivered","cancelled"].includes(st))activeOrders[k]=allMyOrders[k];
   if(prev[k]&&prev[k]!==st){
    if(st==="cancelled"){say("تم إلغاء الطلب #"+k.slice(-6),1);speak("تم إلغاء الطلب");buzz([500,200,500])}
    else if(st==="accepted"&&prev[k]==="waiting_store"){say("وافق المتجر، توجه للمتجر");speak("وافق المتجر");buzz(300)}
   }
   lastStatus[k]=st;
  }
  if(hasActive())isOnline=true;
  fetchPrivateData();updateStatusUI();drawOrders();drawStats();
 });
}

function fetchPrivateData(){
 for(const id in privData)if(!activeOrders[id])delete privData[id];
 Object.keys(activeOrders).forEach(id=>{
  if(privData[id])return;
  get(ref(db,"orderPrivate/"+id)).then(s=>{if(s.exists()){privData[id]=s.val();drawOrders()}}).catch(()=>{});
 });
}

function drawStats(){
 let debt=0,profit=0,count=0,total=0;
 const t0=new Date().setHours(0,0,0,0);
 for(const id in allMyOrders){
  const o=allMyOrders[id];
  if(o.status==="delivered"){
   debt+=Math.round(num(o.platformDeliveryCommission))+Math.round(num(o.storeCommission));
   total+=Math.round(num(o.driverProfit));
   if(num(o.deliveredAt)>=t0){profit+=Math.round(num(o.driverProfit));count++}
  }
 }
 for(const id in finance){if(finance[id].type==="cash_received")debt-=Math.round(num(finance[id].amount))}
 if(debt<0)debt=0;currentDebt=debt;
 $("statDebt").textContent=fmt(debt)+" د.ع";
 $("statProfit").textContent=fmt(profit)+" د.ع";
 $("statCount").textContent=fmt(count);
 $("statTotal").textContent=fmt(total)+" د.ع";
 $("warnBox").hidden=debt<debtLimit;
 updateStatusUI();
}

function toggleStatus(){
 if(!isOnline&&currentDebt>=debtLimit)return say("لا يمكنك الاتصال، تجاوزت سقف الدين",1);
 if(isOnline&&hasActive())return say("لا يمكنك الإغلاق ولديك طلبات نشطة",1);
 isOnline=!isOnline;
 set(ref(db,"presence/"+uid),{online:isOnline,lastSeen:serverTimestamp()}).catch(()=>say("فشل تحديث الحالة",1));
 if(isOnline){startGPS();wake();speak("أنت الآن متصل")}else speak("أنت الآن غير متصل");
 updateStatusUI();drawOrders();
}
$("btnStatus").addEventListener("click",toggleStatus);

function updateStatusUI(){
 const btn=$("btnStatus"),t=$("statusTxt");
 if(currentDebt>=debtLimit&&!hasActive()){
  if(isOnline){isOnline=false;if(uid)set(ref(db,"presence/"+uid),{online:false,lastSeen:serverTimestamp()}).catch(()=>{})}
  btn.className="status-btn blocked";t.textContent="محظور (تجاوزت سقف الدين)";return;
 }
 if(hasActive()){btn.className="status-btn on";t.textContent="متصل (لديك طلب نشط)";return}
 if(isOnline){btn.className="status-btn on";t.textContent="متصل (متاح للطلبات)"}
 else{btn.className="status-btn off";t.textContent="غير متصل (مغلق)"}
}

function finBox(o){
 const fee=num(o.deliveryFee),storeCom=num(settings.storeCommission)||500;
 const platformCom=Math.round(fee*.1),profit=Math.round(fee*.9);
 const payStore=Math.round(num(o.itemPrice)-storeCom),collect=Math.round(num(o.customerTotal));
 return `<div class="receipt">
 <div class="receipt-row pay"><span>تدفع للمتجر:</span><b>${fmt(payStore)} د.ع</b></div>
 <div class="receipt-row collect"><span>تستلم من الزبون:</span><b>${fmt(collect)} د.ع</b></div>
 <div class="receipt-row profit"><span>ربحك الصافي (الكروة):</span><b>${fmt(profit)} د.ع</b></div>
 <div class="receipt-debt">
  <div class="receipt-row"><span>عمولة المنصة (10%):</span><b>${fmt(platformCom)} د.ع</b></div>
  <div class="receipt-row"><span>عمولة المتجر (ثابتة):</span><b>${fmt(storeCom)} د.ع</b></div>
  <div class="receipt-row" style="border-top:1px dashed #fecdd3;padding-top:6px;margin:0"><span>سيضاف لدينك:</span><b>${fmt(platformCom+storeCom)} د.ع</b></div>
 </div></div>`;
}

function availForMe(){
 return Object.entries(availOrders).filter(([id,o])=>{
  if(o.driverId)return false;
  if(o.rejectedBy&&o.rejectedBy[uid])return false;
  if(hasActive())return (Date.now()-num(o.createdAt))>120000;
  return true;
 });
}

function drawOrders(){
 if(!uid)return;
 let av=[];
 if(isOnline&&currentDebt<debtLimit)av=availForMe();
 $("availContainer").hidden=!av.length;
 setHtml("availList",av.map(([id,o])=>`
 <div class="card new">
  <div class="card-header"><b>طلب #${esc(id.slice(-6))}</b></div>
  <p style="margin:6px 0;font-weight:700">المتجر: ${esc(o.storeName)}</p>
  <p style="margin:6px 0;font-weight:700">المنطقة: ${esc(o.area)}</p>
  ${o.storeMapUrl?`<a href="${esc(o.storeMapUrl)}" target="_blank" rel="noopener" class="map-link">📍 فتح موقع المتجر</a>`:""}
  ${finBox(o)}
  <div class="action-row">
   <button style="flex:2" data-act="accept" data-id="${esc(id)}">قبول الطلب</button>
   <button style="flex:1;background:var(--bad)" data-act="reject" data-id="${esc(id)}">رفض</button>
  </div>
 </div>`).join(""));

 const ac=Object.entries(activeOrders);
 $("activeContainer").hidden=!ac.length;
 $("idle").hidden=!(isOnline&&!av.length&&!ac.length);
 const now=Date.now();
 setHtml("activeList",ac.map(([id,o])=>{
  let btn="",warn="",badge="";const q=privData[id]||{};
  const left=ms=>Math.max(0,Math.ceil((ms-(now-num(o.stepAt)))/1000));
  if(o.status==="waiting_store"){
   badge=`<span class="badge wait">بانتظار موافقة المتجر</span>`;
   btn=`<div style="text-align:center;padding:16px;background:#fef3c7;color:#b45309;border-radius:12px;font-weight:800;margin-top:16px">يرجى الانتظار حتى يوافق المتجر...</div>
   <button class="full" style="background:#64748b" data-act="release" data-id="${esc(id)}">إلغاء قبولي للطلب</button>`;
  }else if(o.status==="accepted"){
   badge=`<span class="badge">بالطريق للمتجر</span>`;
   if(o.storeLat&&pos.lat){const d=getDist(pos.lat,pos.lng,o.storeLat,o.storeLng);if(d>300)warn=`<p style="color:var(--bad);font-size:13px;font-weight:800;text-align:center">أنت بعيد عن المتجر (${Math.round(d)}م)</p>`}
   btn=`<button class="full" style="background:var(--ok)" data-act="step" data-st="arrived_store" data-id="${esc(id)}">وصلت للمتجر</button>`;
  }else if(o.status==="arrived_store"){
   badge=`<span class="badge">وصل للمتجر</span>`;
   const s=left(60000);
   btn=`<button class="full" style="background:var(--ok)" ${s?"disabled":""} data-act="step" data-st="picked_up" data-id="${esc(id)}">${s?`انتظر ${s} ثانية...`:"تم استلام الطلب"}</button>`;
  }else if(["picked_up","delivering"].includes(o.status)){
   badge=`<span class="badge">بالطريق للزبون</span>`;
   const s=left(300000);
   btn=`<button class="full" style="background:var(--ok)" ${s?"disabled":""} data-act="step" data-st="delivered" data-id="${esc(id)}">${s?`انتظر ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`:"تم التوصيل للزبون"}</button>`;
  }
  const storeBox=`<div class="info-box"><div><b>هاتف المتجر</b><span>${esc(o.storePhone||"غير متوفر")}</span></div>${o.storePhone?`<div class="btn-group"><a href="tel:${esc(o.storePhone)}" class="btn-sm">📞 اتصال</a></div>`:""}</div>`;
  let cust="";
  if(q.customerPhone&&o.status!=="waiting_store"){
   const ph=String(q.customerPhone).replace(/\D/g,"").replace(/^0/,"");
   const wa="https://wa.me/964"+ph+"?text="+encodeURIComponent("مرحباً، أنا سائق التوصيل، يرجى إرسال موقعك.");
