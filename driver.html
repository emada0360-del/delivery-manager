<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baqubah Delivery | السائق</title>
<style>
:root{--bg:#f2f5f9;--ink:#172235;--pri:#1769aa;--ok:#218838;--bad:#dc3545;--warn:#bd7200;--line:#e0e6ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,Arial;background:var(--bg);color:var(--ink);padding-bottom:50px}
button,input,select{font:inherit}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700;transition:.15s}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
header{background:#14263d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h2{margin:0;font-size:18px}
main{max-width:600px;margin:auto;padding:16px}
.box{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.stat span{font-size:11px;color:#64748b;display:block;margin-bottom:4px;line-height:1.3}
.stat b{font-size:18px;color:var(--pri)}
.stat.warn b{color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
.card.new{border:2px solid var(--pri);box-shadow:0 0 15px rgba(23,105,170,.15)}
.card.waiting{border:2px solid var(--warn);background:#fffbeb}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.status-btn{width:100%;padding:18px;font-size:18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px;border:none;cursor:pointer}
.status-btn.on{background:var(--ok);color:#fff}
.status-btn.off{background:#6b7280;color:#fff}
.status-btn.blocked{background:#9ca3af;color:#fff;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;}
#login{max-width:380px;margin:60px auto;text-align:right}
#login label{display:block;margin-top:12px;font-weight:600;font-size:14px;color:#475569}
#login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;outline:none;margin-top:4px;background:#f8fafc;font-size:16px}
#login input:focus{border-color:var(--pri);background:#fff}
#msg{padding:12px;border-radius:8px;display:none;margin-bottom:12px;font-weight:600;text-align:center;position:sticky;top:70px;z-index:40}
#err{color:var(--bad);font-size:14px;text-align:center;font-weight:700;margin-top:10px;word-break:break-word;line-height:1.5}
[hidden]{display:none!important}
.badge{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.badge.wait{background:#fef3c7;color:#b45309}
.fin-box{background:#f8fafc;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #e2e8f0}
.fin-row{display:flex;justify-content:space-between;margin-bottom:6px}
.fin-row:last-child{margin-bottom:0;border-top:1px dashed #cbd5e1;padding-top:6px;margin-top:6px;font-weight:bold}
.debt-box{background:#fff1f2;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #fecdd3}
.customer-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin:10px 0;text-align:center}
.customer-box b{font-size:14px;color:#1e3a8a;display:block;margin-bottom:8px}
.btn-group{display:flex;gap:8px}
.btn-group a{flex:1;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:13px;display:flex;justify-content:center;align-items:center;gap:5px}
.btn-call{background:#e0e7ff;color:#3730a3}
.btn-wa{background:#dcfce7;color:#166534}
.map-link{display:inline-block;background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:bold;margin-top:6px;margin-bottom:10px}
</style>
</head>
<body>

<section id="login" class="box">
<h2 style="text-align:center;margin-top:0">دخول السائق</h2>
<form id="lf" onsubmit="return false;">
<label>رقم الهاتف</label>
<input id="un" type="tel" placeholder="07XXXXXXXXX" required>
<label>كلمة المرور</label>
<input id="pw" type="password" required>
<button type="button" id="btnLogin" style="width:100%;margin-top:20px">دخول</button>
</form>
<p id="err"></p>
</section>

<div id="app" hidden>
<header>
<h2 id="drvName">السائق</h2>
<button id="btnOut" class="bad" style="padding:8px 12px;font-size:13px;background:var(--bad)">خروج</button>
</header>
<main>
<div id="msg"></div>
<div class="grid">
<div class="stat"><span>الطلبات المكتملة</span><b id="statDone">0</b></div>
<div class="stat"><span>محفظتي (دين)</span><b id="statDebt">0</b></div>
<div class="stat"><span>أرباحي اليوم</span><b id="statProfit">0</b></div>
</div>
<div id="warnBox" class="box" style="background:#fdecea;color:#b42318;border:1px solid #f5c2c7" hidden>
<b>تنبيه:</b> لقد وصلت للحد الأقصى من الدين. يرجى مراجعة الإدارة لتصفير المحفظة.
</div>
<button id="btnStatus" class="status-btn off">
<span class="dot"></span> <span id="statusTxt">غير متصل (مغلق)</span>
</button>
<div id="annBox" class="box" style="background:#fff7e0;color:#8a5a00;border:1px solid #fde68a" hidden></div>
<div id="availContainer" hidden>
<h3>الطلبات المتاحة</h3>
<div id="availList"></div>
</div>
<div id="activeContainer" hidden>
<h3>طلباتي الحالية</h3>
<div id="activeList"></div>
</div>
</main>
</div>

<script>
// ============ إعدادات Firebase ============
const API_KEY = "AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc";
const DB_URL = "https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app";
const AUTH_URL = "https://identitytoolkit.googleapis.com/v1/accounts";

// ============ متغيرات الحالة ============
let idToken = null;
let uid = null;
let driver = null;
let settings = {};
let isOnline = false;
let pos = { lat: null, lng: null };
let availOrders = {};
let activeOrders = {};
let allMyOrders = {};
let finance = {};
let privData = {};
let currentDebt = 0;
let debtLimit = 15000;
let pollTimer = null;

const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString("en-US");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function say(t, bad) {
  const m = $("msg");
  m.textContent = t;
  m.style.display = "block";
  m.style.background = bad ? "#fee2e2" : "#dcfce7";
  m.style.color = bad ? "#b91c1c" : "#15803d";
  setTimeout(() => m.style.display = "none", 4000);
}

// ============ REST API Calls ============
async function apiLogin(email, password) {
  const res = await fetch(`${AUTH_URL}:signInWithPassword?key=${API_KEY}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true })
  });
  const data = await res.json();
  if (!res.ok) {
    const msg = (data.error && data.error.message) || "UNKNOWN_ERROR";
    throw new Error(msg);
  }
  return data;
}

async function apiGet(path) {
  const res = await fetch(`${DB_URL}/${path}.json?auth=${idToken}`);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

async function apiPut(path, data) {
  const res = await fetch(`${DB_URL}/${path}.json?auth=${idToken}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error("HTTP " + res.status + ": " + txt);
  }
  return await res.json();
}

async function apiPatch(path, data) {
  const res = await fetch(`${DB_URL}/${path}.json?auth=${idToken}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error("HTTP " + res.status + ": " + txt);
  }
  return await res.json();
}

// ============ Login ============
$("btnLogin").onclick = async () => {
  const btn = $("btnLogin");
  const err = $("err");
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "جاري التحقق...";

  const phone = $("un").value.trim();
  const pass = $("pw").value;

  if (!phone || !pass) {
    err.textContent = "❌ الرجاء إدخال رقم الهاتف وكلمة المرور.";
    err.style.color = "#dc3545";
    btn.disabled = false; btn.textContent = "دخول";
    return;
  }

  try {
    const email = phone.includes("@") ? phone : phone + "@baqubah.app";

    // 1. محاولة تسجيل الدخول
    err.textContent = "📡 جاري الاتصال بـ Firebase...";
    err.style.color = "#1769aa";
    const authData = await apiLogin(email, pass);

    idToken = authData.idToken;
    uid = authData.localId;
    localStorage.setItem("driverAuth", JSON.stringify({ idToken, uid, email }));

    // 2. جلب بيانات المستخدم
    err.textContent = "👤 جاري جلب بيانات المستخدم...";
    const user = await apiGet(`users/${uid}`);

    if (!user) {
      throw new Error("❌ لا يوجد سجل بحسابك في قاعدة البيانات. راجع الإدارة.");
    }
    if (user.role !== "driver") {
      throw new Error("❌ هذا الحساب ليس حساب سائق (role=" + user.role + ")");
    }
    if (user.isActive === false) {
      throw new Error("❌ هذا الحساب معطل من قبل الإدارة.");
    }

    // 3. نجاح
    driver = user;
    $("drvName").textContent = user.name || "السائق";
    $("login").hidden = true;
    $("app").hidden = false;
    err.textContent = "";

    startApp();

  } catch (e) {
    let msg = e.message || String(e);

    if (msg.includes("EMAIL_NOT_FOUND") || msg.includes("user-not-found")) {
      msg = "❌ هذا الحساب غير موجود. راجع الإدارة للتأكد من إنشاء الحساب.";
    } else if (msg.includes("INVALID_PASSWORD") || msg.includes("wrong-password")) {
      msg = "❌ كلمة المرور غير صحيحة.";
    } else if (msg.includes("INVALID_LOGIN_CREDENTIALS") || msg.includes("invalid-credential")) {
      msg = "❌ رقم الهاتف أو كلمة المرور غير صحيحة.";
    } else if (msg.includes("TOO_MANY_ATTEMPTS")) {
      msg = "❌ محاولات كثيرة. انتظر 5 دقائق ثم حاول مجدداً.";
    } else if (msg.includes("USER_DISABLED")) {
      msg = "❌ هذا الحساب معطل من Firebase.";
    } else if (msg.includes("INVALID_EMAIL")) {
      msg = "❌ رقم الهاتف غير صالح.";
    } else if (msg.includes("HTTP 401")) {
      msg = "❌ صلاحيات مرفوضة. تأكد من قواعد Firebase (Rules).";
    } else if (msg.includes("HTTP 403")) {
      msg = "❌ Permission denied. قواعد Firebase تمنع القراءة.";
    } else if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
      msg = "❌ مشكلة في الاتصال بالإنترنت. تأكد من الشبكة.";
    }

    err.textContent = msg;
    err.style.color = "#dc3545";
    console.error("Login error:", e);
    btn.disabled = false;
    btn.textContent = "دخول";
  }
};

// ============ Logout ============
$("btnOut").onclick = async () => {
  if (Object.keys(activeOrders).length > 0) {
    return say("لا يمكنك الخروج ولديك طلبات نشطة!", 1);
  }
  if (isOnline) await toggleStatus();
  if (pollTimer) clearInterval(pollTimer);
  localStorage.removeItem("driverAuth");
  idToken = null; uid = null; driver = null;
  $("login").hidden = false;
  $("app").hidden = true;
};

// ============ GPS ============
function startGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(p => {
    pos.lat = p.coords.latitude;
    pos.lng = p.coords.longitude;
  }, e => console.log("GPS Error", e), { enableHighAccuracy: true });
}

// ============ Start App ============
async function startApp() {
  startGPS();

  // تحميل الإعدادات
  try { settings = await apiGet("settings") || {}; } catch(e) {}
  debtLimit = Number(settings.debtLimit || 15000);

  if (settings.announcement) {
    $("annBox").textContent = settings.announcement;
    $("annBox").hidden = false;
  }

  // بدء التحديث الدوري كل 3 ثواني
  await refreshAll();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshAll, 3000);
}

async function refreshAll() {
  try {
    // 1. حالة الاتصال
    const presence = await apiGet(`presence/${uid}`);
    if (Object.keys(activeOrders).length === 0) {
      isOnline = presence && presence.online === true;
    }

    // 2. المالية
    const fin = await apiGet("finance");
    finance = fin || {};

    // 3. الطلبات المتاحة (pending)
    const allOrders = await apiGet("orders");
    const orders = allOrders || {};

    availOrders = {};
    activeOrders = {};
    allMyOrders = {};

    for (const id in orders) {
      const o = orders[id];
      if (o.status === "pending") {
        availOrders[id] = o;
      }
      if (o.driverId === uid) {
        allMyOrders[id] = o;
        if (!["delivered", "cancelled"].includes(o.status)) {
          activeOrders[id] = o;
        }
      }
    }

    if (Object.keys(activeOrders).length > 0) isOnline = true;

    // 4. جلب بيانات الزبائن للطلبات النشطة
    for (const id in activeOrders) {
      if (!privData[id]) {
        try {
          privData[id] = await apiGet(`orderPrivate/${id}`);
        } catch(e) {}
      }
    }

    updateStatusUI();
    drawOrders();
    drawStats();

  } catch (e) {
    console.log("Refresh error:", e);
  }
}

// ============ Stats ============
function drawStats() {
  let debt = 0, todayProfit = 0, doneCount = 0;
  const todayStart = new Date().setHours(0, 0, 0, 0);

  for (const id in allMyOrders) {
    const o = allMyOrders[id];
    if (o.status === "delivered") {
      doneCount++;
      debt += Math.round(Number(o.platformDeliveryCommission) || 0) + Math.round(Number(o.storeCommission) || 0);
      if (o.deliveredAt >= todayStart) {
        todayProfit += Math.round(Number(o.driverProfit) || 0);
      }
    }
  }

  for (const id in finance) {
    const f = finance[id];
    if (f.type === "cash_received" && f.userId === uid) {
      debt -= Math.round(Number(f.amount) || 0);
    }
  }

  if (debt < 0) debt = 0;
  currentDebt = debt;
  $("statDone").textContent = doneCount;
  $("statDebt").textContent = fmt(debt) + " د.ع";
  $("statProfit").textContent = fmt(todayProfit) + " د.ع";
  $("warnBox").hidden = debt < debtLimit;
  updateStatusUI();
}

// ============ Toggle Status ============
async function toggleStatus() {
  if (currentDebt >= debtLimit) return say("لا يمكنك الاتصال، لقد تجاوزت سقف الدين", 1);
  if (!isOnline && Object.keys(activeOrders).length > 0) return say("لا يمكنك الإغلاق ولديك طلبات نشطة", 1);

  isOnline = !isOnline;
  updateStatusUI();

  try {
    await apiPut(`presence/${uid}`, { online: isOnline, lastSeen: Date.now() });
    if (isOnline) startGPS();
    say(isOnline ? "أنت الآن متصل" : "أنت الآن غير متصل");
  } catch(e) {
    isOnline = !isOnline;
    updateStatusUI();
    say("خطأ في الصلاحيات! تأكد من قواعد Firebase.", 1);
    console.error(e);
  }
}
$("btnStatus").addEventListener("click", toggleStatus);

function updateStatusUI() {
  const hasActive = Object.keys(activeOrders).length > 0;
  const btn = $("btnStatus");
  if (currentDebt >= debtLimit && !hasActive) {
    isOnline = false;
    btn.className = "status-btn blocked";
    $("statusTxt").textContent = "محظور (تجاوزت سقف الدين)";
    return;
  }
  if (hasActive) {
    isOnline = true;
    btn.className = "status-btn on";
    $("statusTxt").textContent = "متصل (لديك طلب نشط)";
    return;
  }
  if (isOnline) {
    btn.className = "status-btn on";
    $("statusTxt").textContent = "متصل (متاح للطلبات)";
  } else {
    btn.className = "status-btn off";
    $("statusTxt").textContent = "غير متصل (مغلق)";
  }
}

// ============ Draw Orders ============
function buildFinBox(o) {
  const storeCom = Number(settings.storeCommission || 500);
  const platformCom = Math.round(o.deliveryFee * 0.1);
  const payStore = Math.round(o.itemPrice - storeCom);
  const collectCustomer = Math.round(o.customerTotal);
  const profit = Math.round(o.deliveryFee * 0.9);
  return `
    <div class="fin-box">
      <div class="fin-row" style="color:#dc3545"><span>تدفع للمتجر:</span> <b>${fmt(payStore)} د.ع</b></div>
      <div class="fin-row" style="color:#1769aa"><span>تستلم من الزبون:</span> <b>${fmt(collectCustomer)} د.ع</b></div>
      <div class="fin-row" style="color:#16a34a"><span>ربحك الصافي (الكروة):</span> <b>${fmt(profit)} د.ع</b></div>
    </div>
    <div class="debt-box">
      <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المنصة (10%):</span> <b>${fmt(platformCom)} د.ع</b></div>
      <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المتجر (ثابتة):</span> <b>${fmt(storeCom)} د.ع</b></div>
      <div class="fin-row" style="color:#b42318;border-top:1px solid #fecdd3;padding-top:4px;margin-top:4px"><span>سيضاف لدينك:</span> <b>${fmt(platformCom + storeCom)} د.ع</b></div>
    </div>`;
}

function drawOrders() {
  // الطلبات المتاحة
  let liveAvail = [];
  if (isOnline && currentDebt < debtLimit) {
    liveAvail = Object.entries(availOrders).filter(([id, o]) => {
      if (o.driverId) return false;
      if (o.rejectedBy && o.rejectedBy[uid]) return false;
      if (Object.keys(activeOrders).length > 0) {
        return (Date.now() - (o.createdAt || 0)) > 120000;
      }
      return true;
    });
  }

  $("availContainer").hidden = !liveAvail.length;
  $("availList").innerHTML = liveAvail.map(([id, o]) => `
    <div class="card new">
      <div class="row"><b>طلب #${esc(id.slice(-6))}</b></div>
      <p style="margin:6px 0;font-size:14px"><b>المتجر:</b> ${esc(o.storeName)}</p>
      <p style="margin:6px 0;font-size:14px"><b>المنطقة:</b> ${esc(o.area)}</p>
      ${o.storeMapUrl ? `<a href="${esc(o.storeMapUrl)}" target="_blank" class="map-link">📍 فتح موقع المتجر على الخريطة</a>` : ""}
      ${buildFinBox(o)}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button style="flex:2" onclick="acceptOrder('${id}')">قبول الطلب</button>
        <button style="flex:1;background:var(--bad)" onclick="rejectOrder('${id}')">رفض</button>
      </div>
    </div>`).join("");

  // طلباتي الحالية
  const ac = Object.entries(activeOrders);
  $("activeContainer").hidden = !ac.length;
  $("activeList").innerHTML = ac.map(([id, o]) => {
    let actionBtn = "", warn = "", statusBadge = "";
    const now = Date.now();
    const q = privData[id] || {};

    if (o.status === "waiting_store") {
      statusBadge = `<span class="badge wait">بانتظار موافقة المتجر</span>`;
      actionBtn = `<div style="text-align:center;padding:15px;background:#fef3c7;color:#b45309;border-radius:8px;font-weight:bold;margin-top:10px">يرجى الانتظار حتى يوافق المتجر...</div>`;
    } else if (o.status === "accepted") {
      statusBadge = `<span class="badge">بالطريق للمتجر</span>`;
      if (o.storeLat && pos.lat) {
        const d = getDist(pos.lat, pos.lng, o.storeLat, o.storeLng);
        if (d > 300) warn = `<p style="color:var(--bad);font-size:12px;margin:4px 0">أنت بعيد عن المتجر (${Math.round(d)}م)</p>`;
      }
      actionBtn = `<button style="width:100%;margin-top:10px;background:var(--ok)" onclick="updateStep('${id}','arrived_store')">وصلت للمتجر</button>`;
    } else if (o.status === "arrived_store") {
      statusBadge = `<span class="badge">وصل للمتجر</span>`;
      const canPick = (now - (o.stepAt || 0)) > 60000;
      actionBtn = `<button style="width:100%;margin-top:10px;background:var(--ok)" ${canPick ? '' : 'disabled'} onclick="updateStep('${id}','picked_up')">${canPick ? 'تم استلام الطلب' : 'انتظر دقيقة...'}</button>`;
    } else if (["picked_up", "delivering"].includes(o.status)) {
      statusBadge = `<span class="badge">بالطريق للزبون</span>`;
