<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baqubah Delivery | السائق</title>
<style>
:root{--bg:#f2f5f9;--ink:#172235;--pri:#1769aa;--ok:#218838;--bad:#dc3545;--warn:#bd7200;--line:#e0e6ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,Arial;background:var(--bg);color:var(--ink);padding-bottom:50px}
button,input,select{font:inherit}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700;transition:.15s}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
header{background:#14263d;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h2{margin:0;font-size:18px}
main{max-width:600px;margin:auto;padding:16px}
.box{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.03)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.stat span{font-size:11px;color:#64748b;display:block;margin-bottom:4px;line-height:1.3}
.stat b{font-size:18px;color:var(--pri)}
.stat.warn b{color:var(--bad)}

.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;position:relative}
.card.new{border:2px solid var(--pri);box-shadow:0 0 15px rgba(23,105,170,.15)}
.card.waiting{border:2px solid var(--warn);background:#fffbeb}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.status-btn{width:100%;padding:18px;font-size:18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px;border:none;cursor:pointer}
.status-btn.on{background:var(--ok);color:#fff;box-shadow:0 4px 15px rgba(33,136,56,.3)}
.status-btn.off{background:#6b7280;color:#fff}
.status-btn.blocked{background:#9ca3af;color:#fff;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;}
#login{max-width:380px;margin:60px auto}
#msg{padding:12px;border-radius:8px;display:none;margin-bottom:12px;font-weight:600;text-align:center;position:sticky;top:70px;z-index:40;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#err{color:var(--bad);font-size:13px;text-align:center;font-weight:600}
[hidden]{display:none!important}
.badge{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.badge.wait{background:#fef3c7;color:#b45309}
.fin-box { background:#f8fafc; border-radius:8px; padding:10px; margin:10px 0; font-size:13px; border:1px solid #e2e8f0; }
.fin-row { display:flex; justify-content:space-between; margin-bottom:6px; }
.fin-row:last-child { margin-bottom:0; border-top:1px dashed #cbd5e1; padding-top:6px; margin-top:6px; font-weight:bold;}
.debt-box { background:#fff1f2; border-radius:8px; padding:10px; margin:10px 0; font-size:13px; border:1px solid #fecdd3; }
.customer-box { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:12px; margin:10px 0; text-align:center; }
.customer-box b { font-size:14px; color:#1e3a8a; display:block; margin-bottom:8px; }
.btn-group { display:flex; gap:8px; }
.btn-group a { flex:1; padding:10px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:13px; display:flex; justify-content:center; align-items:center; gap:5px; }
.btn-call { background:#e0e7ff; color:#3730a3; }
.btn-wa { background:#dcfce7; color:#166534; }
.map-link { display:inline-block; background:#e0f2fe; color:#0369a1; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:13px; font-weight:bold; margin-top:6px; margin-bottom:10px;}
</style>
</head>
<body>

<!-- عنصر الصوت لتنبيه الطلبات الجديدة -->
<audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<section id="login" class="box">
<h2 style="text-align:center;margin-top:0">دخول السائق</h2>
<form id="lf" onsubmit="return false;">
<label>رقم الهاتف</label><input id="un" type="tel" placeholder="07XXXXXXXXX" required>
<label>كلمة المرور</label><input id="pw" type="password" required>
<button type="button" id="btnLogin" style="width:100%;margin-top:10px">دخول</button>
</form>
<p id="err"></p>
</section>

<div id="app" hidden>
<header>
<h2 id="drvName">السائق</h2>
<button id="btnOut" class="bad" style="padding:8px 12px;font-size:13px">خروج</button>
</header>
<main>
<div id="msg"></div>

<div class="grid">
<div class="stat"><span>الطلبات المكتملة</span><b id="statDone">0</b></div>
<div class="stat"><span>محفظتي (دين)</span><b id="statDebt">0</b></div>
<div class="stat"><span>أرباحي اليوم</span><b id="statProfit">0</b></div>
</div>

<div id="warnBox" class="box" style="background:#fdecea;color:#b42318;border:1px solid #f5c2c7" hidden>
<b>تنبيه:</b> لقد وصلت للحد الأقصى من الدين. يرجى مراجعة الإدارة لتصفير المحفظة.
</div>

<button id="btnStatus" class="status-btn off">
<span class="dot"></span> <span id="statusTxt">غير متصل (مغلق)</span>
</button>

<div id="annBox" class="box" style="background:#fff7e0;color:#8a5a00;border:1px solid #fde68a" hidden></div>

<div id="battBox" class="box" style="background:#eef6ff;color:#0b4a7a;border:1px solid #bfdbfe;font-size:13px;line-height:1.7" hidden>
لضمان وصول إشعارات الطلبات والتطبيق مغلق: افتح إعدادات الموبايل &gt; التطبيقات &gt; Baqubah Driver &gt; البطارية، واختر "بدون قيود".
<br><button id="battOk" style="padding:6px 14px;margin-top:8px;font-size:12px">تم</button>
</div>

<div id="availContainer" hidden>
<h3>الطلبات المتاحة</h3>
<div id="availList"></div>
</div>

<div id="activeContainer" hidden>
<h3>طلباتي الحالية</h3>
<div id="activeList"></div>
</div>

</main>
</div>

<script>
function showErr(t){var d=document.getElementById("dbg");if(!d){d=document.createElement("div");d.id="dbg";d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#b91c1c;color:#fff;font:12px monospace;padding:8px;direction:ltr;white-space:pre-wrap";document.body.appendChild(d);}d.textContent+=t+"\n";}
window.addEventListener("error",function(e){showErr("ERR: "+(e.message||"load error")+" "+(e.filename||""));});
window.addEventListener("unhandledrejection",function(e){showErr("REJ: "+(e.reason&&e.reason.message||e.reason));});
window.addEventListener("error",function(e){var t=e.target;if(t&&(t.src||t.href)&&t!==window)showErr("RES FAIL: "+(t.src||t.href));},true);
setTimeout(function(){if(!window.__loaded)showErr("v5 | libs did not load | bundled="+(!!document.querySelector('script[src="app.js"]'))+" | native="+(!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())));},15000);
</script>

<script type="module">
window.__loaded=true;
{const d=document.getElementById("dbg");if(d)d.remove();}
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getDatabase,ref,set,update,push,onValue,get,query,orderByChild,equalTo,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc",
  authDomain: "baqubah-delivery-e729e.firebaseapp.com",
  databaseURL: "https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "baqubah-delivery-e729e",
  storageBucket: "baqubah-delivery-e729e.firebasestorage.app",
  messagingSenderId: "450084520701",
  appId: "1:450084520701:web:719e2040338540ce36f494"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString("en-US");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let uid=null, driver=null, settings={}, isOnline=false, pos={lat:null,lng:null};
let availOrders={}, activeOrders={}, allMyOrders={}, finance={}, privData={};
let currentDebt = 0;
let debtLimit = 15000;

/* ========== إدارة الإشعارات بشكل آمن للويب وللـ APK ========== */
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const LN = window.Capacitor?.Plugins?.LocalNotifications || null;
const notified = new Set();
let notifReady = false;
const nid = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h)%2000000000+10; };

async function initNotifs(){
 if(!LN || notifReady) return;
 notifReady = true;
 try{
  await LN.requestPermissions();
  await LN.createChannel({id:"orders",name:"طلبات جديدة",description:"إشعار وصول طلب جديد",importance:5,visibility:1,vibration:true,lights:true});
  LN.addListener("localNotificationActionPerformed", async ev=>{
   const id = ev && ev.notification && ev.notification.extra && ev.notification.extra.orderId;
   if(!id) return;
   if(ev.actionId==="accept") await window.acceptOrder(id,true);
   else if(ev.actionId==="reject") await window.rejectOrder(id);
   try{ await LN.cancel({notifications:[{id:nid(id)}]}); }catch(e){}
  });
 }catch(e){ console.log("notif init", e); }
}

async function notifyOrder(id,o){
 if(!LN) return;
 try{
  await LN.schedule({notifications:[{
   id:nid(id), title:"طلب جديد 🚨",
   body:(o.storeName||"")+" - "+(o.area||"")+" - توصيل "+fmt(o.deliveryFee)+" د.ع",
   channelId:"orders", extra:{orderId:id}, autoCancel:true
  }]});
 }catch(e){ console.log("notify", e); }
}

async function notifyText(title,body){
 if(!LN) return;
 try{ await LN.schedule({notifications:[{id:Math.floor(Math.random()*1e9)+10,title,body,channelId:"orders"}]}); }catch(e){}
}

async function cancelNotif(id){
 if(!LN) return;
 try{ await LN.cancel({notifications:[{id:nid(id)}]}); }catch(e){}
}

function checkNew(){
 for(const id of [...notified]){
  if(!availOrders[id]){ notified.delete(id); cancelNotif(id); }
 }
 if(!isOnline || currentDebt>=debtLimit) return;
 const hasActive = Object.keys(activeOrders).length>0;
 for(const [id,o] of Object.entries(availOrders)){
  if(notified.has(id) || o.driverId) continue;
  if(o.rejectedBy && o.rejectedBy[uid]) continue;
  const age = Date.now()-(o.createdAt||0);
  if(age>300000) continue;
  if(hasActive && age<=120000) continue;
  notified.add(id);
  notifyOrder(id,o);
 }
}

function battHint(){
 if(!isNative) return;
 let done=false; try{ done=!!localStorage.getItem("battOk"); }catch(e){}
 if(done) return;
 $("battBox").hidden=false;
 $("battOk").onclick=()=>{ try{localStorage.setItem("battOk","1");}catch(e){} $("battBox").hidden=true; };
}
/* ================================================================= */

// دالة الصوت الآمنة والمضمونة
const speak = t => {
  try {
    const audio = document.getElementById("alertSound");
    if(audio) {
      audio.currentTime = 0;
      audio.play().catch(e => console.log("Audio play blocked", e));
    }
  } catch(e) {}
};

function say(t,bad){const m=$("msg");m.textContent=t;m.style.display="block";m.style.background=bad?"#fee2e2":"#dcfce7";m.style.color=bad?"#b91c1c":"#15803d";setTimeout(()=>m.style.display="none",4000)}

$("btnLogin").onclick=async()=>{
 $("err").textContent="";$("btnLogin").disabled=true;$("btnLogin").textContent="جاري...";
 try{ await signInWithEmailAndPassword(auth,$("un").value.trim()+"@baqubah.app",$("pw").value); }
 catch(e){ $("err").textContent="رقم الهاتف أو كلمة المرور غير صحيحة."; }
 finally{$("btnLogin").disabled=false;$("btnLogin").textContent="دخول";}
};

$("btnOut").onclick=()=>{
 if(Object.keys(activeOrders).length>0){ return say("لا يمكنك الخروج ولديك طلبات نشطة!", 1); }
 if(isOnline) toggleStatus();
 signOut(auth);
};

onAuthStateChanged(auth, async u=>{
 if(!u){$("login").hidden=false;$("app").hidden=true;return;}
 const snap=await get(ref(db,"users/"+u.uid));
 const user = snap.val();
 if(!user || user.role!=="driver" || user.isActive===false){
  await signOut(auth);$("err").textContent="هذا الحساب غير مصرح له أو معطل.";return;
 }
 uid=u.uid;driver=user;
 $("drvName").textContent=user.name;
 $("login").hidden=true;$("app").hidden=false;
 start();
});

function startGPS(){
 if(!navigator.geolocation)return say("المتصفح لا يدعم تحديد الموقع", 1);
 navigator.geolocation.watchPosition(p=>{
  pos.lat = p.coords.latitude; pos.lng = p.coords.longitude;
 }, e=>console.log("GPS Error", e), {enableHighAccuracy:true});
}

function start(){
 startGPS();
 initNotifs();
 battHint();
 onValue(ref(db,"settings"),s=>{
  settings=s.val()||{}; debtLimit = Number(settings.debtLimit || 15000);
  if(settings.announcement){$("annBox").textContent=settings.announcement;$("annBox").hidden=false;}
  else $("annBox").hidden=true;
  drawStats();
 });

 const pr=ref(db,"presence/"+uid);
 onValue(pr, s=>{
   const status = s.val() || {};
   if(Object.keys(activeOrders).length === 0) { isOnline = status.online === true; }
   updateStatusUI();
   setTimeout(checkNew,300);
 });

 onValue(ref(db,".info/connected"),s=>{
  if(s.val()===true){
   onDisconnect(pr).set({online:false,lastSeen:serverTimestamp()});
   if(isOnline) set(pr,{online:true,lastSeen:serverTimestamp()});
  }
 });

 onValue(query(ref(db,"finance"),orderByChild("userId"),equalTo(uid)),s=>{ finance=s.val()||{}; drawStats(); });
 onValue(query(ref(db,"orders"),orderByChild("status"),equalTo("pending")),s=>{ availOrders=s.val()||{}; checkNew(); drawOrders(); });

 onValue(query(ref(db,"orders"),orderByChild("driverId"),equalTo(uid)),s=>{
  allMyOrders = s.val() || {};
  activeOrders={};
  for(const k in allMyOrders){
   if(!["delivered","cancelled"].includes(allMyOrders[k].status)) { activeOrders[k]=allMyOrders[k]; }
  }
  if(Object.keys(activeOrders).length > 0) { isOnline = true; }
  fetchPrivateData();
  updateStatusUI();
  drawOrders();
  drawStats();
 });
}

function fetchPrivateData(){
 const ids=Object.keys(activeOrders);
 if(!ids.length) return;
 ids.forEach(id=>{
   if(privData[id]) return;
   get(ref(db,"orderPrivate/"+id)).then(snap=>{
     if(snap.exists()){ privData[id]=snap.val(); drawOrders(); }
   });
 });
}

function drawStats() {
    let debt = 0; let todayProfit = 0; let doneCount = 0;
    const todayStart = new Date().setHours(0,0,0,0);
    for (const id in allMyOrders) {
        const o = allMyOrders[id];
        if (o.status === "delivered") {
            doneCount++;
            debt += Math.round(Number(o.platformDeliveryCommission) || 0) + Math.round(Number(o.storeCommission) || 0);
            if (o.deliveredAt >= todayStart) { todayProfit += Math.round(Number(o.driverProfit) || 0); }
        }
    }
    for (const id in finance) {
        const f = finance[id];
        if (f.type === "cash_received") { debt -= Math.round(Number(f.amount) || 0); }
    }
    if (debt < 0) debt = 0; currentDebt = debt;
    $("statDone").textContent = doneCount;
    $("statDebt").textContent = fmt(debt) + " د.ع";
    $("statProfit").textContent = fmt(todayProfit) + " د.ع";
    $("warnBox").hidden = debt < debtLimit;
    updateStatusUI();
}

function toggleStatus(){
 if(currentDebt >= debtLimit) return say("لا يمكنك الاتصال، لقد تجاوزت سقف الدين", 1);
 if(!isOnline && Object.keys(activeOrders).length>0) return say("لا يمكنك الإغلاق ولديك طلبات نشطة", 1);
 isOnline=!isOnline;
 const pr=ref(db,"presence/"+uid);
 set(pr,{online:isOnline,lastSeen:serverTimestamp()});
 if(isOnline){ startGPS(); speak(); setTimeout(checkNew,300); } else { speak(); }
}
$("btnStatus").addEventListener("click", toggleStatus);

function updateStatusUI(){
 const hasActive = Object.keys(activeOrders).length > 0;
 const btn=$("btnStatus");
 if(currentDebt >= debtLimit && !hasActive) {
   isOnline = false; btn.className="status-btn blocked"; $("statusTxt").textContent="محظور (تجاوزت سقف الدين)"; return;
 }
 if(hasActive) {
   isOnline = true; btn.className="status-btn on"; $("statusTxt").textContent="متصل (لديك طلب نشط)"; return;
 }
 if(isOnline){ btn.className="status-btn on"; $("statusTxt").textContent="متصل (متاح للطلبات)"; }
 else{ btn.className="status-btn off"; $("statusTxt").textContent="غير متصل (مغلق)"; }
}

function buildFinBox(o) {
    const storeCom = Number(settings.storeCommission || 500);
    const platformCom = Math.round(o.deliveryFee * 0.1);
    const payStore = Math.round(o.itemPrice - storeCom);
    const collectCustomer = Math.round(o.customerTotal);
    const profit = Math.round(o.deliveryFee * 0.9);
    return `
    <div class="fin-box">
        <div class="fin-row" style="color:#dc3545"><span>تدفع للمتجر:</span> <b>${fmt(payStore)} د.ع</b></div>
        <div class="fin-row" style="color:#1769aa"><span>تستلم من الزبون:</span> <b>${fmt(collectCustomer)} د.ع</b></div>
        <div class="fin-row" style="color:#16a34a"><span>ربحك الصافي (الكروة):</span> <b>${fmt(profit)} د.ع</b></div>
    </div>
    <div class="debt-box">
        <div class="fin-row" style="color:#b42318; margin-bottom:2px"><span>عمولة المنصة (10%):</span> <b>${fmt(platformCom)} د.ع</b></div>
        <div class="fin-row" style="color:#b42318; margin-bottom:2px"><span>عمولة المتجر (ثابتة):</span> <b>${fmt(storeCom)} د.ع</b></div>
        <div class="fin-row" style="color:#b42318; border-top:1px solid #fecdd3; padding-top:4px; margin-top:4px"><span>سيضاف لدينك:</span> <b>${fmt(platformCom + storeCom)} د.ع</b></div>
    </div>`;
}

function drawOrders(){
 if(!isOnline || currentDebt >= debtLimit){ $("availContainer").hidden = true; } 
 else {
  const av=Object.entries(availOrders).filter(([id,o])=>{
    if(o.driverId) return false; 
    if(o.rejectedBy && o.rejectedBy[uid]) return false; 
    if(Object.keys(activeOrders).length>0){ return (Date.now()-(o.createdAt||0)) > 120000; }
    return true;
  });
  $("availContainer").hidden = !av.length;
  $("availList").innerHTML = av.map(([id,o])=>`
   <div class="card new">
    <div class="row"><b>طلب #${esc(id.slice(-6))}</b></div>
    <p style="margin:6px 0;font-size:14px"><b>المتجر:</b> ${esc(o.storeName)}</p>
    <p style="margin:6px 0;font-size:14px"><b>المنطقة:</b> ${esc(o.area)}</p>
    ${o.storeMapUrl?`<a href="${esc(o.storeMapUrl)}" target="_blank" class="map-link">📍 فتح موقع المتجر على الخريطة</a>`:""}
    ${buildFinBox(o)}
    <div style="display:flex; gap:8px; margin-top:10px">
      <button style="flex:2" onclick="acceptOrder('${id}')">قبول الطلب</button>
      <button class="red" style="flex:1; background:var(--bad)" onclick="rejectOrder('${id}')">رفض</button>
    </div>
   </div>`).join("");
 }

 const ac=Object.entries(activeOrders);
 $("activeContainer").hidden = !ac.length;
 $("activeList").innerHTML = ac.map(([id,o])=>{
  let actionBtn="", warn="", statusBadge="";
  const now=Date.now(); const q = privData[id] || {}; 
  
  if(o.status==="waiting_store"){
   statusBadge = `<span class="badge wait">بانتظار موافقة المتجر</span>`;
   actionBtn=`<div style="text-align:center; padding:15px; background:#fef3c7; color:#b45309; border-radius:8px; font-weight:bold; margin-top:10px">يرجى الانتظار حتى يوافق المتجر على طلبك...</div>`;
  }
  else if(o.status==="accepted"){
   statusBadge = `<span class="badge">بالطريق للمتجر</span>`;
   if(o.storeLat && pos.lat){
     const d=getDist(pos.lat, pos.lng, o.storeLat, o.storeLng);
     if(d>300) warn=`<p style="color:var(--bad);font-size:12px;margin:4px 0">أنت بعيد عن المتجر (${Math.round(d)}م)</p>`;
   }
   actionBtn=`<button style="width:100%;margin-top:10px;background:var(--ok)" onclick="updateStep('${id}','arrived_store')">وصلت للمتجر</button>`;
  } 
  else if(o.status==="arrived_store"){
   statusBadge = `<span class="badge">وصل للمتجر</span>`;
   const canPick = (now - (o.stepAt||0)) > 60000; 
   actionBtn=`<button style="width:100%;margin-top:10px;background:var(--ok)" ${canPick?'':'disabled'} onclick="updateStep('${id}','picked_up')">${canPick?'تم استلام الطلب':'انتظر دقيقة.
