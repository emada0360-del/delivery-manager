<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baqubah Delivery | السائق</title>
<style>
:root{--bg:#f2f5f9;--ink:#172235;--pri:#1769aa;--ok:#218838;--bad:#dc3545;--warn:#bd7200;--line:#e0e6ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,Arial;background:var(--bg);color:var(--ink);padding-bottom:50px}
button,input{font:inherit}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px;margin:6px 0 14px;background:#fff}
header{background:#14263d;color:#fff;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h2{margin:0;font-size:18px}
main{max-width:600px;margin:auto;padding:16px}
.box{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.stat span{font-size:11px;color:#64748b;display:block;margin-bottom:4px;line-height:1.3}
.stat b{font-size:18px;color:var(--pri)}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
.card.new{border:2px solid var(--pri);box-shadow:0 0 15px rgba(23,105,170,.15)}
.card.waiting{border:2px solid var(--warn);background:#fffbeb}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.status-btn{width:100%;padding:18px;font-size:18px;border-radius:12px;margin-bottom:16px;display:flex;justify-content:center;align-items:center;gap:10px}
.status-btn.on{background:var(--ok);box-shadow:0 4px 15px rgba(33,136,56,.3)}
.status-btn.off{background:#6b7280}
.status-btn.blocked{background:#9ca3af;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;background:#fff}
#login{max-width:380px;margin:60px auto}
#msg{padding:12px;border-radius:8px;display:none;margin-bottom:12px;font-weight:600;text-align:center;position:sticky;top:70px;z-index:40;box-shadow:0 4px 12px rgba(0,0,0,.1)}
#err{color:var(--bad);font-size:13px;text-align:center;font-weight:600;margin-top:10px}
[hidden]{display:none!important}
.badge{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.badge.wait{background:#fef3c7;color:#b45309}
.fin-box{background:#f8fafc;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #e2e8f0}
.fin-row{display:flex;justify-content:space-between;margin-bottom:6px}
.fin-row:last-child{margin-bottom:0;border-top:1px dashed #cbd5e1;padding-top:6px;margin-top:6px;font-weight:bold}
.debt-box{background:#fff1f2;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #fecdd3}
.customer-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin:10px 0;text-align:center}
.customer-box b{font-size:14px;color:#1e3a8a;display:block;margin-bottom:8px}
.btn-group{display:flex;gap:8px}
.btn-group a{flex:1;padding:10px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:13px;display:flex;justify-content:center;align-items:center;gap:5px}
.btn-call{background:#e0e7ff;color:#3730a3}
.btn-wa{background:#dcfce7;color:#166534}
.map-link{display:inline-block;background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:bold;margin:6px 0 10px}
.alert{padding:12px;border-radius:8px;margin-bottom:12px;font-size:14px}
#mdl{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:99}
#mdl>div{background:#fff;border-radius:14px;padding:18px;width:min(92%,360px)}
#mdl p{margin:0 0 14px;line-height:1.7}
#mdl .mr{display:flex;gap:8px}#mdl .mr button{flex:1}
#mdl .mn{background:#64748b}
</style>
</head>
<body>

<section id="login" class="box">
<h2 style="text-align:center;margin-top:0">دخول السائق</h2>
<form id="lf">
<label>رقم الهاتف</label><input id="un" type="tel" placeholder="07XXXXXXXXX" required autocomplete="username">
<label>كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password">
<button id="lb" style="width:100%;margin-top:10px">دخول</button>
</form>
<div id="err"></div>
</section>

<div id="app" hidden>
<header>
<h2 id="drvName">السائق</h2>
<button id="btnOut" style="padding:8px 12px;font-size:13px;background:var(--bad)">خروج</button>
</header>
<main>
<div id="msg"></div>
<div id="off" class="alert" style="background:#fdecea;color:#a61b1b" hidden>لا يوجد اتصال بالإنترنت. ما راح توصلك طلبات جديدة.</div>

<div class="grid">
<div class="stat"><span>الطلبات المكتملة</span><b id="statDone">0</b></div>
<div class="stat"><span>محفظتي (دين)</span><b id="statDebt">0</b></div>
<div class="stat"><span>أرباحي اليوم</span><b id="statProfit">0</b></div>
</div>

<div id="warnBox" class="alert" style="background:#fdecea;color:#b42318;border:1px solid #f5c2c7" hidden>
<b>تنبيه:</b> لقد وصلت للحد الأقصى من الدين. يرجى مراجعة الإدارة لتصفير المحفظة.
</div>

<button id="btnStatus" class="status-btn off"><span class="dot"></span> <span id="statusTxt">غير متصل (مغلق)</span></button>

<div id="annBox" class="alert" style="background:#fff7e0;color:#8a5a00;border:1px solid #fde68a" hidden></div>

<div id="availContainer" hidden>
<h3>الطلبات المتاحة</h3>
<div id="availList"></div>
</div>

<div id="activeContainer" hidden>
<h3>طلباتي الحالية</h3>
<div id="activeList"></div>
</div>
</main>
</div>

<div id="mdl" hidden><div><p id="mdt"></p><div class="mr"><button id="mdy">تأكيد</button><button id="mdn" class="mn">إلغاء</button></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getDatabase,ref,get,set,update,onValue,query,orderByChild,equalTo,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

const cfg={
 apiKey:"AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc",
 authDomain:"baqubah-delivery-e729e.firebaseapp.com",
 databaseURL:"https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"baqubah-delivery-e729e",
 storageBucket:"baqubah-delivery-e729e.firebasestorage.app",
 messagingSenderId:"450084520701",
 appId:"1:450084520701:web:719e2040338540ce36f494"
};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString("en-US");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FIN=["delivered","cancelled"];

/* ---------- صوت + إشعارات ---------- */
let AC=null;const wake=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch{}};
document.addEventListener("click",wake);document.addEventListener("touchstart",wake,{passive:true});
const beep=()=>{try{wake();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.4;o.start();o.stop(AC.currentTime+.35);navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}};
const speak=t=>{try{const S=window.speechSynthesis;if(!S)return;S.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";S.speak(u)}catch{}};

const ask=t=>new Promise(r=>{$("mdt").textContent=t;$("mdl").hidden=false;const f=v=>{$("mdl").hidden=true;r(v)};$("mdy").onclick=()=>f(true);$("mdn").onclick=()=>f(false)});
const say=(t,bad)=>{const m=$("msg");m.textContent=t;m.style.display="block";m.style.background=bad?"#fee2e2":"#dcfce7";m.style.color=bad?"#b91c1c":"#15803d";setTimeout(()=>m.style.display="none",4000)};
const lerr=e=>{const c=(e&&e.code)||"";
 if(c==="auth/network-request-failed")return"تأكد من الإنترنت وحاول مرة ثانية.";
 if(c==="auth/too-many-requests")return"محاولات كثيرة، انتظر شوي وحاول.";
 if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(c))return"رقم الهاتف أو كلمة المرور غير صحيحة.";
 return"خطأ: "+(c||(e&&e.message)||e)};

/* ---------- الحالة ---------- */
let uid=null,driver=null,settings={},isOnline=false,pos={lat:null,lng:null},gpsId=null;
let avail={},mine={},finance={},priv={},prev=null,seen=null,stops=[],busy=false;
let currentDebt=0,debtLimit=15000;
const hasActive=()=>Object.values(mine).some(o=>o&&!FIN.includes(o.status));
const activeEntries=()=>Object.entries(mine).filter(([,o])=>o&&!FIN.includes(o.status));
const storeComOf=o=>Number(o.storeCommission!==undefined?o.storeCommission:(settings.storeCommission||500));

/* ---------- الدخول بالطريقة الكلاسيكية الأصلية ---------- */
$("lf").onsubmit=async e=>{
 e.preventDefault();
 $("err").textContent="";
 $("lb").disabled=true;
 $("lb").textContent="جاري...";

 const phoneVal = $("un").value.trim().toLowerCase();
 const passVal = $("pw").value;
 const email = phoneVal.includes("@") ? phoneVal : phoneVal + "@baqubah.app";

 try{
  await signInWithEmailAndPassword(auth, email, passVal);
 }catch(er){
  $("err").textContent=lerr(er);
  $("lb").disabled=false;
  $("lb").textContent="دخول";
 }
};

onAuthStateChanged(auth,async u=>{
 if(!u){show(false);return}
 let me;
 try{
  me=(await get(ref(db,"users/"+u.uid))).val();
 }catch(er){
  await signOut(auth);
  $("err").textContent="تعذّر تحميل الحساب: تأكد من الإنترنت";
  return;
 }
 if(!me){
  await signOut(auth);
  $("err").textContent="الحساب غير موجود بقاعدة البيانات.";
  return;
 }
 if(me.role!=="driver"){
  await signOut(auth);
  $("err").textContent="هذا الحساب مو حساب سائق.";
  return;
 }
 if(me.isActive===false){
  await signOut(auth);
  $("err").textContent="حسابك معطّل. راجع المدير.";
  return;
 }
 uid=u.uid;driver=me;$("drvName").textContent=me.name||"السائق";
 show(true);start();
});

function show(on){
 $("login").hidden=on;$("app").hidden=!on;
 if(!on){
  clear();
  if(gpsId!==null&&navigator.geolocation){
   navigator.geolocation.clearWatch(gpsId);
   gpsId=null;
  }
 }
}
function clear(){
 stops.forEach(f=>{try{f()}catch{}});
 stops=[];avail={};mine={};finance={};priv={};prev=null;seen=null;isOnline=false;currentDebt=0;
 $("lb").disabled=false;
 $("lb").textContent="دخول";
}

function startGPS(){
 if(!navigator.geolocation||gpsId!==null)return;
 gpsId=navigator.geolocation.watchPosition(p=>{pos.lat=p.coords.latitude;pos.lng=p.coords.longitude},e=>console.log("GPS",e),{enableHighAccuracy:true});
}

/* ---------- الاشتراكات ---------- */
function start(){
 clear();startGPS();
 const pr=ref(db,"presence/"+uid);
 const err=l=>e=>say(l+": "+((e&&e.code)||(e&&e.message)||e),1);
 stops.push(onValue(ref(db,"settings"),s=>{
  settings=s.val()||{};debtLimit=Number(settings.debtLimit||15000);
  $("annBox").textContent=settings.announcement||"";$("annBox").hidden=!settings.announcement;
  drawStats();drawOrders();
 },err("الإعدادات")));
 stops.push(onValue(pr,s=>{
  if(!hasActive())isOnline=((s.val()||{}).online===true);
  updateStatusUI();drawOrders();
 },err("الحالة")));
 stops.push(onValue(ref(db,".info/connected"),s=>{
  const ok=s.val()===true;$("off").hidden=ok;
  if(ok)onDisconnect(pr).set({online:false,lastSeen:serverTimestamp()}).then(()=>{if(isOnline)set(pr,{online:true,lastSeen:serverTimestamp()})}).catch(()=>{});
 }));
 stops.push(onValue(query(ref(db,"finance"),orderByChild("userId"),equalTo(uid)),s=>{finance=s.val()||{};drawStats()},()=>{}));
 stops.push(onValue(query(ref(db,"orders"),orderByChild("status"),equalTo("pending")),s=>{avail=s.val()||{};detectNew();drawOrders()},err("الطلبات المتاحة")));
 stops.push(onValue(query(ref(db,"orders"),orderByChild("driverId"),equalTo(uid)),s=>{
  mine=s.val()||{};
  detectStoreReply();
  if(hasActive())isOnline=true;
  fetchPrivate();updateStatusUI();drawStats();drawOrders();
 },err("طلباتي")));
 stops.push(onValue(ref(db,"users/"+uid),s=>{const u=s.val();if(!u||u.isActive===false)logout(true)},()=>{}));
}

function fetchPrivate(){
 activeEntries().forEach(([id])=>{
  if(priv[id])return;
  get(ref(db,"orderPrivate/"+id)).then(s=>{if(s.exists()){priv[id]=s.val();drawOrders()}}).catch(()=>{});
 });
}

/* ---------- تنبيهات الطلبات ---------- */
function rawAvail(){return Object.entries(avail).filter(([,o])=>o&&!o.driverId&&!(o.rejectedBy&&o.rejectedBy[uid]))}
function detectNew(){
 const raw=rawAvail(),canGet=isOnline&&currentDebt<debtLimit&&!hasActive();
 if(seen){
  const fresh=raw.filter(([id])=>!seen.has(id));
  if(fresh.length&&canGet)beep();
 }
 seen=new Set(raw.map(([id])=>id));
}
function detectStoreReply(){
 const now={};Object.entries(mine).forEach(([id,o])=>{if(o)now[id]=o.status});
 if(prev){
  for(const id in now){
   if(prev[id]==="waiting_store"&&now[id]==="accepted"){beep();say("وافق المتجر على طلبك. اذهب للمتجر.");speak("وافق المتجر على طلبك")}
   if(prev[id]==="waiting_store"&&now[id]==="pending"){say("المتجر رفض السائق، وتم إرجاع الطلب.",1)}
  }
 }
 prev=now;
}

/* ---------- الإحصائيات ---------- */
function drawStats(){
 let debt=0,todayProfit=0,done=0;const t0=new Date().setHours(0,0,0,0);
 for(const id in mine){
  const o=mine[id];if(!o||o.status!=="delivered")continue;
  done++;debt+=Math.round(Number(o.platformDeliveryCommission)||0)+Math.round(storeComOf(o));
  if(o.deliveredAt>=t0)todayProfit+=Math.round(Number(o.driverProfit)||0);
 }
 for(const id in finance){
  const f=finance[id];if(!f)continue;
  if(f.type==="cash_received")debt-=Math.round(Number(f.amount)||0);
  if(f.type==="archive"){debt+=Math.round(Number(f.amount)||0);done+=Number(f.count||0)}
 }
 if(debt<0)debt=0;currentDebt=debt;
 $("statDone").textContent=done;$("statDebt").textContent=fmt(debt)+" د.ع";$("statProfit").textContent=fmt(todayProfit)+" د.ع";
 $("warnBox").hidden=debt<debtLimit;updateStatusUI();
}

function updateStatusUI(){
 const btn=$("btnStatus");
 if(currentDebt>=debtLimit&&!hasActive()){isOnline=false;btn.className="status-btn blocked";$("statusTxt").textContent="محظور (تجاوزت سقف الدين)";return}
 if(hasActive()){isOnline=true;btn.className="status-btn on";$("statusTxt").textContent="متصل (لديك طلب نشط)";return}
 if(isOnline){btn.className="status-btn on";$("statusTxt").textContent="متصل (متاح للطلبات)"}
 else{btn.className="status-btn off";$("statusTxt").textContent="غير متصل (مغلق)"}
}
$("btnStatus").onclick=()=>{
 if(currentDebt>=debtLimit)return say("لا يمكنك الاتصال، لقد تجاوزت سقف الدين",1);
 if(hasActive())return say("لا يمكنك الإغلاق ولديك طلبات نشطة",1);
 isOnline=!isOnline;
 set(ref(db,"presence/"+uid),{online:isOnline,lastSeen:serverTimestamp()}).catch(e=>say("تعذّر تغيير الحالة",1));
 if(isOnline){startGPS();speak("أنت الآن متصل")}else speak("أنت الآن غير متصل");
 updateStatusUI();drawOrders();
};

/* ---------- الرسم ---------- */
function buildFinBox(o){
 const storeCom=storeComOf(o),fee=Number(o.deliveryFee)||0;
 const platformCom=Math.round(fee*0.1),payStore=Math.round((Number(o.itemPrice)||0)-storeCom);
 return `<div class="fin-box">
 <div class="fin-row" style="color:#dc3545"><span>تدفع للمتجر:</span> <b>${fmt(payStore)} د.ع</b></div>
 <div class="fin-row" style="color:#1769aa"><span>تستلم من الزبون:</span> <b>${fmt(Math.round(Number(o.customerTotal)||0))} د.ع</b></div>
 <div class="fin-row" style="color:#16a34a"><span>ربحك الصافي (الكروة):</span> <b>${fmt(Math.round(fee*0.9))} د.ع</b></div></div>
 <div class="debt-box">
 <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المنصة (10%):</span> <b>${fmt(platformCom)} د.ع</b></div>
 <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المتجر (ثابتة):</span> <b>${fmt(storeCom)} د.ع</b></div>
 <div class="fin-row" style="color:#b42318;border-top:1px solid #fecdd3;padding-top:4px;margin-top:4px"><span>سيضاف لدينك:</span> <b>${fmt(platformCom+storeCom)} د.ع</b></div></div>`;
}
const mapLink=o=>o.storeMapUrl?`<a href="${esc(o.storeMapUrl)}" target="_blank" class="map-link">📍 فتح موقع المتجر على الخريطة</a>`:"";

function drawOrders(){
 if(!uid)return;
 const canGet=isOnline&&currentDebt<debtLimit;
 if(!canGet)$("availContainer").hidden=true;
 else{
  const av=rawAvail().filter(([,o])=>!hasActive()||(Date.now()-(o.createdAt||0))>120000);
  $("availContainer").hidden=!av.length;
  $("availList").innerHTML=av.map(([id,o])=>`<div class="card new">
   <div class="row"><b>طلب #${esc(id.slice(-6))}</b></div>
   <p style="margin:6px 0;font-size:14px"><b>المتجر:</b> ${esc(o.storeName)}</p>
   <p style="margin:6px 0;font-size:14px"><b>المنطقة:</b> ${esc(o.area)}</p>
   ${mapLink(o)}${buildFinBox(o)}
   <div style="display:flex;gap:8px;margin-top:10px">
    <button style="flex:2" data-a="accept" data-id="${esc(id)}">قبول الطلب</button>
    <button style="flex:1;background:var(--bad)" data-a="reject" data-id="${esc(id)}">رفض</button>
   </div></div>`).join("");
 }
 const ac=activeEntries();
 $("activeContainer").hidden=!ac.length;
 $("activeList").innerHTML=ac.map(([id,o])=>{
  let btn="",warn="",badge="";const now=Date.now(),q=priv[id]||{};
  const st=typeof o.stepAt==="number"?o.stepAt:0;
  if(o.status==="waiting_store"){
   badge=`<span class="badge wait">بانتظار موافقة المتجر</span>`;
   btn=`<div style="text-align:center;padding:15px;background:#fef3c7;color:#b45309;border-radius:8px;font-weight:bold;margin-top:10px">يرجى الانتظار حتى يوافق المتجر على طلبك...</div>`;
  }else if(o.status==="accepted"){
   badge=`<span class="badge">بالطريق للمتجر</span>`;
   if(o.storeLat&&pos.lat){const d=getDist(pos.lat,pos.lng,o.storeLat,o.storeLng);if(d>300)warn=`<p style="color:var(--bad);font-size:12px;margin:4px 0">أنت بعيد عن المتجر (${Math.round(d)}م)</p>`}
   btn=`<button style="width:100%;margin-top:10px;background:var(--ok)" data-a="arrived_store" data-id="${esc(id)}">وصلت للمتجر</button>`;
  }else if(o.status==="arrived_store"){
   badge=`<span class="badge">وصل للمتجر</span>`;const ok=(now-st)>60000;
   btn=`<button style="width:100%;margin-top:10px;background:var(--ok)" ${ok?"":"disabled"} data-a="picked_up" data-id="${esc(id)}">${ok?"تم استلام الطلب":"انتظر دقيقة..."}</button>`;
  }else if(["picked_up","delivering"].includes(o.status)){
   badge=`<span class="badge">بالطريق للزبون</span>`;const ok=(now-st)>300000;
   btn=`<button style="width:100%;margin-top:10px;background:var(--ok)" ${ok?"":"disabled"} data-a="delivered" data-id="${esc(id)}">${ok?"تم التوصيل للزبون":"انتظر 5 دقائق..."}</button>`;
