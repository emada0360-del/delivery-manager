<style>
:root{
--bg:#f2f4f8;--s:#ffffff;--raised:#eef1f6;--ink:#0f1b2a;--mu:#5f7186;--ln:#e3e8ef;
--night:#0d131a;--lc:#0d131a;
--br:#d9002f;--go:#0f9a63;--amber:#b86e00;--info:#1a6fd4;
--br-soft:#d9002f14;--go-soft:#0f9a6318;--amber-soft:#b86e0018;--info-soft:#1a6fd418;
--nav:70px;--r-lg:22px;
--shadow:0 1px 2px #0f1b2a0a,0 8px 24px #0f1b2a10;
--font:"Readex Pro",system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b1118;--s:#141c26;--raised:#1b2531;--ink:#eaf0f7;--mu:#93a3b6;--ln:#253244;--lc:#1a2634;--go:#2ecc8f;--amber:#f0a73a;--info:#5aa2ff;--br:#ee2a52;--br-soft:#ee2a5222;--go-soft:#2ecc8f1f;--amber-soft:#f0a73a1f;--info-soft:#5aa2ff1f;--shadow:0 1px 2px #0006,0 8px 24px #0004}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- أساسيات ---------- */
button{border:0;border-radius:14px;padding:13px 16px;background:var(--br);color:#fff;font:700 15px var(--font);cursor:pointer;transition:transform .12s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.97);filter:brightness(.93)}
button.g{background:var(--go);color:#fff}
button.l{background:var(--raised);color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.full{width:100%;margin-bottom:8px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--info);outline-offset:2px}
input{width:100%;height:50px;padding:0 14px;border:1.5px solid var(--ln);border-radius:14px;font:inherit;color:var(--ink);margin:0 0 10px;background:var(--raised);outline:none;transition:border-color .15s}
input:focus{border-color:var(--info)}
input::placeholder{color:var(--mu);opacity:.8}
.box{background:var(--s);border-radius:var(--r-lg);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.hint{color:var(--mu);font-size:12.5px;margin:8px 0 0}.hint.c{text-align:center}
.mu{color:var(--mu);font-size:12.5px;display:block}
.err{color:var(--br);font-weight:700;margin:2px 0 8px;min-height:20px;text-align:center;font-size:14px}
h4{margin:20px 4px 10px;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
h4 span{font-size:12.5px;color:var(--mu);font-weight:500}

/* ---------- الهيدر ---------- */
header{background:var(--night);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{width:42px;height:42px;border-radius:14px;background:var(--br);display:grid;place-items:center;color:#fff;flex:none}
.logo .ic{width:24px;height:24px}
.ht{min-width:0}
.ht small{display:block;color:#8fa2b7;font-size:11.5px;line-height:1.3}
header h2{margin:0;font-size:17px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.authing header{display:none}
main{max-width:560px;margin:auto;padding:14px 14px calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px))}

/* ---------- تسجيل الدخول ---------- */
#auth{max-width:420px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) 18px 28px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.a-hero{text-align:center;margin-bottom:22px}
.a-hero .logo{width:68px;height:68px;border-radius:22px;margin:0 auto 14px}
.a-hero .logo .ic{width:36px;height:36px}
.a-hero h1{margin:0;font-size:24px;font-weight:700;line-height:1.3}
.a-hero p{margin:6px 0 0;color:var(--mu);font-size:14px}
.a-card{background:var(--s);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.a-card h3{margin:0 0 14px;font-size:19px}
.a-card .sw{text-align:center;margin:12px 0 0}
.a-card .sw a{color:var(--br);font-weight:600;text-decoration:none}

/* ---------- الرئيسية ---------- */
.loc{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px}
.loc .pin{width:42px;height:42px;border-radius:14px;background:var(--go-soft);color:var(--go);display:grid;place-items:center;flex:none}
.loc .t{flex:1;min-width:0}
.loc .t small{display:block;font-size:12px;color:var(--mu);line-height:1.4}
.loc .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.4}
.loc button{padding:9px 14px;font-size:13px;border-radius:12px}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.search input{margin:0;padding-inline-start:44px;background:var(--s);box-shadow:var(--shadow);border-color:transparent}
.seg{display:flex;gap:4px;background:var(--raised);padding:4px;border-radius:15px;margin-bottom:12px}
.fc{flex:1;padding:9px 10px;font-size:13.5px;border-radius:11px;background:transparent;color:var(--mu);font-weight:600}
.fc.on{background:var(--s);color:var(--ink);box-shadow:var(--shadow)}
.fees{background:var(--s);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:6px;box-shadow:var(--shadow)}
.fees-h{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
.fees-h b{font-weight:600}
.fees-h .ic{width:18px;height:18px}
.fr{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.fr::-webkit-scrollbar{display:none}
.fr span{flex:none;min-width:80px;background:var(--raised);border-radius:12px;padding:7px 12px;text-align:center;line-height:1.35}
.fr i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
.fr em{display:block;font-style:normal;color:var(--ink);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}

.rc{background:var(--s);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rh{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:16px;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.av.sm{width:42px;height:42px;border-radius:13px;font-size:18px}
.av.big{width:80px;height:80px;border-radius:50%;font-size:34px;margin:0 auto 10px;background:var(--br)}
.rn{flex:1;min-width:0}
.rn b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mu);margin-top:1px}
.dist .ic{width:14px;height:14px}
.fee{flex:none;text-align:center;background:var(--go-soft);color:var(--go);border-radius:14px;padding:6px 12px;font-weight:700;font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums}
.fee small{display:block;font-weight:500;font-size:11px;opacity:.9}
.fee.off{background:var(--amber-soft);color:var(--amber);font-size:13px;padding:9px 12px}
.rc.off .av{filter:grayscale(.55);opacity:.7}
.ra{display:flex;gap:8px;margin-top:12px}
.ra .main{flex:1;height:48px}
.ra .sm{flex:0 0 50px;height:48px;padding:0}
.why{font-size:12.5px;color:var(--amber);margin-top:10px}

.empty{text-align:center;color:var(--mu);padding:34px 12px}
.eic{width:64px;height:64px;border-radius:50%;background:var(--raised);display:grid;place-items:center;margin:0 auto 12px;color:var(--mu)}
.eic .ic{width:28px;height:28px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.empty span{font-size:13px}
.sk{height:132px;border-radius:var(--r-lg);margin-bottom:12px;background:linear-gradient(90deg,var(--s) 25%,var(--raised) 50%,var(--s) 75%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- حالات الطلب ---------- */
.badge{padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--go-soft);color:var(--go);white-space:nowrap;flex:none}
.badge.c{background:var(--br-soft);color:var(--br)}
.badge.w{background:var(--amber-soft);color:var(--amber)}
.badge.i{background:var(--info-soft);color:var(--info)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:14px;color:var(--mu)}
.row b{color:var(--ink);font-variant-numeric:tabular-nums}
.rows .row:last-child{border-bottom:0}
.row.tot b{font-size:17px;color:var(--go)}

/* بطاقة الطلب الحالي: داكنة ومميزة، تحمل مسار التوصيل */
.live-card{background:var(--lc);color:#fff;border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 12px 30px #0d131a38}
.lc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lc-top small{display:block;color:#8fa2b7;font-size:12px;line-height:1.4}
.lc-top b{display:block;font-size:18px;font-weight:700;line-height:1.35}
.live-card .badge{background:#ffffff1a;color:#fff}
.live-card .badge.c{background:#ff4d6d33;color:#ffa3b4}
.live-card .badge.w{background:#ffb02e2e;color:#ffd08a}
.route{--p:0;list-style:none;margin:18px 0 14px;padding:0;position:relative;display:grid;grid-template-columns:repeat(4,1fr)}
.route::before,.route::after{content:"";position:absolute;top:19px;inset-inline-start:12.5%;height:3px;border-radius:3px}
.route::before{width:75%;background:#ffffff24}
.route::after{width:calc(var(--p)*75%);background:#2ecc8f;transition:width .6s}
.route li{position:relative;z-index:1;text-align:center;font-size:11.5px;color:#8fa2b7;font-weight:500;line-height:1.35;padding:0 2px}
.route li i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--lc);border:2px solid #ffffff30;margin:0 auto 7px;color:#8fa2b7}
.route li i .ic{width:19px;height:19px}
.route li.d i{background:#2ecc8f;border-color:#2ecc8f;color:#06281b}
.route li.n i{border-color:#fff;color:#fff;animation:ring 2.2s ease-out infinite}
.route li.d,.route li.n{color:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 #ffffff59}70%,100%{box-shadow:0 0 0 10px #ffffff00}}
.lnote{font-size:13px;color:#b9c6d6;margin:0 0 12px;line-height:1.7}
.acts{display:flex;gap:8px;margin:0 0 12px}
.acts .main{flex:1}
.acts .sm{flex:0 0 auto}
.live-card button.l{background:#ffffff1a;color:#fff}
.lrows{background:#ffffff0f;border-radius:16px;padding:4px 14px}
.lrows .row{color:#a9b8c9;border-bottom-color:#ffffff24}
.lrows .row b{color:#fff}
.lrows .row:last-child{border-bottom:0}
.lrows .row.tot b{color:#2ecc8f;font-size:19px}
.lhint{font-size:12.5px;color:#8fa2b7;margin:10px 2px 0}

/* ---------- طلباتي ---------- */
.oc{background:var(--s);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.oc-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.oc .l.full{margin:10px 0 0}

/* ---------- حسابي ---------- */
.me-card{text-align:center;padding:22px 16px;margin-bottom:12px}
.me-card b{display:block;font-size:19px}
.me-card span{color:var(--mu);font-size:14px}
.mlist{background:var(--s);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.mi{width:100%;background:transparent;color:var(--ink);border-radius:0;padding:13px 14px;justify-content:flex-start;gap:12px;font-weight:600;border-bottom:1px solid var(--ln);text-align:start}
.mi:last-child{border-bottom:0}
.mi-ic{width:38px;height:38px;border-radius:12px;background:var(--raised);display:grid;place-items:center;flex:none}
.mi-t{flex:1;text-align:start;line-height:1.4}
.mi-t small{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.mi .chev{width:18px;height:18px;color:var(--mu)}
.mi.danger{color:var(--br)}
.mi.danger .mi-ic{background:var(--br-soft);color:var(--br)}

/* ---------- التنقل السفلي ---------- */
#bnav{position:fixed;bottom:0;inset-inline:0;z-index:10;background:var(--s);border-top:1px solid var(--ln);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #0f1b2a0d}
#bnav button{flex:1;background:none;color:var(--mu);padding:4px;font-size:11.5px;font-weight:600;border-radius:14px;position:relative;flex-direction:column;gap:2px;line-height:1.4}
#bnav .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s}
#bnav button.on{color:var(--br)}
#bnav button.on .pill{background:var(--br-soft)}
#bnav em{position:absolute;top:0;inset-inline-start:calc(50% + 10px);background:var(--br);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:520px;margin:0 auto;z-index:30;background:var(--night);color:#fff;padding:13px 16px;border-radius:16px;font-weight:600;text-align:center;box-shadow:0 10px 30px #0f1b2a44;opacity:0;transform:translateY(-12px);pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:none}
#toast.bad{background:var(--br)}

/* ---------- تحديد الموقع والمنيو ---------- */
#locGate{position:fixed;inset:0;z-index:99999;background:var(--night);color:#fff;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));gap:12px}
#locGate h3{margin:0;font-size:18px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
#gmap{flex:1;min-height:240px;border-radius:20px;overflow:hidden}
#gHint{text-align:center;color:#c9d4e0;font-size:14px;line-height:1.7}
#locGate button{width:100%}
#locGate button.l{background:#243142;color:#fff}
#menuM{position:fixed;inset:0;background:var(--s);z-index:20;display:flex;flex-direction:column}
#menuM iframe{flex:1;border:0;width:100%}
#menuM .bar{display:flex;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:var(--night)}
#menuM .bar>*{flex:1}
#menuM .bar .l{background:#243142;color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style id="csExtra">
.cs .cs-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.cs .cs-min{border:0;background:#ffffff1c;color:#fff;border-radius:99px;padding:9px 16px;font:600 13px var(--font);cursor:pointer}
.cs .cs-mini{display:none}
.cs-bot{gap:30px!important}
.cs-ic svg{pointer-events:none}
.cs.min{inset:0 0 auto 0!important;height:calc(62px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0!important;flex-direction:row!important;justify-content:space-between;border-radius:0 0 18px 18px;box-shadow:0 8px 26px #0008;z-index:100001}

.cs-mini small{flex:1;text-align:right;color:#b8c4d3;font-size:13px}
.cs-mini button{border:0;border-radius:99px;background:#e5173f;color:#fff;padding:10px 16px;font:600 13px var(--font)}
</style>
<style id="v2css">
.rimg{display:block;width:100%;height:150px;object-fit:cover;border-radius:16px;margin:0 0 12px;background:var(--raised)}
.rc.off .rimg{filter:grayscale(.6);opacity:.75}
.zbar{background:var(--amber-soft);color:var(--amber);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14px;line-height:1.8}
#tipsM{position:fixed;inset:0;z-index:90;background:#0009;display:flex;align-items:flex-end;justify-content:center}
#tipsM .sheet{background:var(--s);color:var(--ink);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}

#tipsM li::before{content:"";position:absolute;inset-inline-start:2px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--go)}

/* ================= premium layer ================= */
html{-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}

<script>
(function(){
 var ever=false,tm=null,vis=function(){return document.visibilityState!=="hidden"};
 var st=document.createElement("style");
 st.textContent="#netFull{position:fixed;inset:0;z-index:100000;background:#0d131a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;font-family:system-ui,Tahoma,Arial,sans-serif}#netFull[hidden],#netBar[hidden]{display:none}#netFull .i{font-size:60px;line-height:1}#netFull b{font-size:24px}#netFull p{margin:0;color:#b8c4d3;line-height:1.9;font-size:15px}#netFull button{border:0;border-radius:14px;padding:14px 32px;background:#d9002f;color:#fff;font:700 16px system-ui,Tahoma,Arial,sans-serif}#netBar{position:fixed;top:0;left:0;right:0;z-index:100000;background:#b0002a;color:#fff;text-align:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;font:600 14px system-ui,Tahoma,Arial,sans-serif;pointer-events:none}";
 document.head.appendChild(st);
 var full=document.createElement("div");full.id="netFull";full.hidden=true;
 full.innerHTML='<div class="i">📡</div><b>فشل اتصالك بالإنترنت</b><p id="netMsg">تأكد من الواي فاي أو بيانات الجوال، ثم اضغط إعادة المحاولة.</p><button type="button" id="netRetry">إعادة المحاولة</button>';
 var bar=document.createElement("div");bar.id="netBar";bar.hidden=true;bar.textContent="فشل اتصالك بالإنترنت، جارٍ إعادة الاتصال...";
 document.body.appendChild(full);document.body.appendChild(bar);
 function hide(){full.hidden=true;bar.hidden=true}
 function bad(){if(!vis())return;if(ever)bar.hidden=false;else full.hidden=false}
 function ok(){ever=true;clearTimeout(tm);hide()}
 document.getElementById("netRetry").onclick=function(){
  if(navigator.onLine===false){document.getElementById("netMsg").textContent="ما زال الإنترنت مفقوداً. تحقق من الاتصال ثم حاول مجدداً.";return}

  setLoc(la,ln);loc.gps=true;loc.acc=ac;

// ---- المناطق المغلقة ----
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a.ln>p.lng)!==(b.ln>p.lng)&&p.lat<(b.la-a.la)*(p.lng-a.ln)/(b.ln-a.ln)+a.la)c=!c}return c}
function inZone(p){
 if(!p||!zones.length)return null;
 for(const z of zones){
  if(z.type==="circle"){if(km(+z.lat,+z.lng,p.lat,p.lng)*1000<=Number(z.r))return z}
  else{const pts=Object.values(z.pts||{}).map(q=>({la:+q.la,ln:+q.ln})).filter(q=>isFinite(q.la)&&isFinite(q.ln));if(pts.length>2&&inPoly(p,pts))return z}
 }
 return null;
}

function getImg(id,v){
 const c=imgs[id];if(c&&c.v===v)return c.u;
 try{const j=JSON.parse(localStorage.getItem("rimg_"+id)||"null");if(j&&j.v===v&&typeof j.u==="string"){imgs[id]=j;return j.u}}catch(e){}
 const k=id+"_"+v;
 if(!imgLoad.has(k)){imgLoad.add(k);get(ref(db,"restaurantImages/"+id)).then(s=>{const u=s.val();if(typeof u==="string"&&u.startsWith("data:image/")){imgs[id]={v,u};try{localStorage.setItem("rimg_"+id,JSON.stringify({v,u}))}catch(e){}drawList()}}).catch(()=>{})}
 return "";
}

let trk=null;
function closeTrack(){
 if(!trk)return;
 try{trk.unsub&&trk.unsub()}catch(e){}
 try{clearInterval(trk.timer)}catch(e){}
 try{trk.map&&trk.map.remove()}catch(e){}
 try{trk.el.remove()}catch(e){}
 trk=null;
}
function openTrack(id){
 if(typeof L==="undefined"){toast("تعذر تحميل الخريطة، تحقق من الإنترنت",1);return}
 closeTrack();
 const o=orders[id]||{};
 const el=document.createElement("div");
 el.style.cssText="position:fixed;inset:0;z-index:9999;background:#0b1220;display:flex;flex-direction:column";
 el.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;color:#fff;font-weight:700"><span>📍 تتبع السائق</span><span id="trkAge" style="font-weight:500;font-size:13px;color:#cbd5e1">بانتظار موقع السائق…</span><button id="trkX" style="background:#475569;color:#fff;border:0;border-radius:12px;padding:8px 14px;font-weight:700">إغلاق</button></div><div id="trkMap" style="flex:1;min-height:300px"></div>';
 document.body.appendChild(el);
 const map=L.map("trkMap").setView([Number(o.lat)||33.75,Number(o.lng)||44.63],14);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 let dest=null;
 if(typeof o.lat==="number"&&typeof o.lng==="number"){dest=L.marker([o.lat,o.lng]).addTo(map).bindTooltip("موقعك");}
 const icon=L.divIcon({className:"",html:'<div style="font-size:30px;line-height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))">🛵</div>',iconSize:[30,30],iconAnchor:[15,15]});
 trk={el,map,drv:null,t:0,timer:null,unsub:null,fitted:false};
 el.querySelector("#trkX").onclick=closeTrack;
 trk.unsub=onValue(ref(db,"tracking/"+id),s=>{
  const v=s.val();if(!v||!trk)return;
  const ll=[Number(v.lat),Number(v.lng)];if(!isFinite(ll[0])||!isFinite(ll[1]))return;

 },()=>{const a=el.querySelector("#trkAge");if(a)a.textContent="تعذر تحميل موقع السائق"});
 trk.timer=setInterval(()=>{
  const a=el.querySelector("#trkAge");if(!a||!trk||!trk.t)return;
  const sec=Math.max(0,Math.round((Date.now()-trk.t)/1000));
  a.textContent=sec<60?"آخر تحديث قبل "+sec+" ث":"آخر تحديث قبل "+Math.round(sec/60)+" د";
 },1000);
 setTimeout(()=>map.invalidateSize(),80);
}

}

function chShrink(f,m,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function openChat(oid,role,myUid){
 const old=document.getElementById("chatBox");if(old)old.remove();
 const d=document.createElement("div");d.id="chatBox";
 d.style.cssText="position:fixed;inset:0;z-index:9999;background:#0d131a;display:flex;flex-direction:column;direction:rtl;color:#fff;font-family:inherit";
 d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:#151d27"><b>الدردشة</b><button id="chX" type="button" style="background:#2a3441;color:#fff;border:0;border-radius:10px;padding:8px 14px">إغلاق</button></div><div id="chL" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px"></div><div style="display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#151d27"><label style="background:#2a3441;border-radius:12px;padding:10px 12px">📷<input id="chF" type="file" accept="image/*" hidden></label><input id="chT" placeholder="اكتب رسالة" style="flex:1;min-width:0;border:0;border-radius:12px;padding:10px;background:#1f2933;color:#fff"><button id="chS" type="button" style="background:#d9002f;color:#fff;border:0;border-radius:12px;padding:10px 16px">إرسال</button></div>';
 document.body.appendChild(d);
 const L=d.querySelector("#chL"),T=d.querySelector("#chT"),cref=ref(db,"chats/"+oid);
 const un=onValue(cref,s=>{const v=s.val()||{};L.innerHTML="";Object.values(v).sort((a,b)=>(a.at||0)-(b.at||0)).forEach(m=>{const b=document.createElement("div");b.style.cssText="max-width:78%;padding:8px 12px;border-radius:14px;word-break:break-word;"+(m.from===role?"align-self:flex-start;background:#d9002f":"align-self:flex-end;background:#2a3441");if(m.img&&String(m.img).startsWith("data:image/")){const i=document.createElement("img");i.src=m.img;i.style.cssText="max-width:100%;border-radius:10px;display:block";b.appendChild(i)}if(m.text){const t=document.createElement("div");t.textContent=m.text;b.appendChild(t)}L.appendChild(b)});L.scrollTop=L.scrollHeight},()=>{L.textContent="تعذر تحميل الدردشة"});
 const send=async(img)=>{const text=T.value.trim();if(!text&&!img)return;T.value="";try{await push(cref,{from:role,uid:myUid,at:Date.now(),...(text?{text:text.slice(0,500)}:{}),...(img?{img}:{})})}catch(e){alert("تعذر الإرسال: "+(e.code||e.message))}};
 d.querySelector("#chS").onclick=()=>send();
 T.onkeydown=e=>{if(e.key==="Enter")send()};
 d.querySelector("#chF").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{let u=await chShrink(f,900,.6);if(u.length>140000)u=await chShrink(f,600,.4);if(u.length>140000)return alert("الصورة كبيرة، اختر صورة أصغر");send(u)}catch(x){alert("تعذر قراءة الصورة")}};
 d.querySelector("#chX").onclick=()=>{try{un()}catch(e){}d.remove()};
}

$("cur").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.chat)openChat(b.dataset.chat,"c",me.uid);
 if(b.dataset.drvwa){const o=orders[b.dataset.drvwa]||{};let p=String(o.driverPhone||"").replace(/\D/g,"");if(p.startsWith("0"))p="964"+p.slice(1);if(!p)return toast("رقم السائق غير متوفر",1);window.open("https://wa.me/"+p+"?text="+encodeURIComponent("مرحباً، أنا صاحب الطلب #"+String(b.dataset.drvwa).slice(-5)),"_blank")}

});
</script></body></html>
