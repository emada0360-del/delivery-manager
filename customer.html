function initMap(){
 if(map)return;
 map=L.map("gmap").setView([33.75,44.63],12);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
 map.on("click",e=>setLoc(e.latlng.lat,e.latlng.lng));
}
function setLoc(la,ln){loc={lat:la,lng:ln};if(pin)pin.setLatLng([la,ln]);else{pin=L.marker([la,ln],{draggable:true}).addTo(map);pin.on("dragend",()=>{const c=pin.getLatLng();setLoc(c.lat,c.lng)})}$("locS").textContent="تم تحديد موقعك ✓";$("gOk").disabled=false;try{localStorage.setItem("custLoc",JSON.stringify(loc))}catch(e){}drawList()}
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function ll(u){const s=decodeURIComponent(String(u||""));for(const re of [/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/]){const m=s.match(re);if(m)return{lat:+m[1],lng:+m[2]}}return null}
function quote(r){
 if(!loc)return{ok:false,why:"حدد موقعك أولاً"};
 const p=typeof r.lat==="number"?{lat:r.lat,lng:r.lng}:ll(r.mapUrl);if(!p)return{ok:false,why:"المطعم لم يحدد موقعه بعد"};
 if(!fees.length)return{ok:false,why:"أسعار التوصيل غير محددة حالياً"};
 const d=km(p.lat,p.lng,loc.lat,loc.lng),ringF=[...fees].sort((a,b)=>a.km-b.km).find(f=>d<=f.km);
 return ringF?{ok:true,fee:ringF.fee,km:d}:{ok:false,why:"المسافة أبعد من نطاق التوصيل"};
}

const TO=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error("timeout")),ms))]);
let wN=null,wN2=null,wW=null,wW2=null,trackT=null;
function NGp(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation}
function stopWatches(){
 const G=NGp();
 [wN,wN2].forEach(id=>{try{if(G&&id&&id!=="p")G.clearWatch({id})}catch(e){}});wN=wN2=null;
 [wW,wW2].forEach(id=>{try{if(id!=null)navigator.geolocation.clearWatch(id)}catch(e){}});wW=wW2=null;
}
function openPicker(){
 $("locGate").hidden=false;

// كل قراءة GPS جديدة: يتحدث الموقع تلقائياً إذا تغيّر مكان الزبون
function onFix(p){
 try{
  if(!p||!p.coords)return;
  const la=p.coords.latitude,ln=p.coords.longitude,ac=Math.round(p.coords.accuracy||9999);
  if(loc&&loc.gps){
   const d=km(loc.lat,loc.lng,la,ln)*1000;
   if(d<25&&ac>=loc.acc*0.8)return;                 // لم يتحرك ولا تحسّنت الدقة
   if(ac>loc.acc*2&&d<loc.acc+ac)return;            // قراءة أسوأ بكثير داخل هامش الخطأ
  }
  const first=!(loc&&loc.gps);
  setLoc(la,ln);loc.gps=true;loc.acc=ac;
  $("locS").textContent="موقعك محدد تلقائياً ✓ (±"+ac+" م)";
  clearTimeout(trackT);
  if(first||!$("locGate").hidden){map.setView([la,ln],16);setTimeout(()=>map.invalidateSize(),60)}
  $("locGate").hidden=true;
 }catch(e){}
}
function startTracking(){
 stopWatches();
 if(!loc||!loc.gps){
  $("gHint").textContent="جارٍ تحديد موقعك تلقائياً... قد يستغرق دقيقة";
  clearTimeout(trackT);
  trackT=setTimeout(()=>{if(!loc||!loc.gps)$("gHint").textContent="لم يلتقط GPS موقعك بعد. تأكد أن الموقع مفعّل، أو اضغط على الخارطة لتحديد مكانك مؤقتاً وسيتحدث تلقائياً عند التقاط GPS."},20000);
 }
 const NG=NGp();
 if(NG)(async()=>{
  try{
   let pr=await TO(NG.checkPermissions(),5000);
   if(pr.location!=="granted"&&pr.coarseLocation!=="granted")pr=await TO(NG.requestPermissions({permissions:["location"]}),30000);
   if(pr.location!=="granted"&&pr.coarseLocation!=="granted"){$("gHint").textContent="إذن الموقع مرفوض. فعّله من إعدادات الهاتف ← التطبيقات ← الأذونات ← الموقع.";return}
   const cb=pos=>{if(pos)onFix(pos)};
   wN="p";NG.watchPosition({enableHighAccuracy:false,timeout:20000,maximumAge:60000},cb).then(id=>{wN=id}).catch(()=>{wN=null});
   NG.watchPosition({enableHighAccuracy:true,timeout:30000,maximumAge:5000},cb).then(id=>{wN2=id}).catch(()=>{wN2=null});
  }catch(e){}
 })();
 if(navigator.geolocation&&window.isSecureContext!==false){
  try{
   wW=navigator.geolocation.watchPosition(onFix,()=>{},{enableHighAccuracy:false,timeout:20000,maximumAge:60000});
   wW2=navigator.geolocation.watchPosition(onFix,()=>{},{enableHighAccuracy:true,timeout:30000,maximumAge:5000});
  }catch(e){}
 }
}

 ${o.status==="cancelled"?"":`<div class="steps">${steps}</div>`}
 ${o.status==="calling"&&!price?`<p class="hint" style="margin:0 0 10px">بعد المكالمة سيسجّل المطعم سعر طلبك.</p><div class="acts"><button class="g main" data-redial="${id}">📞 إعادة الاتصال</button><button class="l sm" data-cancel="${id}">إلغاء</button></div>`:""}
 <div class="row"><span>سعر الطلب</span><b>${price?fmt(price)+" د.ع"+(o.priceFixed?" (مُصحَّح، كان "+fmt(o.priceOld)+")":""):"بانتظار المطعم"}</b></div>
 <div class="row"><span>أجرة التوصيل</span><b>${fmt(fee)} د.ع</b></div>
 <div class="row tot"><span>المجموع</span><b>${price?fmt(price+fee)+" د.ع":"—"}</b></div>
 ${isLive(o)&&price?'<p class="hint">لإلغاء الطلب بعد تحديد السعر تواصل مع الإدارة.</p>':""}</div>`;
}
</script></body></html>
