async function devId(){
 let id="";
 try{const D=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Device;if(D){const r=await D.getId();id=r.identifier||r.uuid||""}}catch(e){}
 if(!id){try{id=localStorage.getItem("did")||"";if(!id){id="w"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("did",id)}}catch(e){id="w"+Date.now()}}
 return String(id).replace(/[^A-Za-z0-9_-]/g,"_");
}

let zLayer=null,mLayer=null,me=null,prof=null,rests={},zones={},fees=[],orders={},loc=null,map,pin,unsubs=[];

async function iceServers(){
 const u="0f46505186311035bcd6abe4",c="jOQQDrOES5mQfiH7";
 return [{urls:"stun:stun.relay.metered.ca:80"},{urls:"stun:stun.l.google.com:19302"},
  {urls:"turn:global.relay.metered.ca:80",username:u,credential:c},
  {urls:"turn:global.relay.metered.ca:80?transport=tcp",username:u,credential:c},
  {urls:"turn:global.relay.metered.ca:443",username:u,credential:c},
  {urls:"turns:global.relay.metered.ca:443?transport=tcp",username:u,credential:c}];
}
let call=null,onCallEnd=()=>{};
function ui(t,btns){
 let d=document.getElementById("callUI");
 if(!t){d&&d.remove();return}
 if(!d){d=document.createElement("div");d.id="callUI";d.style.cssText="position:fixed;inset:0;background:#0d131aee;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;font:700 20px system-ui;text-align:center;padding:20px";document.body.appendChild(d)}
 d.innerHTML=`<div style="font-size:54px">📞</div><div>${t}</div><div style="display:flex;gap:12px">${(btns||[]).map((b,i)=>`<button data-i="${i}" style="border:0;border-radius:14px;padding:14px 26px;font:700 17px inherit;color:#fff;background:${b[2]||"#d9002f"}">${b[0]}</button>`).join("")}</div>`;
 d.onclick=e=>{const b=e.target.closest("button");if(b)btns[b.dataset.i][1]()};
}
let ringT=null;
function ring(on){
 clearInterval(ringT);if(!on)return;
 const beep=()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},400)}catch(e){}if(navigator.vibrate)navigator.vibrate(300)};
 beep();ringT=setInterval(beep,1200);
}
function addC(c,x){if(c.pc.remoteDescription)c.pc.addIceCandidate(x).catch(()=>{});else c.q.push(x)}
function flush(c){c.q.splice(0).forEach(x=>c.pc.addIceCandidate(x).catch(()=>{}))}
async function openCall(oid,role){
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const pc=new RTCPeerConnection({iceServers:await iceServers()});
 const c=call={oid,role,pc,stream,un:[],q:[]};
 stream.getTracks().forEach(t=>pc.addTrack(t,stream));
 const au=new Audio();au.autoplay=true;
 pc.ontrack=e=>{au.srcObject=e.streams[0];au.play().catch(()=>{})};
 const mine=role==="c"?"cC":"rC",theirs=role==="c"?"rC":"cC";
 pc.onicecandidate=e=>{if(e.candidate)push(ref(db,`calls/${oid}/${mine}`),e.candidate.toJSON())};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected")ui("متصل 🔊",[["إنهاء",hangup]]);if(pc.connectionState==="failed"){ui("تعذر الاتصال بسبب الشبكة",[["إغلاق",hangup]])}};
 c.un.push(onChildAdded(ref(db,`calls/${oid}/${theirs}`),s=>addC(c,s.val())));
 c.un.push(onValue(ref(db,`calls/${oid}/ended`),s=>{if(s.val())closeCall()}));
 return c;
}
async function dial(oid){
 if(call)return;
 try{
  await set(ref(db,"calls/"+oid),null);
  const c=await openCall(oid,"c");
  ui("جارٍ الاتصال بالمطعم...",[["إنهاء",hangup]]);
  const o=await c.pc.createOffer();await c.pc.setLocalDescription(o);
  await set(ref(db,`calls/${oid}/offer`),{type:o.type,sdp:o.sdp});
  c.un.push(onValue(ref(db,`calls/${oid}/answer`),async s=>{const a=s.val();if(a&&!c.pc.remoteDescription){await c.pc.setRemoteDescription(a);flush(c)}}));
  await update(ref(db,"customerOrders/"+oid),{ring:Date.now()});
  setTimeout(()=>{if(call&&call.oid===oid&&call.pc.connectionState!=="connected")hangup()},45000);
 }catch(e){closeCall(true);alert("تعذر بدء المكالمة: "+(e.name==="NotAllowedError"?"اسمح باستخدام المايكروفون":e.message))}
}
async function answerCall(oid){
 if(call)return;ring(false);
 try{
  const off=(await get(ref(db,`calls/${oid}/offer`))).val();
  if(!off){ui("");return}
  const c=await openCall(oid,"r");ui("جارٍ الربط...");
  await c.pc.setRemoteDescription(off);flush(c);
  const a=await c.pc.createAnswer();await c.pc.setLocalDescription(a);
  await set(ref(db,`calls/${oid}/answer`),{type:a.type,sdp:a.sdp});
 }catch(e){closeCall(true);alert("تعذر الرد: "+e.message)}
}
function hangup(){if(call)set(ref(db,`calls/${call.oid}/ended`),Date.now()).catch(()=>{});closeCall()}
function closeCall(quiet){
 ring(false);ui("");
 if(!call)return;const c=call;call=null;
 c.un.forEach(f=>{try{f()}catch(e){}});c.stream.getTracks().forEach(t=>t.stop());try{c.pc.close()}catch(e){}
 if(!quiet)onCallEnd(c);
}

function initMap(){
 if(map)return;
 map=L.map("map").setView([33.75,44.63],12);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
}
function setLoc(la,ln){loc={lat:la,lng:ln};$("locGate").hidden=true;if(pin)pin.setLatLng([la,ln]);else pin=L.marker([la,ln]).addTo(map);$("locS").textContent="تم تحديد موقعك ✓";drawList()}
$("locEdit").onclick=$("gps").onclick=()=>{locTry++;stopWatches();needLoc()};
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
function ll(u){const s=decodeURIComponent(String(u||""));for(const re of [/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/[?&](?:q|ll|query|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/]){const m=s.match(re);if(m)return{lat:+m[1],lng:+m[2]}}return null}
function quote(r){
 if(!loc)return{ok:false,why:"حدد موقعك أولاً"};
 const zs=Object.values(zones);
 if(!zs.some(z=>z.isOpen!==false&&km(z.lat,z.lng,loc.lat,loc.lng)<=z.radiusKm))return{ok:false,why:"موقعك خارج مناطق الخدمة حالياً"};
 const p=typeof r.lat==="number"?{lat:r.lat,lng:r.lng}:ll(r.mapUrl);if(!p)return{ok:false,why:"المطعم لم يحدد موقعه بعد"};
 const d=km(p.lat,p.lng,loc.lat,loc.lng),ringF=[...fees].sort((a,b)=>a.km-b.km).find(f=>d<=f.km);
 return ringF?{ok:true,fee:ringF.fee,km:d}:{ok:false,why:"المسافة أبعد من نطاق التوصيل"};
}

let locTry=0,wN=null,wW=null,retryT=null,dbg=[];

function NGp(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation}
function stopWatches(){
 try{if(wN!=null&&wN!=="pending"&&NGp())NGp().clearWatch({id:wN})}catch(e){}wN=null;
 try{if(wW!=null)navigator.geolocation.clearWatch(wW)}catch(e){}wW=null;
}
function onFix(p){
 try{
  const la=p.coords.latitude,ln=p.coords.longitude,ac=Math.round(p.coords.accuracy||0);
  $("locGate").hidden=true;clearTimeout(retryT);
  if(loc&&loc.acc&&ac>loc.acc*1.5&&ac>50)return;
  setLoc(la,ln);loc.acc=ac;
  if(map){map.setView([la,ln],Math.max(map.getZoom(),16));setTimeout(()=>map.invalidateSize(),60)}
  const a=$("accS");if(a)a.textContent="دقة الموقع: ~"+ac+" متر";
 }catch(e){D("fixerr:"+(e&&e.message))}
}
function onErr(er){
 if(er&&er.code===1){gateMsg("الموقع إجباري لاستخدام التطبيق.<br>افتح إعدادات الهاتف ← التطبيقات ← الأذونات ← الموقع ← <b>السماح</b> (مع تفعيل <b>الموقع الدقيق</b>)، ثم ارجع واضغط الزر.");return}
 gateMsg("تعذر تحديد موقعك بدقة. فعّل <b>GPS</b> (وضع الدقة العالية) وتأكد من الإنترنت، وسنعيد المحاولة تلقائياً.");
 clearTimeout(retryT);retryT=setTimeout(()=>{if(!loc)needLoc()},5000);
}
const TO=(p,ms,t)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error(t+" timeout")),ms))]);
function needLoc(){
 if(loc){$("locGate").hidden=true;return}
 dbg=[];
 const my=++locTry;let fails=0,total=0,denied=false;
 gateMsg("جارٍ تحديد موقعك بدقة عالية...");
 const fail=(tag,e)=>{
  if(my!==locTry||loc)return;
  const m=String((e&&(e.message||e.code))||e);D(tag+":"+m);
  if((e&&e.code===1)||/denied|permission/i.test(m))denied=true;
  if(++fails>=total)onErr({code:denied?1:2});
 };
 const NG=NGp();
 D(NG?"native:yes":"native:no");
 if(NG){total++;(async()=>{
  try{
   let pr=await TO(NG.checkPermissions(),6000,"check");
   D("perm:"+pr.location+"/"+pr.coarseLocation);
   if(pr.location!=="granted"&&pr.coarseLocation!=="granted"){
    pr=await TO(NG.requestPermissions({permissions:["location"]}),30000,"request");
    D("perm2:"+pr.location+"/"+pr.coarseLocation);
   }
   if(pr.location!=="granted"&&pr.coarseLocation!=="granted"){fail("native",{code:1,message:"denied"});return}
   // المراقبة الدقيقة تشتغل بالتوازي (تحسّن الموقع باستمرار)
   if(wN==null){wN="pending";NG.watchPosition({enableHighAccuracy:true,timeout:30000,maximumAge:5000},(pos,err)=>{if(pos){D("watch fix");onFix(pos)}else if(err)D("watch:"+(err.message||err.code))}).then(id=>{wN=id}).catch(e=>{wN=null;D("watchfail:"+(e&&e.message))})}
   // قراءة سريعة أولاً (شبكة/آخر موقع معروف) حتى لا ننتظر GPS البارد
   const p=await TO(NG.getCurrentPosition({enableHighAccuracy:false,timeout:12000,maximumAge:600000}),15000,"get");
   D("native fix");onFix(p);
  }catch(e){fail("native",e)}
 })()}
 if(navigator.geolocation&&window.isSecureContext!==false){total++;
  navigator.geolocation.getCurrentPosition(p=>{if(my!==locTry)return;D("web fix");onFix(p);
   if(wW==null)try{wW=navigator.geolocation.watchPosition(onFix,()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}catch(e){}
  },e=>fail("web",e),{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
 }
 if(!total)onErr({code:2});
 // شبكة أمان: إذا ما رجع أي شيء خلال 25 ثانية
 setTimeout(()=>{if(my===locTry&&!loc){D("watchdog");onErr({code:denied?1:2})}},25000);
}
$("locBtn").onclick=needLoc;
try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(r=>{r.onchange=()=>{if(me&&!loc)needLoc()}})}catch(e){}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me&&!loc)needLoc()});

// ---- قائمة المطاعم ----
function drawMapLayers(){
 if(!map)return;
 if(zLayer)map.removeLayer(zLayer);if(mLayer)map.removeLayer(mLayer);
 zLayer=L.layerGroup(Object.values(zones).filter(z=>z.isOpen!==false).map(z=>L.circle([z.lat,z.lng],{radius:(z.radiusKm||1)*1000,color:"#0f9a63",fillOpacity:.12,weight:2}))).addTo(map);
 mLayer=L.layerGroup(Object.values(rests).map(r=>{const p=typeof r.lat==="number"?{lat:r.lat,lng:r.lng}:ll(r.mapUrl);return p?L.marker([p.lat,p.lng]).bindTooltip(r.name||""):null}).filter(Boolean)).addTo(map);
}
function drawList(){
 drawMapLayers();
 const busy=Object.values(orders).some(isLive);
 const items=Object.entries(rests).filter(([,r])=>r.isOpen!==false).map(([id,r])=>({id,r,q:quote(r)}));
 items.sort((a,b)=>(b.q.ok-a.q.ok)||((a.q.km||99)-(b.q.km||99)));
 $("list").innerHTML=items.map(({id,r,q})=>`<div class="box"><div class="rest"><div class="av">${esc((r.name||"؟").trim().charAt(0))}</div>
  <div class="n"><b>${esc(r.name)}</b><span>${q.ok?q.km.toFixed(1)+" كم عنك":""}</span></div>
  ${q.ok?`<span class="tag">توصيل ${fmt(q.fee)} د.ع</span>`:`<span class="tag w">غير متاح</span>`}</div>
  ${q.ok?"":`<div class="why">${q.why}</div>`}
  <div class="acts"><button class="g main" data-c="${esc(id)}" ${q.ok&&!busy?"":"disabled"}>📞 اطلب بالاتصال</button>${r.menuUrl?`<button class="l sm" data-m="${esc(id)}">📋 المنيو</button>`:""}${r.mapUrl?`<button class="l sm" data-g="${esc(id)}">🗺️</button>`:""}</div>
  ${busy&&q.ok?'<div class="why">لديك طلب جارٍ، انتظر اكتماله لتطلب مجدداً.</div>':""}</div>`).join("")||'<p style="text-align:center;color:var(--mu)">لا توجد مطاعم حالياً</p>';
}
$("list").onclick=async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.g){window.open(rests[b.dataset.g].mapUrl,"_blank");return}
 if(b.dataset.m){const u=rests[b.dataset.m].menuUrl;$("mf").src=u;$("mo").onclick=()=>window.open(u,"_blank");$("menuM").hidden=false}
 if(b.dataset.c){
  if(Object.values(orders).some(isLive))return alert("لديك طلب جارٍ بالفعل");
  const r=rests[b.dataset.c],q=quote(r);if(!q.ok)return;
  b.disabled=true;
  try{
   if(await isBanned()){await signOut(auth);return}
   const o=push(ref(db,"customerOrders"));
   await set(o,{customerId:me.uid,restaurantId:b.dataset.c,restaurantName:r.name,lat:loc.lat,lng:loc.lng,distanceKm:+q.km.toFixed(2),deliveryFee:q.fee,status:"calling",createdAt:Date.now()});
   await set(ref(db,"customerOrderPrivate/"+o.key),{customerId:me.uid,name:prof.name,phone:prof.phone,deviceId:await devId()});
   dial(o.key);
  }catch(er){alert("تعذر إرسال الطلب: "+(er.code||er.message));drawList()}
 }
};
$("cur").onclick=async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.redial)dial(b.dataset.redial);
 if(b.dataset.cancel&&confirm("إلغاء الطلب؟"))update(ref(db,"customerOrders/"+b.dataset.cancel),{status:"cancelled"}).catch(()=>alert("تعذر الإلغاء، تواصل مع الإدارة"));
};
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(!call)goOffline(db)}else goOnline(db)});
$("mx").onclick=()=>{$("menuM").hidden=true;$("mf").src="about:blank"};
setInterval(()=>{if(me){drawCur();drawList()}},60000);

// ---- الطلب الحالي ----
function drawCur(){
 const act=Object.entries(orders).sort((a,b)=>b[1].createdAt-a[1].createdAt)[0];
 const show=act&&(isLive(act[1])||(act[1].status!=="calling"&&Date.now()-(Number(act[1].createdAt)||0)<6*3600e3));
 $("cur").hidden=!show;if(!show)return;
 const [id,o]=act,price=Number(o.price)||0,stage=STAGE[o.status]??1,fee=Number(o.deliveryFee)||0;
 const bc=o.status==="cancelled"?"c":(o.status==="calling"?"w":"");
 const steps=["التحضير","السائق للمطعم","بالطريق إليك","التسليم"].map((n,k)=>`<div class="st ${stage>k+1?"d":stage===k+1?"n":""}"><i>${stage>k+1?"✓":k+1}</i>${n}</div>`).join("");
 $("cur").innerHTML=`<div class="top"><b>${esc(o.restaurantName)}</b><span class="badge ${bc}">${ST[o.status]||esc(o.status)}</span></div>
 ${o.status==="cancelled"?"":`<div class="steps">${steps}</div>`}
 ${o.status==="calling"&&!price?`<p class="hint" style="margin:0 0 10px">بعد المكالمة سيسجّل المطعم سعر طلبك.</p><div class="acts"><button class="g main" data-redial="${id}">📞 إعادة الاتصال</button><button class="l sm" data-cancel="${id}">إلغاء</button></div>`:""}
 <div class="row"><span>سعر الطلب</span><b>${price?fmt(price)+" د.ع"+(o.priceFixed?" (مُصحَّح، كان "+fmt(o.priceOld)+")":""):"بانتظار المطعم"}</b></div>
 <div class="row"><span>أجرة التوصيل</span><b>${fmt(fee)} د.ع</b></div>
 <div class="row tot"><span>المجموع</span><b>${price?fmt(price+fee)+" د.ع":"—"}</b></div>
 ${isLive(o)?'<p class="hint">لإلغاء الطلب بعد تحديد السعر تواصل مع الإدارة.</p>':""}`;
}
</script></body></html>
