
name: Build Baqubah Delivery APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APKs
        run: gradle --no-daemon assembleDebug

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: al-delfry-al-hur
          path: app-driver/build/outputs/apk/debug/app-driver-debug.apk

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: tawseel-al-saree
          path: app-store/build/outputs/apk/debug/app-store-debug.apk
