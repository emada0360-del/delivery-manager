
name: Build Baqubah Delivery APKs
on: [push, workflow_dispatch]

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APKs
        run: gradle --no-daemon assembleDebug

      - name: Upload driver APK
        uses: actions/upload-artifact@v4
        with:
          name: driver-apk
          path: app-driver/build/outputs/apk/debug/*.apk

      - name: Upload store APK
        uses: actions/upload-artifact@v4
        with:
          name: store-apk
          path: app-store/build/outputs/apk/debug/*.apk
          
