name: Build APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [driver, store]
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          mkdir -p build/www
          cp "$APP.html" build/www/index.html
          cd build
          echo '{"name":"baqubah-app","version":"1.0.0","private":true}' > package.json
          printf '{"appId":"com.baqubah.%s","appName":"Baqubah %s","webDir":"www"}' "$APP" "$APP" > capacitor.config.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap add android

      - name: Add background service (driver only)
        if: matrix.app == 'driver'
        working-directory: build
        run: |
          JAVA_DIR=android/app/src/main/java/com/baqubah/driver
          cat > $JAVA_DIR/MainActivity.java <<'EOF'
          package com.baqubah.driver;

          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                Intent i = new Intent(this, OrderService.class);
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
              } catch (Exception e) {}
            }
          }
          EOF
          cat > $JAVA_DIR/OrderService.java <<'EOF'
          package com.baqubah.driver;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class OrderService extends Service {
            private PowerManager.WakeLock wl;

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public void onCreate() {
              super.onCreate();
              String ch = "svc";
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(ch, "Order service", NotificationManager.IMPORTANCE_LOW));
              }
              Intent open = new Intent(this, MainActivity.class);
              PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification.Builder b = (Build.VERSION.SDK_INT >= 26) ? new Notification.Builder(this, ch) : new Notification.Builder(this);
              Notification n = b.setContentTitle("Baqubah Delivery")
                .setContentText("Waiting for new orders")
                .setSmallIcon(android.R.drawable.ic_dialog_info)
                .setContentIntent(pi)
                .setOngoing(true)
                .build();
              if (Build.VERSION.SDK_INT >= 34) {
                startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
              } else {
                startForeground(1, n);
              }
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "baqubah:orders");
              wl.acquire();
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }

            @Override
            public void onDestroy() {
              if (wl != null && wl.isHeld()) wl.release();
              super.onDestroy();
            }
          }
          EOF

      - name: Patch manifest
        working-directory: build
        run: |
          python3 - <<'PY'
          import os
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['POST_NOTIFICATIONS', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']
          svc = ''
          if os.environ['APP'] == 'driver':
              perms += ['FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_SPECIAL_USE', 'WAKE_LOCK']
              svc = ('<service android:name=".OrderService" android:exported="false" '
                     'android:foregroundServiceType="specialUse">'
                     '<property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="order_listener" />'
                     '</service>\n')
          add = ''.join('<uses-permission android:name="android.permission.%s" />\n' % x for x in perms)
          s = s.replace('<application', add + '<application', 1)
          s = s.replace('</application>', svc + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync and build
        working-directory: build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
