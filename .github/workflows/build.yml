
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: driver
            name: Baqubah Driver
            id: com.baqubah.driver
            page: driver.html
          - role: store
            name: Baqubah Store
            id: com.baqubah.store
            page: store.html

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          mkdir www
          echo '<html></html>' > www/index.html
          npm init -y

          npm i --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/local-notifications@6

          if [ "${{ matrix.role }}" = "driver" ]; then
            npm i --legacy-peer-deps @capacitor/push-notifications@6

            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "Missing GitHub secret GOOGLE_SERVICES_JSON"
              exit 1
            fi
          fi

          cat > capacitor.config.json <<CFG
          {
            "appId": "${{ matrix.id }}",
            "appName": "${{ matrix.name }}",
            "webDir": "www",
            "server": {
              "url": "https://emada0360-del.github.io/delivery-manager/${{ matrix.page }}",
              "cleartext": false
            }
          }
          CFG

          npx cap add android
          npx cap sync android

          if [ "${{ matrix.role }}" = "driver" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Add permissions
        run: |
          cd app/android/app/src/main

          for p in POST_NOTIFICATIONS WAKE_LOCK FOREGROUND_SERVICE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION VIBRATE; do
            if ! grep -q "android.permission.$p" AndroidManifest.xml; then
              sed -i "/<\/manifest>/i <uses-permission android:name=\"android.permission.$p\" />" AndroidManifest.xml
            fi
          done

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
