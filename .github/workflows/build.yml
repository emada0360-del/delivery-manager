name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: driver
            name: Baqubah Driver
            id: com.baqubah.driver
            page: driver.html
          - role: store
            name: Baqubah Store
            id: com.baqubah.store
            page: store.html

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          mkdir www
          echo '<html></html>' > www/index.html
          npm init -y

          npm i --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/local-notifications@6

          if [ "${{ matrix.role }}" = "driver" ]; then
            npm i --legacy-peer-deps @capacitor/push-notifications@6
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "Missing GitHub secret GOOGLE_SERVICES_JSON"
              exit 1
            fi
          fi

          cat > capacitor.config.json <<CFG
          {
            "appId": "${{ matrix.id }}",
            "appName": "${{ matrix.name }}",
            "webDir": "www",
            "server": {
              "url": "https://emada0360-del.github.io/delivery-manager/${{ matrix.page }}",
              "cleartext": false
            }
          }
          CFG

          npx cap add android
          npx cap sync android

          if [ "${{ matrix.role }}" = "driver" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Generate Custom Motorcycle App Icon & Firebase Service
        env:
          APP_ROLE: ${{ matrix.role }}
        run: |
          pip install Pillow --break-system-packages

          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw

          role = os.environ.get("APP_ROLE", "store")
          os.chdir("app/android")

          def create_icon(size, filename):
              img = Image.new('RGBA', (size, size), (18, 18, 24, 255))
              draw = ImageDraw.Draw(img)
              
              margin = size // 10
              draw.ellipse([margin, margin, size - margin, size - margin], fill=(225, 29, 72, 255))
              
              box_w = size // 2.5
              box_h = size // 3
              x0 = (size - box_w) // 2
              y0 = (size - box_h) // 2 + size // 20
              draw.rounded_rectangle([x0, y0, x0 + box_w, y0 + box_h], radius=size//16, fill=(255, 255, 255, 255))
              
              wheel_r = size // 8
              draw.ellipse([x0 - wheel_r//2, y0 + box_h - wheel_r//2, x0 + wheel_r*1.5, y0 + box_h + wheel_r*1.5], fill=(18, 18, 24, 255))
              draw.ellipse([x0 + box_w - wheel_r*1.5, y0 + box_h - wheel_r//2, x0 + box_w + wheel_r//2, y0 + box_h + wheel_r*1.5], fill=(18, 18, 24, 255))

              os.makedirs(os.path.dirname(filename), exist_ok=True)
              img.save(filename, 'PNG')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in densities.items():
              path_base = f"app/src/main/res/{folder}"
              create_icon(size, f"{path_base}/ic_launcher.png")
              create_icon(size, f"{path_base}/ic_launcher_round.png")

          if role == "driver":
              p = Path("app/build.gradle")
              content = p.read_text()
              if "firebase-bom" not in content:
                  target = "dependencies {"
                  replacement = "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:32.8.1')\n    implementation 'com.google.firebase:firebase-database'"
                  content = content.replace(target, replacement, 1)
                  p.write_text(content)

              manifest_path = Path("app/src/main/AndroidManifest.xml")
              s = manifest_path.read_text()

              permissions = [
                  "POST_NOTIFICATIONS",
                  "WAKE_LOCK",
                  "FOREGROUND_SERVICE",
                  "FOREGROUND_SERVICE_SPECIAL_USE",
                  "ACCESS_NETWORK_STATE",
                  "INTERNET"
              ]

              for perm in permissions:
                  line = f'<uses-permission android:name="android.permission.{perm}" />'
                  if line not in s:
                      s = s.replace("</manifest>", f"    {line}\n</manifest>")

              service = """
                  <service
                      android:name="com.baqubah.driver.DriverStatusService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Driver availability status notification" />
                  </service>
              """

              if "com.baqubah.driver.DriverStatusService" not in s:
                  s = s.replace("</application>", service + "\n</application>")

              manifest_path.write_text(s)

              java_dir = Path("app/src/main/java/com/baqubah/driver")
              java_dir.mkdir(parents=True, exist_ok=True)

              (java_dir / "DriverStatusService.java").write_text("""package com.baqubah.driver;

              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.app.Service;
              import android.content.Intent;
              import android.os.Build;
              import android.os.IBinder;
              import androidx.core.app.NotificationCompat;

              public class DriverStatusService extends Service {
                  public static final String ACTION_UPDATE = "com.baqubah.driver.UPDATE_STATUS";
                  public static final String ACTION_STOP = "com.baqubah.driver.STOP_STATUS";
                  public static final String EXTRA_ONLINE = "online";
                  private static final String CHANNEL_ID = "driver_status_silent";
                  private static final int NOTIFICATION_ID = 7401;

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Driver Status",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Driver Status Service");
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          channel.setShowBadge(false);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                          stopForeground(true);
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      boolean online = intent != null &&
                          intent.getBooleanExtra(EXTRA_ONLINE, false);

                      startForeground(NOTIFICATION_ID, makeNotification(online));
                      return START_STICKY;
                  }

                  private Notification makeNotification(boolean online) {
                      Intent open = new Intent(this, MainActivity.class);
                      open.setFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      PendingIntent pi = PendingIntent.getActivity(
                          this, 7402, open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                      String status = online
                          ? "Online 鈥� Ready for orders"
                          : "Offline";

                      return new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle("Baqubah Driver")
                          .setContentText(status)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setSilent(true)
                          .setCategory(NotificationCompat.CATEGORY_SERVICE)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }
              }
              """)

              (java_dir / "DriverStatusPlugin.java").write_text("""package com.baqubah.driver;

              import android.content.Intent;
              import android.os.Build;
              import com.getcapacitor.Plugin;
              import com.getcapacitor.PluginCall;
              import com.getcapacitor.PluginMethod;
              import com.getcapacitor.annotation.CapacitorPlugin;

              @CapacitorPlugin(name = "DriverStatus")
              public class DriverStatusPlugin extends Plugin {
                  @PluginMethod
                  public void updateStatus(PluginCall call) {
                      boolean online = call.getBoolean("online", false);

                      if (!online) {
                          Intent stop = new Intent(getContext(), DriverStatusService.class);
                          stop.setAction(DriverStatusService.ACTION_STOP);
                          getContext().startService(stop);
                          call.resolve();
                          return;
                      }

                      Intent start = new Intent(getContext(), DriverStatusService.class);
                      start.setAction(DriverStatusService.ACTION_UPDATE);
                      start.putExtra(DriverStatusService.EXTRA_ONLINE, true);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(start);
                      } else {
                          getContext().startService(start);
                      }

                      call.resolve();
                  }
              }
              """)

              (java_dir / "MainActivity.java").write_text("""package com.baqubah.driver;

              import android.os.Bundle;
              import com.getcapacitor.BridgeActivity;

              public class MainActivity extends BridgeActivity {
                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      registerPlugin(DriverStatusPlugin.class);
                      super.onCreate(savedInstanceState);
                  }
              }
              """)
          PY

      - name: Driver background reliability
        if: matrix.role == 'driver'
        run: |
          python3 native_driver_1.py
          python3 native_driver_2.py

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
