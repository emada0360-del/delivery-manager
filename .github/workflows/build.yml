name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: driver
            name: Baqubah Driver
            id: com.baqubah.driver
            page: driver.html
          - role: store
            name: Baqubah Store
            id: com.baqubah.store
            page: store.html
          - role: customer
            name: Baqubah Delivery
            id: com.baqubah.customer
            page: customer.html

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          mkdir www
          echo '<html></html>' > www/index.html
          npm init -y

          npm i --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/local-notifications@6

          if [ "${{ matrix.role }}" = "driver" ]; then
            npm i --legacy-peer-deps @capacitor/push-notifications@6
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "Missing GitHub secret GOOGLE_SERVICES_JSON"
              exit 1
            fi
          fi

          if [ "${{ matrix.role }}" = "customer" ]; then
            npm i --legacy-peer-deps @capacitor/device@6
          fi

          cat > capacitor.config.json <<CFG
          {
            "appId": "${{ matrix.id }}",
            "appName": "${{ matrix.name }}",
            "webDir": "www",
            "server": {
              "url": "https://emada0360-del.github.io/delivery-manager/${{ matrix.page }}",
              "cleartext": false
            }
          }
          CFG

          npx cap add android
          npx cap sync android

          if [ "${{ matrix.role }}" = "driver" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Generate Modern App Icon & Firebase Service
        env:
          APP_ROLE: ${{ matrix.role }}
        run: |
          pip install Pillow --break-system-packages

          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw

          role = os.environ.get("APP_ROLE", "store")
          os.chdir("app/android")

          W = (255, 255, 255, 255)
          T = (0, 0, 0, 0)
          C = 1080

          def gradient(c1, c2, size=432):
              img = Image.new("RGBA", (size, size))
              d = ImageDraw.Draw(img)
              n = size * 2
              for i in range(n):
                  t = i / n
                  col = tuple(int(c1[k] + (c2[k] - c1[k]) * t) for k in range(3)) + (255,)
                  d.line([(i, 0), (0, i)], fill=col, width=2)
              hl = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              ImageDraw.Draw(hl).ellipse([-size * .3, -size * .5, size * .9, size * .5], fill=(255, 255, 255, 38))
              return Image.alpha_composite(img, hl)

          def glyph_driver():
              im = Image.new("RGBA", (C, C), T)
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([250, 330, 500, 540], radius=34, fill=W)
              d.rounded_rectangle([290, 380, 460, 410], radius=10, fill=T)
              d.rounded_rectangle([300, 560, 560, 620], radius=30, fill=W)
              d.polygon([(540, 620), (700, 620), (740, 700), (540, 700)], fill=W)
              d.line([(690, 640), (640, 430)], fill=W, width=44)
              d.rounded_rectangle([590, 400, 720, 450], radius=24, fill=W)
              for cx in (340, 740):
                  d.ellipse([cx - 92, 608, cx + 92, 792], fill=W)
                  d.ellipse([cx - 52, 648, cx + 52, 752], fill=T)
              return im

          def glyph_store():
              im = Image.new("RGBA", (C, C), T)
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([280, 330, 800, 470], radius=30, fill=W)
              for i in range(5):
                  x = 280 + i * 104 + 52
                  d.ellipse([x - 52, 420, x + 52, 524], fill=W)
              for x in (384, 488, 592, 696):
                  d.line([(x, 340), (x, 440)], fill=T, width=12)
              d.rounded_rectangle([320, 500, 760, 770], radius=30, fill=W)
              d.rounded_rectangle([350, 590, 470, 690], radius=16, fill=T)
              d.rounded_rectangle([510, 590, 610, 770], radius=16, fill=T)
              d.rounded_rectangle([650, 590, 730, 690], radius=16, fill=T)
              return im

          def glyph_customer():
              im = Image.new("RGBA", (C, C), T)
              d = ImageDraw.Draw(im)
              d.ellipse([340, 270, 740, 670], fill=W)
              d.polygon([(372, 540), (708, 540), (540, 800)], fill=W)
              d.rounded_rectangle([450, 430, 630, 580], radius=22, fill=T)
              d.arc([480, 360, 600, 480], 180, 360, fill=T, width=22)
              return im

          def mask(size, circle):
              m = Image.new("L", (size * 4, size * 4), 0)
              d = ImageDraw.Draw(m)
              if circle:
                  d.ellipse([0, 0, size * 4 - 1, size * 4 - 1], fill=255)
              else:
                  d.rounded_rectangle([0, 0, size * 4 - 1, size * 4 - 1], radius=int(size * 4 / 4.6), fill=255)
              return m.resize((size, size), Image.LANCZOS)

          cfg = {
              "driver": ((255, 94, 98), (190, 0, 70), glyph_driver),
              "store": ((52, 211, 153), (37, 99, 235), glyph_store),
              "customer": ((99, 102, 241), (168, 85, 247), glyph_customer),
          }
          c1, c2, gfn = cfg.get(role, cfg["store"])
          bg = gradient(c1, c2)
          fg = gfn()
          base = Path("app/src/main/res")
          dens = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}

          for name, (legacy, adaptive) in dens.items():
              out = base / ("mipmap-" + name)
              out.mkdir(parents=True, exist_ok=True)
              bgS = bg.resize((adaptive, adaptive), Image.LANCZOS)
              fgS = fg.resize((adaptive, adaptive), Image.LANCZOS)
              bgS.save(out / "ic_bg.png")
              fgS.save(out / "ic_fg.png")
              comp = Image.alpha_composite(bgS, fgS).resize((legacy, legacy), Image.LANCZOS)
              for fname, circ in (("ic_launcher.png", False), ("ic_launcher_round.png", True)):
                  o = Image.new("RGBA", (legacy, legacy), T)
                  o.paste(comp, (0, 0), mask(legacy, circ))
                  o.save(out / fname)

          any26 = base / "mipmap-anydpi-v26"
          any26.mkdir(parents=True, exist_ok=True)
          xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_bg"/>
              <foreground android:drawable="@mipmap/ic_fg"/>
              <monochrome android:drawable="@mipmap/ic_fg"/>
          </adaptive-icon>"""
          xml = xml.replace("\n          ", "\n")
          for n in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (any26 / n).write_text(xml)

          if role == "customer":
              manifest_path = Path("app/src/main/AndroidManifest.xml")
              s = manifest_path.read_text()

              for perm in ["INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS"]:
                  line = f'<uses-permission android:name="android.permission.{perm}" />'
                  if line not in s:
                      s = s.replace("<application", f"{line}\n    <application", 1)

              for feat in ["android.hardware.microphone", "android.hardware.location.gps"]:
                  line = f'<uses-feature android:name="{feat}" android:required="false" />'
                  if line not in s:
                      s = s.replace("<application", f"{line}\n    <application", 1)

              manifest_path.write_text(s)

          if role == "driver":
              p = Path("app/build.gradle")
              content = p.read_text()
              if "firebase-bom" not in content:
                  target = "dependencies {"
                  replacement = "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:32.8.1')\n    implementation 'com.google.firebase:firebase-database'"
                  content = content.replace(target, replacement, 1)
                  p.write_text(content)

              manifest_path = Path("app/src/main/AndroidManifest.xml")
              s = manifest_path.read_text()

              permissions = [
                  "POST_NOTIFICATIONS",
                  "WAKE_LOCK",
                  "FOREGROUND_SERVICE",
                  "FOREGROUND_SERVICE_SPECIAL_USE",
                  "ACCESS_NETWORK_STATE",
                  "INTERNET"
              ]

              for perm in permissions:
                  line = f'<uses-permission android:name="android.permission.{perm}" />'
                  if line not in s:
                      s = s.replace("<application", f"{line}\n    <application", 1)

              service = """
                  <service
                      android:name="com.baqubah.driver.DriverStatusService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Driver availability status notification" />
                  </service>
              """

              if "com.baqubah.driver.DriverStatusService" not in s:
                  s = s.replace("</application>", service + "\n</application>")

              manifest_path.write_text(s)

              java_dir = Path("app/src/main/java/com/baqubah/driver")
              java_dir.mkdir(parents=True, exist_ok=True)

              (java_dir / "DriverStatusService.java").write_text("""package com.baqubah.driver;

              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.app.Service;
              import android.content.Intent;
              import android.os.Build;
              import android.os.IBinder;
              import androidx.core.app.NotificationCompat;

              public class DriverStatusService extends Service {
                  public static final String ACTION_UPDATE = "com.baqubah.driver.UPDATE_STATUS";
                  public static final String ACTION_STOP = "com.baqubah.driver.STOP_STATUS";
                  public static final String EXTRA_ONLINE = "online";
                  private static final String CHANNEL_ID = "driver_status_silent";
                  private static final int NOTIFICATION_ID = 7401;

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Driver Status",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Driver Status Service");
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          channel.setShowBadge(false);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                          stopForeground(true);
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      boolean online = intent != null &&
                          intent.getBooleanExtra(EXTRA_ONLINE, false);

                      startForeground(NOTIFICATION_ID, makeNotification(online));
                      return START_STICKY;
                  }

                  private Notification makeNotification(boolean online) {
                      Intent open = new Intent(this, MainActivity.class);
                      open.setFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      PendingIntent pi = PendingIntent.getActivity(
                          this, 7402, open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                      String status = online
                          ? "Online - Ready for orders"
                          : "Offline";

                      return new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle("Baqubah Driver")
                          .setContentText(status)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setSilent(true)
                          .setCategory(NotificationCompat.CATEGORY_SERVICE)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }
              }
              """)

              (java_dir / "DriverStatusPlugin.java").write_text("""package com.baqubah.driver;

              import android.content.Intent;
              import android.os.Build;
              import com.getcapacitor.Plugin;
              import com.getcapacitor.PluginCall;
              import com.getcapacitor.PluginMethod;
              import com.getcapacitor.annotation.CapacitorPlugin;

              @CapacitorPlugin(name = "DriverStatus")
              public class DriverStatusPlugin extends Plugin {
                  @PluginMethod
                  public void updateStatus(PluginCall call) {
                      boolean online = call.getBoolean("online", false);

                      if (!online) {
                          Intent stop = new Intent(getContext(), DriverStatusService.class);
                          stop.setAction(DriverStatusService.ACTION_STOP);
                          getContext().startService(stop);
                          call.resolve();
                          return;
                      }

                      Intent start = new Intent(getContext(), DriverStatusService.class);
                      start.setAction(DriverStatusService.ACTION_UPDATE);
                      start.putExtra(DriverStatusService.EXTRA_ONLINE, true);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(start);
                      } else {
                          getContext().startService(start);
                      }

                      call.resolve();
                  }
              }
              """)

              (java_dir / "MainActivity.java").write_text("""package com.baqubah.driver;

              import android.os.Bundle;
              import com.getcapacitor.BridgeActivity;

              public class MainActivity extends BridgeActivity {
                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      registerPlugin(DriverStatusPlugin.class);
                      super.onCreate(savedInstanceState);
                  }
              }
              """)
          PY

      - name: Driver background reliability
        if: matrix.role == 'driver'
        run: |
          for f in native_driver_1.py native_driver_2.py native_driver_3.py; do
            if [ ! -f "$f" ]; then
              echo "Missing file in repo root: $f"
              exit 1
            fi
          done
          python3 native_driver_1.py
          python3 native_driver_2.py
          python3 native_driver_3.py

      - name: Store background reliability
        if: matrix.role == 'store'
        run: |
          if [ ! -f native_store_1.py ]; then
            echo "Missing file in repo root: native_store_1.py"
            exit 1
          fi
          python3 native_store_1.py

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.role }}-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
