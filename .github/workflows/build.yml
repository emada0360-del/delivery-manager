name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: driver
            name: Baqubah Driver
            id: com.baqubah.driver
            page: driver.html
          - role: store
            name: Baqubah Store
            id: com.baqubah.store
            page: store.html

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir app
          cd app
          mkdir www
          echo '<html></html>' > www/index.html
          npm init -y

          npm i --legacy-peer-deps \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/local-notifications@6

          if [ "${{ matrix.role }}" = "driver" ]; then
            npm i --legacy-peer-deps @capacitor/push-notifications@6
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "Missing GitHub secret GOOGLE_SERVICES_JSON"
              exit 1
            fi
          fi

          cat > capacitor.config.json <<CFG
          {
            "appId": "${{ matrix.id }}",
            "appName": "${{ matrix.name }}",
            "webDir": "www",
            "server": {
              "url": "https://emada0360-del.github.io/delivery-manager/${{ matrix.page }}",
              "cleartext": false
            }
          }
          CFG

          npx cap add android
          npx cap sync android

          if [ "${{ matrix.role }}" = "driver" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Generate Custom Motorcycle App Icon & Firebase Service
        env:
          APP_ROLE: ${{ matrix.role }}
        run: |
          pip install Pillow --break-system-packages

          python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw

          role = os.environ.get("APP_ROLE", "store")
          os.chdir("app/android")

          def create_icon(size, filename):
              img = Image.new('RGBA', (size, size), (18, 18, 24, 255))
              draw = ImageDraw.Draw(img)
              
              margin = size // 10
              draw.ellipse([margin, margin, size - margin, size - margin], fill=(225, 29, 72, 255))
              
              box_w = size // 2.5
              box_h = size // 3
              x0 = (size - box_w) // 2
              y0 = (size - box_h) // 2 + size // 20
              draw.rounded_rectangle([x0, y0, x0 + box_w, y0 + box_h], radius=size//16, fill=(255, 255, 255, 255))
              
              wheel_r = size // 8
              draw.ellipse([x0 - wheel_r//2, y0 + box_h - wheel_r//2, x0 + wheel_r*1.5, y0 + box_h + wheel_r*1.5], fill=(18, 18, 24, 255))
              draw.ellipse([x0 + box_w - wheel_r*1.5, y0 + box_h - wheel_r//2, x0 + box_w + wheel_r//2, y0 + box_h + wheel_r*1.5], fill=(18, 18, 24, 255))

              os.makedirs(os.path.dirname(filename), exist_ok=True)
              img.save(filename, 'PNG')

          densities = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in densities.items():
              path_base = f"app/src/main/res/{folder}"
              create_icon(size, f"{path_base}/ic_launcher.png")
              create_icon(size, f"{path_base}/ic_launcher_round.png")

          if role == "driver":
              p = Path("app/build.gradle")
              content = p.read_text()
              if "firebase-bom" not in content:
                  target = "dependencies {"
                  replacement = "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:32.8.1')\n    implementation 'com.google.firebase:firebase-database'"
                  content = content.replace(target, replacement, 1)
                  p.write_text(content)

              manifest_path = Path("app/src/main/AndroidManifest.xml")
              s = manifest_path.read_text()

              permissions = [
                  "POST_NOTIFICATIONS",
                  "WAKE_LOCK",
                  "FOREGROUND_SERVICE",
                  "FOREGROUND_SERVICE_SPECIAL_USE",
                  "ACCESS_NETWORK_STATE",
                  "INTERNET"
              ]

              for perm in permissions:
                  line = f'<uses-permission android:name="android.permission.{perm}" />'
                  if line not in s:
                      s = s.replace("</manifest>", f"    {line}\n</manifest>")

              service = """
                  <service
                      android:name="com.baqubah.driver.DriverStatusService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Driver availability status notification" />
                  </service>
              """

              if "com.baqubah.driver.DriverStatusService" not in s:
                  s = s.replace("</application>", service + "\n</application>")

              manifest_path.write_text(s)

              java_dir = Path("app/src/main/java/com/baqubah/driver")
              java_dir.mkdir(parents=True, exist_ok=True)

              (java_dir / "DriverStatusService.java").write_text("""package com.baqubah.driver;

              import android.app.Notification;
              import android.app.NotificationChannel;
              import android.app.NotificationManager;
              import android.app.PendingIntent;
              import android.app.Service;
              import android.content.Intent;
              import android.os.Build;
              import android.os.IBinder;
              import androidx.core.app.NotificationCompat;

              public class DriverStatusService extends Service {
                  public static final String ACTION_UPDATE = "com.baqubah.driver.UPDATE_STATUS";
                  public static final String ACTION_STOP = "com.baqubah.driver.STOP_STATUS";
                  public static final String EXTRA_ONLINE = "online";
                  private static final String CHANNEL_ID = "driver_status_silent";
                  private static final int NOTIFICATION_ID = 7401;

                  @Override
                  public void onCreate() {
                      super.onCreate();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "Driver Status",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          channel.setDescription("Driver Status Service");
                          channel.setSound(null, null);
                          channel.enableVibration(false);
                          channel.setShowBadge(false);
                          NotificationManager nm = getSystemService(NotificationManager.class);
                          if (nm != null) nm.createNotificationChannel(channel);
                      }
                  }

                  @Override
                  public int onStartCommand(Intent intent, int flags, int startId) {
                      if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                          stopForeground(true);
                          stopSelf();
                          return START_NOT_STICKY;
                      }

                      boolean online = intent != null &&
                          intent.getBooleanExtra(EXTRA_ONLINE, false);

                      startForeground(NOTIFICATION_ID, makeNotification(online));
                      return START_STICKY;
                  }

                  private Notification makeNotification(boolean online) {
                      Intent open = new Intent(this, MainActivity.class);
                      open.setFlags(
                          Intent.FLAG_ACTIVITY_SINGLE_TOP |
                          Intent.FLAG_ACTIVITY_CLEAR_TOP
                      );

                      PendingIntent pi = PendingIntent.getActivity(
                          this, 7402, open,
                          PendingIntent.FLAG_UPDATE_CURRENT |
                          PendingIntent.FLAG_IMMUTABLE
                      );

                      String status = online
                          ? "Online 鈥� Ready for orders"
                          : "Offline";

                      return new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(getApplicationInfo().icon)
                          .setContentTitle("Baqubah Driver")
                          .setContentText(status)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setSilent(true)
                          .setCategory(NotificationCompat.CATEGORY_SERVICE)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();
                  }

                  @Override
                  public IBinder onBind(Intent intent) {
                      return null;
                  }
              }
              """)

              (java_dir / "DriverStatusPlugin.java").write_text("""package com.baqubah.driver;

              import android.content.Intent;
              import android.os.Build;
              import com.getcapacitor.Plugin;
              import com.getcapacitor.PluginCall;
              import com.getcapacitor.PluginMethod;
              import com.getcapacitor.annotation.CapacitorPlugin;

              @CapacitorPlugin(name = "DriverStatus")
              public class DriverStatusPlugin extends Plugin {
                  @PluginMethod
                  public void updateStatus(PluginCall call) {
                      boolean online = call.getBoolean("online", false);

                      if (!online) {
                          Intent stop = new Intent(getContext(), DriverStatusService.class);
                          stop.setAction(DriverStatusService.ACTION_STOP);
                          getContext().startService(stop);
                          call.resolve();
                          return;
                      }

                      Intent start = new Intent(getContext(), DriverStatusService.class);
                      start.setAction(DriverStatusService.ACTION_UPDATE);
                      start.putExtra(DriverStatusService.EXTRA_ONLINE, true);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          getContext().startForegroundService(start);
                      } else {
                          getContext().startService(start);
                      }

                      call.resolve();
                  }
              }
              """)

              (java_dir / "MainActivity.java").write_text("""package com.baqubah.driver;

              import android.os.Bundle;
              import com.getcapacitor.BridgeActivity;

              public class MainActivity extends BridgeActivity {
                  @Override
                  public void onCreate(Bundle savedInstanceState) {
                      registerPlugin(DriverStatusPlugin.class);
                      super.onCreate(savedInstanceState);
                  }
              }
              """)
          PY

      - name: Driver background reliability
        if: matrix.role == 'driver'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/android/app/src/main")
          pkg = base / "java/com/baqubah/driver"

          # ---- Manifest: vibrate + battery exemption + default FCM channel
          mp = base / "AndroidManifest.xml"
          m = mp.read_text()
          for perm in ("VIBRATE", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"):
              line = f'<uses-permission android:name="android.permission.{perm}" />'
              if line not in m:
                  m = m.replace("</manifest>", f"    {line}\n</manifest>")
          meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="orders_alarm" />'
          if "default_notification_channel_id" not in m:
              m = m.replace("</application>", f"    {meta}\n</application>")
          mp.write_text(m)

          # ---- Looping alarm (sound + vibration) that keeps going in background
          (pkg / "AlarmHelper.java").write_text("""package com.baqubah.driver;

          import android.content.Context;
          import android.media.AudioAttributes;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.VibrationEffect;
          import android.os.Vibrator;

          public class AlarmHelper {
              private static Ringtone ring;
              private static Vibrator vib;

              public static synchronized void start(Context c) {
                  if (ring != null) return;
                  try {
                      ring = RingtoneManager.getRingtone(c, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                      ring.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build());
                      if (Build.VERSION.SDK_INT >= 28) ring.setLooping(true);
                      ring.play();
                  } catch (Exception e) {}
                  try {
                      vib = (Vibrator) c.getSystemService(Context.VIBRATOR_SERVICE);
                      long[] p = {0, 600, 300, 600, 300, 600, 1200};
                      if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createWaveform(p, 0));
                      else vib.vibrate(p, 0);
                  } catch (Exception e) {}
              }

              public static synchronized void stop() {
                  try { if (ring != null) ring.stop(); } catch (Exception e) {}
                  ring = null;
                  try { if (vib != null) vib.cancel(); } catch (Exception e) {}
                  vib = null;
              }
          }
          """)

          # ---- Plugin: alarm + native Firebase login (no password is stored)
          pp = pkg / "DriverStatusPlugin.java"
          s = pp.read_text()
          if "public void setLogin" not in s:
              s = s.replace("public class DriverStatusPlugin extends Plugin {", """public class DriverStatusPlugin extends Plugin {
              @PluginMethod
              public void alarm(PluginCall call) {
                  boolean on = call.getBoolean("on", false);
                  if (on) AlarmHelper.start(getContext());
                  else AlarmHelper.stop();
                  call.resolve();
              }

              @PluginMethod
              public void setLogin(PluginCall call) {
                  String email = call.getString("email");
                  String pass = call.getString("password");
                  if (email != null && pass != null) {
                      try {
                          com.google.firebase.auth.FirebaseAuth a = com.google.firebase.auth.FirebaseAuth.getInstance();
                          com.google.firebase.auth.FirebaseUser u = a.getCurrentUser();
                          boolean same = u != null && email.equalsIgnoreCase(String.valueOf(u.getEmail()));
                          if (!same) a.signInWithEmailAndPassword(email, pass);
                      } catch (Exception e) {}
                  }
                  call.resolve();
              }

              @PluginMethod
              public void clearLogin(PluginCall call) {
                  try { com.google.firebase.auth.FirebaseAuth.getInstance().signOut(); } catch (Exception e) {}
                  AlarmHelper.stop();
                  call.resolve();
              }
          """, 1)
              pp.write_text(s)

          # ---- Gradle: add Firebase Auth
          gp = Path("app/android/app/build.gradle")
          g = gp.read_text()
          if "firebase-auth" not in g:
              g = g.replace("implementation 'com.google.firebase:firebase-database'", "implementation 'com.google.firebase:firebase-database'\n    implementation 'com.google.firebase:firebase-auth'", 1)
              gp.write_text(g)

          # ---- Service: foreground + wake lock + native listener on pending orders
          (pkg / "DriverStatusService.java").write_text("""package com.baqubah.driver;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.FirebaseUser;
          import com.google.firebase.database.DataSnapshot;
          import com.google.firebase.database.DatabaseError;
          import com.google.firebase.database.FirebaseDatabase;
          import com.google.firebase.database.Query;
          import com.google.firebase.database.ValueEventListener;

          public class DriverStatusService extends Service {
              public static final String ACTION_UPDATE = "com.baqubah.driver.UPDATE_STATUS";
              public static final String ACTION_STOP = "com.baqubah.driver.STOP_STATUS";
              public static final String EXTRA_ONLINE = "online";
              private static final String CHANNEL_ID = "driver_status_silent";
              private static final String ALERT_CHANNEL = "orders_heads_up";
              private static final int NOTIFICATION_ID = 7401;
              private static final int ALERT_ID = 7403;
              private static final String DB_URL = "https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app";

              private PowerManager.WakeLock wl;
              private FirebaseAuth.AuthStateListener authL;
              private Query pendQ, mineQ;
              private ValueEventListener pendL, mineL;
              private String uid;
              private DataSnapshot pend;
              private boolean hasActive = false;
              private boolean watching = false;
              private String lastAlert = null;

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          NotificationChannel c1 = new NotificationChannel(CHANNEL_ID, "Driver Status", NotificationManager.IMPORTANCE_LOW);
                          c1.setSound(null, null);
                          c1.enableVibration(false);
                    
