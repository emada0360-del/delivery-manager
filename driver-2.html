<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baqubah Delivery | السائق</title>
<script>
window.notifyApp=async(t,b,l)=>{try{const P=window.Capacitor&&window.Capacitor.Plugins;if(!P||!P.LocalNotifications)return;await P.LocalNotifications.createChannel({id:'orders',name:'Orders',importance:5,sound:'default',vibration:true});await P.LocalNotifications.schedule({notifications:[{id:Math.floor(Math.random()*2e9),title:t,body:b,largeBody:l||b,channelId:'orders'}]});}catch(e){}};
(async()=>{try{const P=window.Capacitor&&window.Capacitor.Plugins;if(!P||!P.LocalNotifications)return;await P.LocalNotifications.requestPermissions();if(P.BackgroundMode){await P.BackgroundMode.enable();}}catch(e){}})();
</script>
<style>
:root{--bg:#f2f5f9;--ink:#172235;--pri:#1769aa;--ok:#218838;--bad:#c93030;--warn:#bd7200;--line:#e0e6ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,Arial;background:var(--bg);color:var(--ink);padding-bottom:50px}
button,input{font:inherit}
button{border:0;border-radius:8px;padding:12px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
input{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:8px;margin:7px 0 13px}
header{background:#14263d;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
header h2{margin:0;font-size:17px}
main{max-width:600px;margin:auto;padding:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px 6px;text-align:center;border:1px solid var(--line)}
.stat span{font-size:11px;color:#64748b;display:block;margin-bottom:4px;line-height:1.3}
.stat b{font-size:17px;color:var(--pri)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
.card.new{border:2px solid var(--pri);box-shadow:0 0 15px rgba(23,105,170,.15)}
.card.waiting{border:2px solid var(--warn);background:#fffbeb}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card p{margin:6px 0;font-size:14px}
.status-btn{width:100%;padding:16px;font-size:17px;border-radius:12px;margin-bottom:12px;display:flex;justify-content:center;align-items:center;gap:10px}
.status-btn.on{background:var(--ok)}
.status-btn.off{background:#6b7280}
.status-btn.blocked{background:#9ca3af;cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;background:#fff}
.badge{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700}
.badge.wait{background:#fef3c7;color:#b45309}
.fin-box{background:#f8fafc;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #e2e8f0}
.fin-row{display:flex;justify-content:space-between;margin-bottom:6px}
.fin-row:last-child{margin-bottom:0;border-top:1px dashed #cbd5e1;padding-top:6px;margin-top:6px;font-weight:700}
.debt-box{background:#fff1f2;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;border:1px solid #fecdd3}
.customer-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin:10px 0;text-align:center}
.customer-box b{font-size:14px;color:#1e3a8a;display:block;margin-bottom:8px}
.btn-group{display:flex;gap:8px}
.btn-group a{flex:1;padding:10px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;display:flex;justify-content:center;align-items:center;gap:5px}
.btn-call{background:#e0e7ff;color:#3730a3}
.btn-wa{background:#dcfce7;color:#166534}
.map-link{display:inline-block;background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:700;margin:6px 0 10px}
.warn{background:#fff3cd;color:#7a5200;padding:10px;border-radius:8px;margin-bottom:12px}
.grn{background:var(--ok)}.gry{background:#64748b}.red{background:var(--bad)}
#login{max-width:380px;margin:50px auto}
#err{color:#b42318;font-weight:600;text-align:center;margin-top:8px}
#msg{padding:10px;border-radius:8px;margin-bottom:12px;display:none;background:#e8f5e9;color:#176337;font-weight:600;text-align:center;position:sticky;top:70px;z-index:40}
[hidden]{display:none!important}
#mdl{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:99}
#mdl>div{background:#fff;border-radius:14px;padding:18px;width:min(92%,360px)}
#mdl p{margin:0 0 14px;line-height:1.7}
#mdl .mr{display:flex;gap:8px}#mdl .mr button{flex:1}
</style>
</head>
<body>
<section id="login" class="box">
<h2 style="text-align:center;margin-top:0">دخول السائق <small style="font-size:11px;color:#94a3b8">v17</small></h2>
<form id="lf" onsubmit="document.getElementById('err').textContent='جاري تحميل المكتبات... انتظر لين يطلع تحت الزر جاهز';return false">
<label>رقم الهاتف</label><input id="un" type="tel" required autocomplete="username" autocapitalize="none" placeholder="07XXXXXXXXX">
<label>كلمة المرور</label><input id="pw" type="password" required autocomplete="current-password">
<button id="lb" style="width:100%">دخول</button>
</form>
<div id="err"></div>
<div id="diag" style="text-align:center;font-size:12px;color:#64748b;margin-top:6px;direction:ltr"></div>
</section>

<div id="app" hidden>
<header><h2 id="drvName">السائق</h2><button id="out" class="red" style="padding:8px 12px;font-size:13px">خروج</button></header>
<main>
<div id="msg"></div>
<div id="off" class="warn" style="background:#fdecea;color:#a61b1b" hidden>لا يوجد اتصال بالإنترنت. ما راح توصلك طلبات جديدة.</div>
<div class="grid">
<div class="stat"><span>الطلبات المكتملة</span><b id="statDone">0</b></div>
<div class="stat"><span>محفظتي (دين)</span><b id="statDebt">0</b></div>
<div class="stat"><span>أرباحي اليوم</span><b id="statProfit">0</b></div>
</div>
<div id="warnBox" class="warn" style="background:#fdecea;color:#b42318" hidden><b>تنبيه:</b> وصلت للحد الأقصى من الدين. راجع الإدارة لتصفير المحفظة.</div>
<button id="btnStatus" class="status-btn off"><span class="dot"></span> <span id="statusTxt">غير متصل (مغلق)</span></button>
<div id="annBox" class="warn" hidden></div>
<div id="availContainer" hidden><h3>الطلبات المتاحة</h3><div id="availList"></div></div>
<div id="activeContainer" hidden><h3>طلباتي الحالية</h3><div id="activeList"></div></div>
</main>
</div>

<div id="mdl" hidden><div><p id="mdt"></p><div class="mr"><button id="mdy">تأكيد</button><button id="mdn" class="gry">إلغاء</button></div></div></div>

<script>
var __d=function(t){var e=document.getElementById('diag');if(e)e.textContent=t;};
function __set(base){return new Promise(function(res,rej){var names=['app','auth','database'],loaded=0,failed=false,t;
names.forEach(function(n){var s=document.createElement('script');s.async=false;s.src=base(n);
s.onload=function(){loaded++;__d('تم تحميل '+loaded+' من 3 ...');if(loaded===3){clearTimeout(t);res();}};
s.onerror=function(){if(!failed){failed=true;clearTimeout(t);rej(new Error('فشل تحميل '+base(n)));}};
document.head.appendChild(s);});
t=setTimeout(function(){if(!failed&&loaded<3){failed=true;rej(new Error('انتهت المهلة'));}},90000);});}
function __load(){var bases=[function(n){return 'https://www.gstatic.com/firebasejs/10.14.1/firebase-'+n+'-compat.js';},function(n){return 'https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-'+n+'-compat.js';},function(n){return 'https://cdnjs.cloudflare.com/ajax/libs/firebase/10.14.1/firebase-'+n+'-compat.min.js';}],i=0;
function next(){if(i>=bases.length)return Promise.reject(new Error('تعذر تحميل مكتبات Firebase من كل المصادر'));__d('جاري التحميل (مصدر '+(i+1)+' من 3) ... قد ياخذ وقت مع النت البطيء');var b=bases[i++];return __set(b).catch(function(){return next();});}
return next();}
</script>
<script>
function __main(){
const ref=(d,p)=>p?d.ref(p):d.ref();
const query=(r,...c)=>c.reduce((q,f)=>f(q),r);
const orderByChild=k=>q=>q.orderByChild(k);
const equalTo=v=>q=>q.equalTo(v);
const onValue=(q,cb,eb)=>{const h=q.on("value",cb,function(e){try{eb&&eb(e)}catch(_){}});return ()=>q.off("value",h)};
const get=q=>q.once("value");
const set=(r,v)=>r.set(v);
const update=(r,v)=>r.update(v);
const onDisconnect=r=>r.onDisconnect();
const serverTimestamp=()=>firebase.database.ServerValue.TIMESTAMP;
const signInWithEmailAndPassword=(a,e,p)=>a.signInWithEmailAndPassword(e,p);
const signOut=a=>a.signOut();
const onAuthStateChanged=(a,cb)=>a.onAuthStateChanged(cb);


const cfg={
 apiKey:"AIzaSyCFRVDAqu-daYJf_yIVMrFMPF95F6inhpc",
 authDomain:"baqubah-delivery-e729e.firebaseapp.com",
 databaseURL:"https://baqubah-delivery-e729e-default-rtdb.europe-west1.firebasedatabase.app/",
 projectId:"baqubah-delivery-e729e",
 storageBucket:"baqubah-delivery-e729e.firebasestorage.app",
 messagingSenderId:"450084520701",
 appId:"1:450084520701:web:719e2040338540ce36f494"
};
firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.database();
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString("en-US");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ask=t=>new Promise(r=>{$("mdt").textContent=t;$("mdl").hidden=false;const f=v=>{$("mdl").hidden=true;r(v)};$("mdy").onclick=()=>f(true);$("mdn").onclick=()=>f(false)});
const lerr=e=>{const c=e&&e.code||"";
 if(c==="auth/network-request-failed")return "تأكد من الإنترنت وحاول مرة ثانية.";
 if(c==="auth/too-many-requests")return "محاولات كثيرة، انتظر شوي وحاول.";
 if(["auth/invalid-credential","auth/user-not-found","auth/wrong-password","auth/invalid-email"].includes(c))return "رقم الهاتف أو كلمة المرور غير صحيحة.";
 return "خطأ: "+(c||(e&&e.message)||e);};
const notify=(t,b,l)=>{try{window.notifyApp&&window.notifyApp(t,b,l)}catch{}};
const speak=t=>{try{const S=window.speechSynthesis;if(!S)return;S.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";S.speak(u)}catch{}};
let AC=null;const wake=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch{}};
document.addEventListener("click",wake);document.addEventListener("touchstart",wake,{passive:true});
const beep=()=>{try{wake();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.4;o.start();o.stop(AC.currentTime+.35);navigator.vibrate&&navigator.vibrate([200,100,200])}catch{}};
const say=t=>{const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",4000)};
const setHtml=(id,h)=>{const e=$(id);if(e._h!==h){e._h=h;e.innerHTML=h}};

let uid=null,driver=null,settings={},isOnline=false,pos={lat:null,lng:null},debt=0,debtLimit=15000;
let pend={},mine={},finance={},privData={},stops=[],busy=false,seenAv=null,prevMine=null,gps=null,tick=null,pendLoaded=false;

$("lf").onsubmit=async e=>{
 e.preventDefault();$("err").textContent="";$("lb").disabled=true;
 try{await signInWithEmailAndPassword(auth,$("un").value.trim().toLowerCase()+"@baqubah.app",$("pw").value)}
 catch(er){$("err").textContent=lerr(er)}
 finally{$("lb").disabled=false}
};

onAuthStateChanged(auth,async u=>{
 if(!u){show(false);return}
 try{
  $("err").textContent="جاري فحص الحساب...";
  const me=(await get(ref(db,"users/"+u.uid))).val();
  if(!me){await signOut(auth);$("err").textContent="الحساب غير موجود بقاعدة البيانات.";return}
  if(me.role!=="driver"){await signOut(auth);$("err").textContent="هذا الحساب مو حساب سائق (الدور: "+(me.role||"غير محدد")+").";return}
  if(me.isActive===false){await signOut(auth);$("err").textContent="حسابك معطّل. راجع المدير.";return}
  uid=u.uid;driver=me;$("err").textContent="";
  $("drvName").textContent=me.name||"السائق";
  show(true);start();
 }catch(e){$("err").textContent="خطأ بعد الدخول: "+(e&&(e.code||e.message)||e)}
});

function show(on){$("login").hidden=on;$("app").hidden=!on;if(!on)clear()}
function clear(){stops.forEach(f=>{try{f()}catch{}});stops=[];pend={};mine={};finance={};privData={};seenAv=null;prevMine=null;pendLoaded=false;
 if(tick){clearInterval(tick);tick=null}
 if(gps!==null&&navigator.geolocation){try{navigator.geolocation.clearWatch(gps)}catch{}gps=null}}

function startGPS(){
 if(gps!==null||!navigator.geolocation)return;
 try{gps=navigator.geolocation.watchPosition(p=>{pos.lat=p.coords.latitude;pos.lng=p.coords.longitude},()=>{},{enableHighAccuracy:true})}catch{}
}

const activeOf=()=>{const a={};for(const k in mine){const o=mine[k];if(o&&!["delivered","cancelled"].includes(o.status))a[k]=o}return a};
const hasActive=()=>Object.keys(activeOf()).length>0;
const eh=e=>say("خطأ تحميل البيانات: "+(e&&(e.code||e.message)||e));

function start(){
 clear();startGPS();
 const pr=ref(db,"presence/"+uid);
 stops.push(onValue(ref(db,".info/connected"),s=>{
  $("off").hidden=s.val()===true;
  if(s.val()===true){onDisconnect(pr).set({online:false,lastSeen:serverTimestamp()}).then(()=>{if(isOnline)set(pr,{online:true,lastSeen:serverTimestamp()})}).catch(()=>{})}
 },()=>{}));
 stops.push(onValue(pr,s=>{const v=s.val()||{};if(!hasActive())isOnline=v.online===true;draw()},()=>{}));
 stops.push(onValue(ref(db,"settings"),s=>{
  settings=s.val()||{};debtLimit=Number(settings.debtLimit||15000);
  $("annBox").textContent=settings.announcement||"";$("annBox").hidden=!settings.announcement;draw()
 },()=>{}));
 stops.push(onValue(query(ref(db,"finance"),orderByChild("userId"),equalTo(uid)),s=>{finance=s.val()||{};draw()},()=>{}));
 stops.push(onValue(query(ref(db,"orders"),orderByChild("status"),equalTo("pending")),s=>{pend=s.val()||{};pendLoaded=true;draw()},eh));
 stops.push(onValue(query(ref(db,"orders"),orderByChild("driverId"),equalTo(uid)),s=>{
  mine=s.val()||{};
  if(prevMine){
   for(const id in mine){const o=mine[id],p=prevMine[id];
    if(p&&o&&p.status!==o.status){
     if(p.status==="waiting_store"&&o.status==="accepted"){notify("تمت الموافقة","المتجر وافق على طلبك، توجه للمتجر");speak("المتجر وافق على طلبك");say("المتجر وافق على طلبك")}
     else if(o.status==="cancelled"){notify("تم إلغاء الطلب","المتجر ألغى الطلب");speak("تم إلغاء الطلب");say("تم إلغاء الطلب")}
    }}
  }
  prevMine=mine;fetchPrivate();draw()
 },eh));
 stops.push(onValue(ref(db,"users/"+uid),s=>{const u=s.val();if(!u||u.isActive===false)logout(true)},()=>{}));
 tick=setInterval(draw,5000);
}

function fetchPrivate(){
 Object.keys(activeOf()).forEach(id=>{
  if(privData[id])return;
  get(ref(db,"orderPrivate/"+id)).then(s=>{if(s.exists()){privData[id]=s.val();draw()}}).catch(()=>{});
 });
}

function stats(){
 let d=0,tp=0,n=0;const t0=new Date().setHours(0,0,0,0);
 for(const id in mine){const o=mine[id];
  if(o&&o.status==="delivered"){n++;
   const sc=Number(o.storeCommission!==undefined?o.storeCommission:(settings.storeCommission||500));
   d+=Math.round(Number(o.platformDeliveryCommission)||0)+Math.round(sc);
   if(o.deliveredAt>=t0)tp+=Math.round(Number(o.driverProfit)||0);
  }}
 for(const id in finance){const f=finance[id];if(f&&f.type==="cash_received")d-=Math.round(Number(f.amount)||0)}
 if(d<0)d=0;debt=d;
 $("statDone").textContent=n;$("statDebt").textContent=fmt(d)+" د.ع";$("statProfit").textContent=fmt(tp)+" د.ع";
 $("warnBox").hidden=d<debtLimit;
}

function ui(){
 const act=hasActive(),btn=$("btnStatus");
 if(debt>=debtLimit&&!act){isOnline=false;btn.className="status-btn blocked";$("statusTxt").textContent="محظور (تجاوزت سقف الدين)";return}
 if(act){isOnline=true;btn.className="status-btn on";$("statusTxt").textContent="متصل (لديك طلب نشط)";return}
 if(isOnline){btn.className="status-btn on";$("statusTxt").textContent="متصل (متاح للطلبات)"}
 else{btn.className="status-btn off";$("statusTxt").textContent="غير متصل (مغلق)"}
}

function finBox(o){
 const sc=Number(o.storeCommission!==undefined?o.storeCommission:(settings.storeCommission||500));
 const fee=Number(o.deliveryFee)||0,pc=Math.round(fee*0.1),payStore=Math.round((Number(o.itemPrice)||0)-sc),collect=Math.round(Number(o.customerTotal)||0),profit=Math.round(fee*0.9);
 return `<div class="fin-box">
 <div class="fin-row" style="color:#dc3545"><span>تدفع للمتجر:</span> <b>${fmt(payStore)} د.ع</b></div>
 <div class="fin-row" style="color:#1769aa"><span>تستلم من الزبون:</span> <b>${fmt(collect)} د.ع</b></div>
 <div class="fin-row" style="color:#16a34a"><span>ربحك الصافي (الكروة):</span> <b>${fmt(profit)} د.ع</b></div></div>
 <div class="debt-box">
 <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المنصة (10%):</span> <b>${fmt(pc)} د.ع</b></div>
 <div class="fin-row" style="color:#b42318;margin-bottom:2px"><span>عمولة المتجر (ثابتة):</span> <b>${fmt(sc)} د.ع</b></div>
 <div class="fin-row" style="color:#b42318;border-top:1px solid #fecdd3;padding-top:4px;margin-top:4px"><span>سيضاف لدينك:</span> <b>${fmt(pc+sc)} د.ع</b></div></div>`;
}

function getDist(a,b,c,d){
 if(!a||!c)return 0;
 const R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180;
 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function draw(){
 if(!uid)return;
 stats();ui();
 const act=activeOf(),nAct=Object.keys(act).length,now=Date.now();
 // الطلبات المتاحة
 if(!isOnline||debt>=debtLimit){$("availContainer").hidden=true;seenAv=null}
 else if(pendLoaded){
  const av=Object.entries(pend).filter(([id,o])=>{
   if(!o||o.driverId)return false;
   if(o.rejectedBy&&o.rejectedBy[uid])return false;
   if(nAct>0)return (now-(o.createdAt||0))>120000;
   return true;
  });
  if(seenAv){const nws=av.filter(([id])=>!seenAv.has(id));if(nws.length){beep();speak("طلب جديد");
   nws.slice(0,3).forEach(([id,o])=>{
    const txt='* طلب متوفر لك من متجر "'+(o.storeName||"")+'"\n* لزبون في منطقة '+(o.area||"")+'\n* سارع بقبوله قبل غيرك';
    notify("طلب جديد",txt,txt);
   });}}
  seenAv=new Set(av.map(([id])=>id));
  $("availContainer").hidden=!av.length;
  setHtml("availList",av.map(([id,o])=>`<div class="card new">
   <div class="row"><b>طلب #${esc(id.slice(-6))}</b></div>
   <p><b>المتجر:</b> ${esc(o.storeName)}</p><p><b>المنطقة:</b> ${esc(o.area)}</p>
   ${o.storeMapUrl?`<a href="${esc(o.storeMapUrl)}" target="_blank" class="map-link">📍 فتح موقع المتجر على الخريطة</a>`:""}
   ${finBox(o)}
   <div style="display:flex;gap:8px;margin-top:10px"><button style="flex:2" data-a="accept" data-id="${esc(id)}">قبول الطلب</button><button class="red" style="flex:1" data-a="reject" data-id="${esc(id)}">رفض</button></div></div>`).join(""));
 }
 // طلباتي الحالية
 $("activeContainer").hidden=!nAct;
 setHtml("activeList",Object.entries(act).map(([id,o])=>{
  let btn="",warn="",badge="";const q=privData[id]||{};const st=typeof o.stepAt==="number"?o.stepAt:0;
  if(o.status==="waiting_store"){badge='<span class="badge wait">بانتظار موافقة المتجر</span>';btn='<div style="text-align:center;padding:15px;background:#fef3c7;color:#b45309;border-radius:8px;font-weight:700;margin-top:10px">يرجى الانتظار حتى يوافق المتجر على طلبك...</div>'}
  else if(o.status==="accepted"){badge='<span class="badge">بالطريق للمتجر</span>';
   if(o.storeLat&&pos.lat){const d=getDist(pos.lat,pos.lng,o.storeLat,o.storeLng);if(d>300)warn=`<p style="color:var(--bad);font-size:12px">أنت بعيد عن المتجر (${Math.round(d)}م)</p>`}
   btn='<button class="grn" style="width:100%;margin-top:10px" data-a="arrive" data-id="'+esc(id)+'">وصلت للمتجر</button>'}
  else if(o.status==="arrived_store"){badge='<span class="badge">وصل للمتجر</span>';const ok=(now-st)>60000;
   btn='<button class="grn" style="width:100%;margin-top:10px" '+(ok?"":"disabled")+' data-a="pick" data-id="'+esc(id)+'">'+(ok?"تم استلام الطلب":"انتظر دقيقة...")+'</button>'}
  else if(["picked_up","delivering"].includes(o.status)){badge='<span class="badge">بالطريق للزبون</span>';const ok=(now-st)>300000;
   btn='<button class="grn" style="width:100%;margin-top:10px" '+(ok?"":"disabled")+' data-a="done" data-id="'+esc(id)+'">'+(ok?"تم التوصيل للزبون":"انتظر 5 دقائق...")+'</button>'}
  const storeBox=`<div class="customer-box" style="background:#f0fdf4;border-color:#bbf7d0;padding:10px"><b style="color:#166534">هاتف المتجر: <span dir="ltr">${esc(o.storePhone||"غير متوفر")}</span></b>${o.storePhone?`<div class="btn-group" style="margin-top:4px"><a href="tel:${esc(o.storePhone)}" class="btn-call" style="background:#dcfce7;color:#166534">📞 اتصال بالمتجر</a></div>`:""}</div>`;
  let cust="";
  if(q.customerPhone&&o.status!=="waiting_store"){
   const wa="https://wa.me/964"+String(q.customerPhone).substring(1)+"?text="+encodeURIComponent("مرحباً، أنا سائق التوصيل، يرجى إرسال موقعك لتوصيل الطلب.");
   cust=`<div class="customer-box"><b>هاتف الزبون: <span dir="ltr">${esc(q.customerPhone)}</span></b>${q.customerName?`<div style="margin-bottom:8px;font-size:13px;color:#475569">الاسم: ${esc(q.customerName)}</div>`:""}${q.note?`<div style="margin-bottom:8px;font-size:13px;color:#b45309">ملاحظة: ${esc(q.note)}</div>`:""}<div class="btn-group"><a href="tel:${esc(q.customerPhone)}" class="btn-call">📞 اتصال</a><a href="${esc(wa)}" target="_blank" class="btn-wa">🟢 واتساب (طلب الموقع)</a></div></div>`;
  }
  return `<div class="card ${o.status==="waiting_store"?"waiting":""}"><div class="row"><b>#${esc(id.slice(-6))}</b> ${badge}</div>
   <p><b>المتجر:</b> ${esc(o.storeName)}</p><p><b>المنطقة:</b> ${esc(o.area)}</p>
   ${o.storeMapUrl?`<a href="${esc(o.storeMapUrl)}" target="_blank" class="map-link">📍 فتح موقع المتجر على الخريطة</a>`:""}
   ${storeBox}${finBox(o)}${cust}${warn}${btn}</div>`;
 }).join(""));
}

async function act(e){
 const b=e.target.closest("button[data-a]");if(!b||busy||b.disabled)return;
 const a=b.dataset.a,id=b.dataset.id,r=ref(db,"orders/"+id);busy=true;
 try{
  if(a==="accept"){
   if(debt>=debtLimit){say("لا يمكنك قبول الطلبات، تجاوزت سقف الدين");return}
   if(!isOnline){say("يجب أن تكون متصلاً لتقبل الطلب");return}
   await update(r,{driverId:uid,driverName:driver.name||"",driverPhone:driver.phone||"",status:"waiting_store",stepAt:serverTimestamp(),acceptedAt:Date.now()});
   say("تم قبول الطلب، بانتظار موافقة المتجر");speak("تم قبول الطلب، بانتظار موافقة المتجر");
  }else if(a==="reject"){
   await update(ref(db,"orders/"+id+"/rejectedBy"),{[uid]:true});say("تم رفض الطلب.");
  }else{
   const o=mine[id];if(!o)return;
   const map={arrive:"arrived_store",pick:"picked_up",done:"delivered"},ns=map[a];if(!ns)return;
   if(a==="arrive"&&o.storeLat&&pos.lat){const d=getDist(pos.lat,pos.lng,o.storeLat,o.storeLng);if(d>300){say("يجب أن تكون قريباً من المتجر (المسافة الحالية "+Math.round(d)+"م)");return}}
   if(a==="done"&&!(await ask("تأكيد تسليم الطلب للزبون؟")))return;
   const patch={status:ns,stepAt:serverTimestamp()};
   if(ns==="delivered"){const fee=Number(o.deliveryFee)||0,p=Math.round(fee*0.9);patch.deliveredAt=Date.now();patch.driverProfit=p;patch.platformDeliveryCommission=Math.round(fee-p)}
   await update(r,patch);
   if(ns==="delivered")speak("تم التوصيل بنجاح");else speak("تم تحديث الحالة");
  }
 }catch(er){say("فشلت العملية: "+(er&&(er.code||er.message)||er))}
 finally{busy=false}
}
$("availList").onclick=act;$("activeList").onclick=act;

$("btnStatus").onclick=()=>{
 if(debt>=debtLimit)return say("لا يمكنك الاتصال، تجاوزت سقف الدين");
 if(hasActive())return say("لا يمكنك الإغلاق ولديك طلبات نشطة");
 isOnline=!isOnline;
 set(ref(db,"presence/"+uid),{online:isOnline,lastSeen:serverTimestamp()}).catch(e=>say("تعذر تحديث الحالة: "+(e.code||e.message)));
 if(isOnline){startGPS();speak("أنت الآن متصل")}else speak("أنت الآن غير متصل");
 draw();
};

async function logout(force){
 if(!force&&hasActive())return say("لا يمكنك الخروج ولديك طلبات نشطة!");
 if(uid){try{await set(ref(db,"presence/"+uid),{online:false,lastSeen:serverTimestamp()})}catch{}}
 isOnline=false;clear();uid=null;await signOut(auth);
}
$("out").onclick=()=>logout(false);
window.__ok=true;

}
